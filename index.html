ly 'ĐGTH'. Evaluated with data_only=True to read formula results.\",\n        \"upload_inspect_label\": \"Select Excel project / inspection file (.xlsx, .xlsm):\",\n        \"btn_inspect\": \"Run Inspection\",\n        \"inspect_summary_metrics\": \"Inspection Summary Metrics\",\n        \"metric_total_items\": \"Total Jobs\",\n        \"metric_valid_items\": \"Valid / Matched\",\n        \"metric_error_items\": \"Errors / Missing\",\n        \"metric_sections\": \"Construction Sections\",\n        \"inspect_results_by_section\": \"Inspection Details by Construction Section\",\n        \"error_code_not_found\": \"Code does not exist in repository\",\n        \"error_name_mismatch\": \"Work name does not match repository\",\n        \"status_valid\": \"Valid\",\n        \"status_invalid\": \"Not in Repository\",\n        \"status_mismatch\": \"Name Mismatch\",\n        \"th_stt\": \"No.\",\n        \"th_code_in_file\": \"Code in File\",\n        \"th_code_normalized\": \"Normalized Code\",\n        \"th_name_in_file\": \"Name in File\",\n        \"th_repo_name\": \"Repository Name\",\n        \"th_check_status\": \"Verification Result\",\n        \"btn_export_inspect_report\": \"Export Inspection Report (.xlsx)\",\n        \"msg_sheet_dgth_not_found\": \"ERROR: Could not find sheet named 'ĐGTH' in the Excel file. Please verify sheet name!\",\n        \"msg_inspect_success\": \"Completed inspection for file '{filename}'!\",\n        \"msg_repo_empty_warn\": \"Warning: Data repository is currently empty. Please go to Tools -> Data Repository to upload a catalog first.\",\n        \"inspect_upload_help\": \"Processed strictly in session memory and cleared immediately after.\",\n        \"inspect_file_selected\": \"Inspection file\",\n        \"inspecting_spinner\": \"Reading sheet 'ĐGTH' with data_only=True and grouping by sections...\",\n        \"filter_mode_label\": \"Result display filter:\",\n        \"filter_all\": \"All\",\n        \"filter_errors\": \"Show only ERRORS / MISSING\",\n        \"filter_valid\": \"Show only VALID jobs\",\n        \"all_valid_badge\": \"🟢 All Valid\",\n        \"error_badge\": \"🔴 {count} errors\",\n        \"jobs_count_label\": \"jobs\",\n        \"no_matching_jobs\": \"No jobs matching the selected filter.\",\n        \"status_not_found_icon\": \"❌ Not in Repository\",\n        \"status_valid_icon\": \"✅ Valid\",\n        \"th_excel_row\": \"Excel Row\",\n        \n        # Home Dashboard Cards\n        \"home_quick_overview\": \"System Overview\",\n        \"home_card_repo_title\": \"Work Code Data Repository\",\n        \"home_card_repo_desc\": \"Centralized storage, smart table extraction from Word, Excel, PDF, and XX.YYYYY standardization.\",\n        \"home_card_inspect_title\": \"Work Code Inspection\",\n        \"home_card_inspect_desc\": \"Automated scanning of sheet ĐGTH, grouping by section, instant detection of missing or mismatched codes.\",\n        \"home_card_admin_title\": \"Account Management\",\n        \"home_card_admin_desc\": \"Secure role-based ecosystem, Google account approval queue, full integrity protection.\",\n        \"btn_go\": \"Open Tool\",\n        \"database_status\": \"Database Backend Status\",\n        \"db_cloudflare_d1\": \"Cloudflare D1\",\n        \"db_sqlite_local\": \"Local SQLite\",\n    }\n}\n\ndef t(key: str, lang: str = \"vi\", **kwargs) -> str:\n    \"\"\"Translate a key into the selected language with optional string interpolation.\"\"\"\n    lang_dict = TRANSLATIONS.get(lang, TRANSLATIONS[\"vi\"])\n    text = lang_dict.get(key, TRANSLATIONS[\"vi\"].get(key, key))\n    if kwargs:\n        try:\n            return text.format(**kwargs)\n        except Exception:\n            return text\n    return text\n", "database.py": "import os\nimport sqlite3\nimport datetime\ntry:\n    import requests\nexcept Exception:\n    requests = None\nfrom typing import List, Dict, Any, Optional, Tuple\nimport config\n\nclass Database:\n    def __init__(self):\n        self.use_d1 = bool(\n            config.CLOUDFLARE_ACCOUNT_ID\n            and config.CLOUDFLARE_D1_DATABASE_ID\n            and config.CLOUDFLARE_API_TOKEN\n            and requests is not None\n        )\n        if not self.use_d1:\n            db_dir = os.path.dirname(config.DB_PATH)\n            if db_dir:\n                try:\n                    os.makedirs(db_dir, exist_ok=True)\n                except Exception:\n                    pass\n        self.init_db()\n\n    def get_backend_name(self) -> str:\n        return \"Cloudflare D1\" if self.use_d1 else \"Local SQLite\"\n\n    def _execute_sqlite(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        conn = sqlite3.connect(config.DB_PATH)\n        conn.row_factory = sqlite3.Row\n        cur = conn.cursor()\n        try:\n            cur.execute(query, params)\n            if query.strip().upper().startswith((\"SELECT\", \"PRAGMA\")):\n                rows = [dict(r) for r in cur.fetchall()]\n                conn.commit()\n                return rows\n            conn.commit()\n            return []\n        finally:\n            conn.close()\n\n    def _execute_d1(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        url = (\n            f\"https://api.cloudflare.com/client/v4/accounts/\"\n            f\"{config.CLOUDFLARE_ACCOUNT_ID}/d1/database/\"\n            f\"{config.CLOUDFLARE_D1_DATABASE_ID}/query\"\n        )\n        headers = {\n            \"Authorization\": f\"Bearer {config.CLOUDFLARE_API_TOKEN}\",\n            \"Content-Type\": \"application/json\"\n        }\n        # Cloudflare D1 expects query and params\n        payload = {\n            \"sql\": query,\n            \"params\": list(params)\n        }\n        try:\n            res = requests.post(url, json=payload, headers=headers, timeout=15)\n            data = res.json()\n            if not data.get(\"success\"):\n                errors = data.get(\"errors\", [])\n                raise RuntimeError(f\"Cloudflare D1 error: {errors}\")\n            result_objs = data.get(\"result\", [])\n            if result_objs and \"results\" in result_objs[0]:\n                return result_objs[0][\"results\"]\n            return []\n        except Exception as e:\n            # If D1 call fails, log and fallback to local sqlite\n            print(f\"[Database] D1 query failed, falling back to SQLite: {e}\")\n            return self._execute_sqlite(query, params)\n\n    def execute(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        if self.use_d1:\n            return self._execute_d1(query, params)\n        return self._execute_sqlite(query, params)\n\n    def init_db(self):\n        \"\"\"Create tables if they don't exist and ensure default admin is configured.\"\"\"\n        schema = [\n            \"\"\"\n            CREATE TABLE IF NOT EXISTS users (\n                email TEXT PRIMARY KEY,\n                full_name TEXT,\n                role TEXT DEFAULT 'user',\n                status TEXT DEFAULT 'pending',\n                created_at TEXT,\n                updated_at TEXT\n            );\n            \"\"\",\n            \"\"\"\n            CREATE TABLE IF NOT EXISTS work_codes (\n                id INTEGER PRIMARY KEY AUTOINCREMENT,\n                code TEXT NOT NULL,\n                raw_code TEXT,\n                name TEXT NOT NULL,\n                unit TEXT DEFAULT '',\n                source_file TEXT NOT NULL,\n                created_at TEXT\n            );\n            \"\"\",\n            \"\"\"\n            CREATE TABLE IF NOT EXISTS uploaded_files (\n                id INTEGER PRIMARY KEY AUTOINCREMENT,\n                filename TEXT UNIQUE NOT NULL,\n                total_records INTEGER DEFAULT 0,\n                uploaded_by TEXT NOT NULL,\n                uploaded_at TEXT\n            );\n            \"\"\",\n            \"\"\"\n            CREATE INDEX IF NOT EXISTS idx_work_codes_code ON work_codes(code);\n            \"\"\",\n            \"\"\"\n            CREATE INDEX IF NOT EXISTS idx_work_codes_file ON work_codes(source_file);\n            \"\"\"\n        ]\n        \n        for statement in schema:\n            self.execute(statement)\n\n        # Seed or ensure default official Admin\n        admin_email = config.ADMIN_EMAIL\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        existing_admin = self.get_user(admin_email)\n        if not existing_admin:\n            self.execute(\n                \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) \"\n                \"VALUES (?, ?, 'admin', 'active', ?, ?)\",\n                (admin_email, \"System Administrator\", now_str, now_str)\n            )\n        else:\n            # Ensure always active admin\n            if existing_admin.get(\"role\") != \"admin\" or existing_admin.get(\"status\") != \"active\":\n                self.execute(\n                    \"UPDATE users SET role = 'admin', status = 'active', updated_at = ? WHERE email = ?\",\n                    (now_str, admin_email)\n                )\n\n    # ================= User Management =================\n    def get_user(self, email: str) -> Optional[Dict[str, Any]]:\n        if not email:\n            return None\n        res = self.execute(\"SELECT * FROM users WHERE email = ? LIMIT 1\", (email.strip().lower(),))\n        return res[0] if res else None\n\n    def register_or_get_user(self, email: str, full_name: str = \"\") -> Dict[str, Any]:\n        email = email.strip().lower()\n        user = self.get_user(email)\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        \n        if user:\n            return user\n        \n        # Determine status and role\n        if email == config.ADMIN_EMAIL:\n            role = \"admin\"\n            status = \"active\"\n        else:\n            role = \"user\"\n            status = \"pending\"  # Needs approval queue\n            \n        display_name = full_name or email.split(\"@\")[0]\n        self.execute(\n            \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) \"\n            \"VALUES (?, ?, ?, ?, ?, ?)\",\n            (email, display_name, role, status, now_str, now_str)\n        )\n        return self.get_user(email)\n\n    def get_all_users(self, status: Optional[str] = None) -> List[Dict[str, Any]]:\n        if status:\n            return self.execute(\"SELECT * FROM users WHERE status = ? ORDER BY created_at DESC\", (status,))\n        return self.execute(\"SELECT * FROM users ORDER BY created_at DESC\")\n\n    def update_user_status(self, email: str, status: str):\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        self.execute(\n            \"UPDATE users SET status = ?, updated_at = ? WHERE email = ?\",\n            (status, now_str, email.strip().lower())\n        )\n\n    def update_user_role(self, email: str, role: str):\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        self.execute(\n            \"UPDATE users SET role = ?, updated_at = ? WHERE email = ?\",\n            (role, now_str, email.strip().lower())\n        )\n\n    def delete_user(self, email: str):\n        # Do not allow deleting root official admin\n        if email.strip().lower() == config.ADMIN_EMAIL:\n            return\n        self.execute(\"DELETE FROM users WHERE email = ?\", (email.strip().lower(),))\n\n    # ================= Work Codes Repository =================\n    def add_work_codes(self, records: List[Dict[str, str]], filename: str, uploaded_by: str) -> int:\n        \"\"\"\n        Saves work codes extracted from a file.\n        If file already exists, old records from this file are purged first.\n        \"\"\"\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        \n        # Purge existing if any\n        self.execute(\"DELETE FROM work_codes WHERE source_file = ?\", (filename,))\n        self.execute(\"DELETE FROM uploaded_files WHERE filename = ?\", (filename,))\n        \n        # Insert work codes\n        inserted_count = 0\n        if not self.use_d1:\n            conn = sqlite3.connect(config.DB_PATH)\n            cur = conn.cursor()\n            try:\n                for r in records:\n                    cur.execute(\n                        \"INSERT INTO work_codes (code, raw_code, name, unit, source_file, created_at) \"\n                        \"VALUES (?, ?, ?, ?, ?, ?)\",\n                        (r[\"code\"], r.get(\"raw_code\", r[\"code\"]), r[\"name\"], r.get(\"unit\", \"\"), filename, now_str)\n                    )\n                    inserted_count += 1\n                conn.commit()\n            finally:\n                conn.close()\n        else:\n            # Batch or sequential insert for D1\n            for r in records:\n                self.execute(\n                    \"INSERT INTO work_codes (code, raw_code, name, unit, source_file, created_at) \"\n                    \"VALUES (?, ?, ?, ?, ?, ?)\",\n                    (r[\"code\"], r.get(\"raw_code\", r[\"code\"]), r[\"name\"], r.get(\"unit\", \"\"), filename, now_str)\n                )\n                inserted_count += 1\n                \n        # Record file metadata\n        self.execute(\n            \"INSERT INTO uploaded_files (filename, total_records, uploaded_by, uploaded_at) \"\n            \"VALUES (?, ?, ?, ?)\",\n            (filename, inserted_count, uploaded_by, now_str)\n        )\n        return inserted_count\n\n    def get_uploaded_files(self) -> List[Dict[str, Any]]:\n        return self.execute(\"SELECT * FROM uploaded_files ORDER BY uploaded_at DESC\")\n\n    def delete_uploaded_file(self, filename: str):\n        self.execute(\"DELETE FROM work_codes WHERE source_file = ?\", (filename,))\n        self.execute(\"DELETE FROM uploaded_files WHERE filename = ?\", (filename,))\n\n    def get_work_codes(\n        self,\n        search: Optional[str] = None,\n        source_file: Optional[str] = None,\n        limit: int = 100,\n        offset: int = 0\n    ) -> List[Dict[str, Any]]:\n        query = \"SELECT * FROM work_codes WHERE 1=1\"\n        params = []\n        if source_file:\n            query += \" AND source_file = ?\"\n            params.append(source_file)\n        if search:\n            query += \" AND (code LIKE ? OR name LIKE ? OR raw_code LIKE ?)\"\n            s_param = f\"%{search}%\"\n            params.extend([s_param, s_param, s_param])\n        query += \" ORDER BY code ASC LIMIT ? OFFSET ?\"\n        params.extend([limit, offset])\n        return self.execute(query, tuple(params))\n\n    def count_work_codes(self, search: Optional[str] = None, source_file: Optional[str] = None) -> int:\n        query = \"SELECT COUNT(*) as cnt FROM work_codes WHERE 1=1\"\n        params = []\n        if source_file:\n            query += \" AND source_file = ?\"\n            params.append(source_file)\n        if search:\n            query += \" AND (code LIKE ? OR name LIKE ? OR raw_code LIKE ?)\"\n            s_param = f\"%{search}%\"\n            params.extend([s_param, s_param, s_param])\n        res = self.execute(query, tuple(params))\n        return res[0][\"cnt\"] if res else 0\n\n    def get_all_codes_lookup(self) -> Dict[str, Dict[str, str]]:\n        \"\"\"\n        Loads all work codes into a fast in-memory lookup dictionary:\n        {\n           'AB.12300': {'name': '...', 'unit': '...', 'source': '...'},\n           ...\n        }\n        Also maps raw_code as fallback.\n        \"\"\"\n        rows = self.execute(\"SELECT code, raw_code, name, unit, source_file FROM work_codes\")\n        lookup = {}\n        for r in rows:\n            info = {\n                \"name\": r[\"name\"],\n                \"unit\": r.get(\"unit\", \"\"),\n                \"source_file\": r.get(\"source_file\", \"\"),\n                \"code\": r[\"code\"]\n            }\n            lookup[r[\"code\"].upper()] = info\n            if r.get(\"raw_code\"):\n                lookup[r[\"raw_code\"].upper()] = info\n        return lookup\n\n# Global database instance\ndb = Database()\n", "parsers.py": "import io\nimport re\nimport openpyxl\nfrom typing import List, Dict, Any, Tuple, Optional\nimport docx\n\ntry:\n    import pdfplumber\nexcept ImportError:\n    pdfplumber = None\n\n# Regular expression to match standard or short work codes:\n# e.g. AB.123, AF.1234, AK.55555, AB12345\nWORK_CODE_PATTERN = re.compile(r\"^([A-Za-z]{2})[\\.\\s_-]?(\\d{1,5})$\")\n\n# Flexible column keyword aliases\nCODE_KEYWORDS = [\n    \"mã hiệu\", \"mã cv\", \"mã định mức\", \"mã hiệu đm\", \"mã công việc\",\n    \"mã số\", \"mã\", \"work code\", \"code\", \"mã đơn giá\", \"mã hiệu cv\"\n]\nNAME_KEYWORDS = [\n    \"tên công việc\", \"nội dung công việc\", \"tên công tác\", \"công tác lắp đặt\",\n    \"nội dung\", \"diễn giải\", \"tên hạng mục\", \"hạng mục\", \"mô tả công việc\",\n    \"work name\", \"description\", \"tên công tác xây lắp\"\n]\nUNIT_KEYWORDS = [\n    \"đơn vị\", \"đơn vị tính\", \"đvt\", \"unit\"\n]\nSTT_KEYWORDS = [\n    \"stt\", \"số tt\", \"số thứ tự\", \"no\", \"tt\"\n]\n\ndef clean_str(val: Any) -> str:\n    \"\"\"Safely converts cell values to stripped string.\"\"\"\n    if val is None:\n        return \"\"\n    s = str(val).strip()\n    return s\n\ndef extract_first_unit(val: Any) -> str:\n    \"\"\"\n    Ưu tiên lấy đơn vị tính đầu tiên tương đương nội dung công việc tổng quát.\n    Lọc bỏ các đơn vị phụ hoặc dòng giải thích chi tiết phía sau (ví dụ: '100m3\\\\nm3' -> '100m3').\n    \"\"\"\n    if not val:\n        return \"\"\n    text = clean_str(val)\n    if not text:\n        return \"\"\n    # Tách theo dòng mới trước (thường gặp trong các ô excel xuống dòng cho từng chi tiết)\n    lines = [line.strip() for line in re.split(r'[\\r\\n]+', text) if line.strip()]\n    first_line = lines[0] if lines else text\n    \n    # Tách theo dấu phẩy, chấm phẩy, hoặc thanh đứng phân cách nhiều đơn vị\n    tokens = [t.strip() for t in re.split(r'[,;|\\t]+', first_line) if t.strip()]\n    first_token = tokens[0] if tokens else first_line\n    \n    # Bỏ các ký tự gạch đầu dòng nếu có\n    first_token = re.sub(r'^[-–—•*+\\s]+', '', first_token).strip()\n    return first_token\n\ndef normalize_work_code(raw_code: str) -> str:\n    \"\"\"\n    Quy chuẩn hóa Mã CV:\n    Mã CV luôn có cấu trúc dạng XX.YYYYY (2 ký tự chữ cái, dấu chấm, và đúng 5 chữ số).\n    Nếu file nguồn có mã chỉ chứa 1-4 chữ số sau dấu chấm (ví dụ: AB.123),\n    hệ thống tự động đệm thêm các số 0 vào cuối cho đủ 5 chữ số (AB.12300).\n    \"\"\"\n    if not raw_code:\n        return \"\"\n    code_clean = raw_code.strip()\n    match = WORK_CODE_PATTERN.match(code_clean)\n    if match:\n        letters = match.group(1).upper()\n        digits = match.group(2)\n        # Pad with zeros to 5 digits\n        padded_digits = digits.ljust(5, \"0\")\n        return f\"{letters}.{padded_digits}\"\n    \n    # Check if there is an internal period like 'AB.12'\n    parts = code_clean.split(\".\")\n    if len(parts) == 2 and len(parts[0]) == 2 and parts[0].isalpha() and parts[1].isdigit():\n        letters = parts[0].upper()\n        digits = parts[1].ljust(5, \"0\")\n        return f\"{letters}.{digits}\"\n\n    return code_clean.upper()\n\ndef is_header_match(cell_value: str, keywords: List[str]) -> bool:\n    if not cell_value:\n        return False\n    val_lower = cell_value.lower().strip()\n    for kw in keywords:\n        if kw == val_lower or kw in val_lower:\n            return True\n    return False\n\n# ================= 1. EXCEL CATALOG PARSER =================\ndef extract_from_excel(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất thông minh từ Excel:\n    Duyệt các sheet, tìm bảng có tiêu đề Mã CV và Tên công việc.\n    Lọc bỏ văn bản giải thích rườm rà.\n    \"\"\"\n    wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=True)\n    records = []\n    seen_codes = set()\n\n    for sheet in wb.worksheets:\n        header_row_idx = None\n        col_code_idx = None\n        col_name_idx = None\n        col_unit_idx = None\n\n        # Scan first 50 rows to detect header table\n        for r_idx, row in enumerate(sheet.iter_rows(values_only=True), start=1):\n            if r_idx > 50:\n                break\n            row_str = [clean_str(c) for c in row]\n            \n            c_code = None\n            c_name = None\n            c_unit = None\n            \n            for c_idx, cell_text in enumerate(row_str):\n                if not cell_text:\n                    continue\n                if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                    c_code = c_idx\n                elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                    c_name = c_idx\n                elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                    c_unit = c_idx\n\n            if c_code is not None and c_name is not None:\n                header_row_idx = r_idx\n                col_code_idx = c_code\n                col_name_idx = c_name\n                col_unit_idx = c_unit\n                break\n\n        if header_row_idx is not None:\n            # Read rows after header\n            for row in sheet.iter_rows(min_row=header_row_idx + 1, values_only=True):\n                if not row or len(row) <= max(col_code_idx, col_name_idx):\n                    continue\n                raw_code = clean_str(row[col_code_idx])\n                name = clean_str(row[col_name_idx])\n                unit = clean_str(row[col_unit_idx]) if col_unit_idx is not None and len(row) > col_unit_idx else \"\"\n\n                if not raw_code or not name:\n                    continue\n                \n                # Check if this row is another repeated header or footer\n                if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                    continue\n\n                norm_code = normalize_work_code(raw_code)\n                if norm_code not in seen_codes:\n                    seen_codes.add(norm_code)\n                    records.append({\n                        \"code\": norm_code,\n                        \"raw_code\": raw_code,\n                        \"name\": name,\n                        \"unit\": extract_first_unit(unit)\n                    })\n\n    return records\n\n# ================= 2. WORD (.DOCX) CATALOG PARSER =================\ndef extract_from_docx(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất thông minh từ Word (.docx):\n    Bỏ qua toàn bộ văn bản mô tả, chỉ quét các bảng (Tables).\n    Tìm hàng tiêu đề có Mã CV & Tên công việc.\n    \"\"\"\n    doc = docx.Document(io.BytesIO(file_bytes))\n    records = []\n    seen_codes = set()\n\n    for table in doc.tables:\n        header_row_idx = None\n        col_code_idx = None\n        col_name_idx = None\n        col_unit_idx = None\n\n        for r_idx, row in enumerate(table.rows):\n            cells_text = [clean_str(c.text) for c in row.cells]\n            \n            c_code = None\n            c_name = None\n            c_unit = None\n            for c_idx, cell_text in enumerate(cells_text):\n                if not cell_text:\n                    continue\n                if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                    c_code = c_idx\n                elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                    c_name = c_idx\n                elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                    c_unit = c_idx\n\n            if c_code is not None and c_name is not None:\n                header_row_idx = r_idx\n                col_code_idx = c_code\n                col_name_idx = c_name\n                col_unit_idx = c_unit\n                break\n\n        if header_row_idx is not None:\n            for r_idx in range(header_row_idx + 1, len(table.rows)):\n                row = table.rows[r_idx]\n                cells_text = [clean_str(c.text) for c in row.cells]\n                if len(cells_text) <= max(col_code_idx, col_name_idx):\n                    continue\n                raw_code = cells_text[col_code_idx]\n                name = cells_text[col_name_idx]\n                unit = cells_text[col_unit_idx] if col_unit_idx is not None and len(cells_text) > col_unit_idx else \"\"\n\n                if not raw_code or not name:\n                    continue\n                if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                    continue\n\n                norm_code = normalize_work_code(raw_code)\n                if norm_code not in seen_codes:\n                    seen_codes.add(norm_code)\n                    records.append({\n                        \"code\": norm_code,\n                        \"raw_code\": raw_code,\n                        \"name\": name,\n                        \"unit\": extract_first_unit(unit)\n                    })\n\n    return records\n\n# ================= 3. PDF CATALOG PARSER =================\ndef extract_from_pdf(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất bảng từ PDF:\n    Dùng pdfplumber để trích xuất các bảng, bỏ qua văn bản ngoài bảng.\n    \"\"\"\n    if pdfplumber is None:\n        raise RuntimeError(\"Trích xuất PDF chưa được hỗ trợ trên trình duyệt này. Vui lòng chuyển đổi sang tệp Excel (.xlsx) hoặc Word (.docx).\")\n\n    records = []\n    seen_codes = set()\n\n    with pdfplumber.open(io.BytesIO(file_bytes)) as pdf:\n        for page in pdf.pages:\n            tables = page.extract_tables()\n            for table in tables:\n                if not table:\n                    continue\n                \n                header_row_idx = None\n                col_code_idx = None\n                col_name_idx = None\n                col_unit_idx = None\n\n                for r_idx, row in enumerate(table):\n                    row_str = [clean_str(c) for c in row]\n                    c_code = None\n                    c_name = None\n                    c_unit = None\n                    for c_idx, cell_text in enumerate(row_str):\n                        if not cell_text:\n                            continue\n                        if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                            c_code = c_idx\n                        elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                            c_name = c_idx\n                        elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                            c_unit = c_idx\n                    if c_code is not None and c_name is not None:\n                        header_row_idx = r_idx\n                        col_code_idx = c_code\n                        col_name_idx = c_name\n                        col_unit_idx = c_unit\n                        break\n\n                if header_row_idx is not None:\n                    for row in table[header_row_idx + 1:]:\n                        if len(row) <= max(col_code_idx, col_name_idx):\n                            continue\n                        raw_code = clean_str(row[col_code_idx])\n                        name = clean_str(row[col_name_idx])\n                        unit = clean_str(row[col_unit_idx]) if col_unit_idx is not None and len(row) > col_unit_idx else \"\"\n\n                        if not raw_code or not name:\n                            continue\n                        if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                            continue\n\n                        norm_code = normalize_work_code(raw_code)\n                        if norm_code not in seen_codes:\n                            seen_codes.add(norm_code)\n                            records.append({\n                                \"code\": norm_code,\n                                \"raw_code\": raw_code,\n                                \"name\": name,\n                                \"unit\": extract_first_unit(unit)\n                            })\n\n    return records\n\n# ================= 4. INSPECTION OF SHEET 'ĐGTH' =================\ndef inspect_dgth_sheet(file_bytes: bytes, repo_lookup: Dict[str, Dict[str, str]]) -> Dict[str, Any]:\n    \"\"\"\n    Quy tắc kiểm tra Sheet ĐGTH:\n    - Bắt buộc phải có sheet tên 'ĐGTH'.\n    - openpyxl data_only=True để lấy giá trị thực từ công thức.\n    - Dữ liệu chia thành nhiều bảng theo Hạng mục công trình (STT lặp lại từ 1 trên mỗi bảng có điền lại tiêu đề).\n    - Phân nhóm kết quả theo từng Hạng mục công trình.\n    - Báo lỗi rõ: Mã không tồn tại trong kho dữ liệu, hoặc Tên không khớp.\n    \"\"\"\n    wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=True)\n    \n    # Match sheet ĐGTH (case-insensitive or exact)\n    target_sheet = None\n    for name in wb.sheetnames:\n        if name.strip().upper() == \"ĐGTH\":\n            target_sheet = wb[name]\n            break\n\n    if target_sheet is None:\n        return {\n            \"success\": False,\n            \"error\": \"NOT_FOUND_DGTH\",\n            \"message\": \"Không tìm thấy sheet có tên 'ĐGTH' trong file Excel tải lên.\"\n        }\n\n    sections = []\n    current_section = {\n        \"title\": \"Hạng mục 1\",\n        \"items\": [],\n        \"total_count\": 0,\n        \"valid_count\": 0,\n        \"error_count\": 0\n    }\n    \n    col_stt_idx = None\n    col_code_idx = None\n    col_name_idx = None\n    col_unit_idx = None\n\n    last_section_title_candidate = \"\"\n    active_in_table = False\n    last_stt_val = 0\n\n    rows = list(target_sheet.iter_rows(values_only=True))\n    \n    for r_idx, row in enumerate(rows, start=1):\n        if not row:\n            continue\n        row_str = [clean_str(c) for c in row]\n        row_non_empty = [c for c in row_str if c]\n        if not row_non_empty:\n            continue\n\n        # Check if this row is a header row (STT, Mã CV, Tên công việc...)\n        c_stt = None\n        c_code = None\n        c_name = None\n        c_unit = None\n        \n        for c_idx, cell_text in enumerate(row_str):\n            if not cell_text:\n                continue\n            if c_stt is None and is_header_match(cell_text, STT_KEYWORDS):\n                c_stt = c_idx\n            elif c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                c_code = c_idx\n            elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                c_name = c_idx\n            elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                c_unit = c_idx\n\n        # If a header row is detected (having code and name, and optionally stt)\n        if c_code is not None and c_name is not None:\n            # We found a header row for a section!\n            col_stt_idx = c_stt\n            col_code_idx = c_code\n            col_name_idx = c_name\n            col_unit_idx = c_unit\n            \n            # If current section has items, commit it\n            if current_section[\"items\"]:\n                sections.append(current_section)\n                section_title = last_section_title_candidate or f\"Hạng mục {len(sections) + 1}\"\n                current_section = {\n                    \"title\": section_title,\n                    \"items\": [],\n                    \"total_count\": 0,\n                    \"valid_count\": 0,\n                    \"error_count\": 0\n                }\n            elif last_section_title_candidate:\n                current_section[\"title\"] = last_section_title_candidate\n                \n            active_in_table = True\n            last_stt_val = 0\n            last_section_title_candidate = \"\"\n            continue\n\n        # If we have active column indices, evaluate this row\n        if col_code_idx is not None and col_name_idx is not None and active_in_table:\n            stt_raw = clean_str(row[col_stt_idx]) if col_stt_idx is not None and len(row) > col_stt_idx else \"\"\n            raw_code = clean_str(row[col_code_idx]) if len(row) > col_code_idx else \"\"\n            name_raw = clean_str(row[col_name_idx]) if len(row) > col_name_idx else \"\"\n            unit_raw = clean_str(row[col_unit_idx]) if col_unit_idx is not None and len(row) > col_unit_idx else \"\"\n\n            # Check if this row is a Section / Hạng mục title before items start\n            # Usually: STT is empty or non-numeric, raw_code is empty, but name_raw or row has text like \"Hạng mục: ...\"\n            if not raw_code:\n                # Potential section divider\n                first_text = \" \".join(row_non_empty)\n                if any(k in first_text.lower() for k in [\"hạng mục\", \"phần\", \"gói thầu\", \"công trình\", \"bảng\"]):\n                    last_section_title_candidate = first_text\n                continue\n\n            # Detect STT reset (e.g. STT restarts from 1 when a new table begins without full header)\n            numeric_stt = None\n            try:\n                # Handle numeric STT like 1, 2 or '1.0'\n                numeric_stt = int(float(stt_raw)) if stt_raw else None\n            except Exception:\n                numeric_stt = None\n\n            if numeric_stt == 1 and last_stt_val > 1:\n                # STT reset to 1 -> new section!\n                if current_section[\"items\"]:\n                    sections.append(current_section)\n                    sec_name = last_section_title_candidate or f\"Hạng mục {len(sections) + 1}\"\n                    current_section = {\n                        \"title\": sec_name,\n                        \"items\": [],\n                        \"total_count\": 0,\n                        \"valid_count\": 0,\n                        \"error_count\": 0\n                    }\n                    last_section_title_candidate = \"\"\n\n            if numeric_stt is not None:\n                last_stt_val = numeric_stt\n\n            # Verify the work code against repository lookup\n            norm_code = normalize_work_code(raw_code)\n            \n            # Lookup check: check norm_code, raw_code, or case-insensitive\n            repo_match = (\n                repo_lookup.get(norm_code.upper())\n                or repo_lookup.get(raw_code.upper())\n            )\n\n            status = \"VALID\"\n            status_desc = \"Hợp lệ\"\n            repo_name = \"\"\n            \n            if not repo_match:\n                status = \"NOT_FOUND\"\n                status_desc = \"Không tồn tại trong kho dữ liệu\"\n            else:\n                repo_name = repo_match[\"name\"]\n                # Optional check: name resemblance\n                # If exact or normalized match\n                if name_raw and repo_name and name_raw.strip().lower() != repo_name.strip().lower():\n                    # Check if there is significant discrepancy\n                    # We can classify as valid code but note the repo name\n                    pass\n\n            item_result = {\n                \"stt\": stt_raw or str(len(current_section[\"items\"]) + 1),\n                \"row_index\": r_idx,\n                \"raw_code\": raw_code,\n                \"norm_code\": norm_code,\n                \"name_in_file\": name_raw,\n                \"unit\": unit_raw,\n                \"repo_name\": repo_name,\n                \"status\": status,\n                \"status_desc\": status_desc\n            }\n\n            current_section[\"items\"].append(item_result)\n            current_section[\"total_count\"] += 1\n            if status == \"VALID\":\n                current_section[\"valid_count\"] += 1\n            else:\n                current_section[\"error_count\"] += 1\n        else:\n            # Outside table or looking for section title\n            text_line = \" \".join(row_non_empty)\n            if any(k in text_line.lower() for k in [\"hạng mục\", \"phần\", \"gói thầu\", \"công trình\", \"bảng\"]):\n                last_section_title_candidate = text_line\n\n    if current_section[\"items\"]:\n        sections.append(current_section)\n\n    # Compute overall metrics\n    total_items = sum(s[\"total_count\"] for s in sections)\n    valid_items = sum(s[\"valid_count\"] for s in sections)\n    error_items = sum(s[\"error_count\"] for s in sections)\n\n    return {\n        \"success\": True,\n        \"sections\": sections,\n        \"total_items\": total_items,\n        \"valid_items\": valid_items,\n        \"error_items\": error_items,\n        \"section_count\": len(sections)\n    }\n", "styles.py": "# Custom styling and CSS for COREBOX Web Application\n\ndef get_custom_css() -> str:\n    return \"\"\"\n    <style>\n    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');\n\n    /* Global reset & background */\n    html, body, [class*=\"css\"], [data-testid=\"stAppViewContainer\"] {\n        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;\n        background-color: #0b0e17 !important;\n        color: #f1f5f9;\n        margin: 0;\n        padding: 0;\n    }\n\n    /* ELIMINATE TOP GAP COMPLETELY (Pull content flush to very top) */\n    header[data-testid=\"stHeader\"] {\n        display: none !important;\n        height: 0 !important;\n        min-height: 0 !important;\n        padding: 0 !important;\n        margin: 0 !important;\n        visibility: hidden !important;\n    }\n\n    [data-testid=\"stAppViewContainer\"] {\n        padding-top: 0 !important;\n        margin-top: 0 !important;\n    }\n\n    /* 2CM MARGIN LEFT & RIGHT AT 100% DISPLAY */\n    .main, \n    .main .block-container, \n    [data-testid=\"stMainBlockContainer\"], \n    [data-testid=\"block-container\"],\n    div[data-testid=\"stAppViewBlockContainer\"] {\n        padding-top: 0.2rem !important;\n        padding-left: 2cm !important;\n        padding-right: 2cm !important;\n        padding-bottom: 0 !important;\n        margin-top: 0 !important;\n        margin-left: 0 !important;\n        margin-right: 0 !important;\n        max-width: 100% !important;\n        width: 100% !important;\n        box-sizing: border-box !important;\n    }\n\n    /* ============================================================== */\n    /* CUSTOM TOP NAVBAR (No white borders, pure hover dropdowns)     */\n    /* ============================================================== */\n    .corebox-navbar-container {\n        background-color: #0b0e17;\n        border-bottom: 1px solid rgba(255, 255, 255, 0.08);\n        padding: 0.45rem 0 0.65rem 0;\n        margin-top: 0 !important;\n        margin-bottom: 2rem;\n        position: relative;\n        z-index: 10000;\n        width: 100%;\n        box-sizing: border-box;\n    }\n\n    .nav-bar-row {\n        display: flex;\n        align-items: center;\n        justify-content: space-between;\n        width: 100%;\n    }\n\n    .nav-left-zone {\n        display: flex;\n        align-items: center;\n        gap: 2.2rem;\n    }\n\n    /* Corebox Brand: Icon 📦 tách riêng, to hơn chữ 1 chút */\n    .brand-link-wrapper {\n        display: inline-flex !important;\n        align-items: center !important;\n        text-decoration: none !important;\n        border: none !important;\n        outline: none !important;\n        cursor: pointer !important;\n        gap: 0.4rem;\n        padding-right: 0.8rem;\n    }\n\n    .brand-icon-box {\n        font-size: 1.85rem !important;\n        line-height: 1 !important;\n        display: inline-flex;\n        align-items: center;\n  class=\"feature-desc\">{t('home_card_repo_desc', lang)}</div>\n</div>\"\"\")\n        st.write(\"\")\n        safe_html(f\"\"\"<div style=\"text-align: center;\">\n<a href=\"?page=repo&lang={lang}\" target=\"_self\" style=\"\ndisplay: block;\nwidth: 100%;\npadding: 0.55rem 1rem;\nbackground: rgba(56, 189, 248, 0.1);\ncolor: #38bdf8;\nborder: 1px solid rgba(56, 189, 248, 0.3);\nborder-radius: 8px;\ntext-decoration: none;\nfont-weight: 600;\nfont-size: 0.9rem;\nbox-sizing: border-box;\ntransition: all 0.2s ease;\n\">🚀 {t('btn_go', lang)}: {t('nav_repo', lang)}</a>\n</div>\"\"\")\n\n    # Card 2: Work Code Inspection (Kiểm tra mã công việc)\n    with col2:\n        safe_html(f\"\"\"<div class=\"feature-card\">\n<div class=\"feature-icon\">🔍</div>\n<div class=\"feature-title\">{t('home_card_inspect_title', lang)}</div>\n<div class=\"feature-desc\">{t('home_card_inspect_desc', lang)}</div>\n</div>\"\"\")\n        st.write(\"\")\n        safe_html(f\"\"\"<div style=\"text-align: center;\">\n<a href=\"?page=inspect&lang={lang}\" target=\"_self\" style=\"\ndisplay: block;\nwidth: 100%;\npadding: 0.55rem 1rem;\nbackground: rgba(251, 191, 36, 0.1);\ncolor: #fbbf24;\nborder: 1px solid rgba(251, 191, 36, 0.3);\nborder-radius: 8px;\ntext-decoration: none;\nfont-weight: 600;\nfont-size: 0.9rem;\nbox-sizing: border-box;\ntransition: all 0.2s ease;\n\">⚡ {t('btn_go', lang)}: {t('nav_inspection', lang)}</a>\n</div>\"\"\")\n\n    # Card 3: User Management (Quản lý tài khoản)\n    with col3:\n        safe_html(f\"\"\"<div class=\"feature-card\">\n<div class=\"feature-icon\">👥</div>\n<div class=\"feature-title\">{t('home_card_admin_title', lang)}</div>\n<div class=\"feature-desc\">{t('home_card_admin_desc', lang)}</div>\n</div>\"\"\")\n        st.write(\"\")\n        if is_admin():\n            safe_html(f\"\"\"<div style=\"text-align: center;\">\n<a href=\"?page=users&lang={lang}\" target=\"_self\" style=\"\ndisplay: block;\nwidth: 100%;\npadding: 0.55rem 1rem;\nbackground: rgba(168, 85, 247, 0.1);\ncolor: #c084fc;\nborder: 1px solid rgba(168, 85, 247, 0.3);\nborder-radius: 8px;\ntext-decoration: none;\nfont-weight: 600;\nfont-size: 0.9rem;\nbox-sizing: border-box;\ntransition: all 0.2s ease;\n\">👑 {t('btn_go', lang)}: {t('nav_users', lang)}</a>\n</div>\"\"\")\n        else:\n            safe_html(f\"\"\"<div style=\"text-align: center;\">\n<span style=\"\ndisplay: block;\nwidth: 100%;\npadding: 0.55rem 1rem;\nbackground: rgba(255, 255, 255, 0.05);\ncolor: #64748b;\nborder: 1px solid rgba(255, 255, 255, 0.08);\nborder-radius: 8px;\nfont-size: 0.9rem;\nbox-sizing: border-box;\ncursor: not-allowed;\n\">🔒 {t('nav_users', lang)} (Admin)</span>\n</div>\"\"\")\n\n    # Footer (Cách mép dưới màn hình 1cm)\n    safe_html(f\"\"\"<div class=\"corebox-footer\">\n{t('app_footer', lang)} • Cloudflare & Python Architecture • Version 2.0\n</div>\"\"\")\n", "views/pending.py": "import streamlit as st\nimport config\nfrom i18n import t\nfrom auth import get_current_user_email, logout_user\n\ndef render_pending_view(lang: str):\n    \"\"\"\n    Renders polite pending approval screen for new Google users:\n    'Tài khoản của bạn đã đăng nhập thành công nhưng đang chờ Admin (happyclone96@gmail.com) phê duyệt. Vui lòng liên hệ quản trị viên.'\n    \"\"\"\n    email = get_current_user_email() or \"user@gmail.com\"\n\n    st.markdown(\n        f\"\"\"\n        <div class=\"pending-notice-box\">\n            <div class=\"pending-notice-icon\">⏳</div>\n            <div class=\"pending-notice-title\">{t('pending_title', lang)}</div>\n            <div class=\"pending-notice-text\">\n                {t('pending_message', lang, email=f\"<b>{email}</b>\", admin_email=f\"<b>{config.ADMIN_EMAIL}</b>\")}\n            </div>\n            <div style=\"margin-top:1.2rem; color:#94a3b8; font-size:0.9rem;\">\n                💡 {t('pending_tip', lang)}\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True\n    )\n\n    col1, col2, col3 = st.columns([1. with col_btn1:\n                    if st.button(f\"✅ {t('btn_approve', lang)}\", key=f\"btn_app_{idx}_{u_email}\", use_container_width=True, type=\"primary\"):\n                        db.update_user_status(u_email, \"active\")\n                        st.success(t(\"msg_approved_success\", lang, email=u_email))\n                        st.rerun()\n                with col_btn2:\n                    if st.button(f\"❌ {t('btn_reject', lang)}\", key=f\"btn_rej_{idx}_{u_email}\", use_container_width=True):\n                        db.update_user_status(u_email, \"rejected\")\n                        st.warning(t(\"msg_rejected_success\", lang, email=u_email))\n                        st.rerun()\n\n    st.markdown(\"<br>\", unsafe_allow_html=True)\n\n    # 2. ACTIVE USERS LIST\n    active_users = db.get_all_users(status=\"active\")\n    st.markdown(f\"### 🟢 {t('approved_users_section', lang, count=len(active_users))}\")\n\n    if active_users:\n        for idx, u in enumerate(active_users):\n            u_email = u[\"email\"]\n            u_name = u[\"full_name\"] or u_email.split(\"@\")[0]\n            u_role = u.get(\"role\", \"user\")\n            is_root_admin = (u_email == config.ADMIN_EMAIL)\n\n            with st.container(border=True):\n                col_info, col_actions = st.columns([7, 3], vertical_alignment=\"center\")\n                with col_info:\n                    badge_str = \"👑 Admin Chính thức\" if is_root_admin else (\"⚡ Quản trị viên\" if u_role == \"admin\" else \"👤 Người dùng\")\n                    st.markdown(f\"**{u_name}** (`{u_email}`) — *{badge_str}*\")\n                    st.caption(f\"Cập nhật lần cuối: {u.get('updated_at', u.get('created_at', ''))}\")\n                with col_actions:\n                    if not is_root_admin:\n                        btn_c1, btn_c2 = st.columns(2)\n                        with btn_c1:\n                            if st.button(\"Tạm khóa\", key=f\"btn_lock_{idx}_{u_email}\", use_container_width=True):\n                                db.update_user_status(u_email, \"pending\")\n                                st.rerun()\n                        with btn_c2:\n                            if st.button(\"Xóa\", key=f\"btn_del_{idx}_{u_email}\", use_container_width=True):\n                                db.delete_user(u_email)\n                                st.rerun()\n                    else:\n                        st.badge(\"Hệ thống bảo vệ\", icon=\"🔒\")\n\n    st.markdown(\"<br>\", unsafe_allow_html=True)\n\n    # 3. REJECTED USERS (if any)\n    rejected_users = db.get_all_users(status=\"rejected\")\n    if rejected_users:\n        with st.expander(f\"🚫 Danh sách tài khoản đã từ chối ({len(rejected_users)})\"):\n            for idx, u in enumerate(rejected_users):\n                u_email = u[\"email\"]\n                col_a, col_b = st.columns([7, 3])\n                with col_a:\n                    st.write(f\"• `{u_email}` ({u.get('full_name', '')})\")\n                with col_b:\n                    if st.button(\"Khôi phục duyệt\", key=f\"btn_restore_{idx}_{u_email}\"):\n                        db.update_user_status(u_email, \"active\")\n                        st.rerun()\n", "views/repository.py": "import io\nimport re\nimport streamlit as st\nimport pandas as pd\nimport config\nfrom i18n import t\nfrom database import db\nfrom auth import is_admin, get_current_user_email\nfrom parsers import extract_from_excel, extract_from_docx, extract_from_pdf, extract_first_unit\n\ndef format_datetime_display(val: str) -> str:\n    \"\"\"Định dạng ngày thành dd/mm/yyyy HH:MM:SS.\"\"\"\n    if not val:\n        return \"\"\n    val_clean = str(val).strip()\n    try:\n        if \" \" in val_clean:\n            d_part, t_part = val_clean.split(\" \", 1)\n            parts = d_part.split(\"-\")\n            if len(parts) == 3 and len(parts[0]) == 4:\n                return f\"{parts[2]}/{parts[1]}/{parts[0]} {t_part}\"\n        elif \"-\" in val_clean:\n            parts = val_clean.split(\"-\")\n            if len(parts) == 3 and len(parts[0]) == 4:\n                return f\"{parts[2]}/{parts[1]}/{parts[0]}\"\n    except Exception:\n        pass\n    return val_clean\n\ndef render_repository_view(lang: str):\n    \"\"\"\n    Renders Kho Dữ Liệu (Data Repository) view:\n    - Smart Extraction from .docx, .xlsx, .pdf\n    - Work code normalization XX.YYYYY\n    - File management with source_file tag (Admin only for upload / delete)\n    - Master Repository Viewer with full bilingual support\n    \"\"\"\n    user_is_admin = is_admin()\n    user_email = get_current_user_email() or \"guest\"\n\n    st.markdown(f\"## 📁 {t('repo_title', lang)}\")\n    st.caption(t('repo_desc', lang))\n    st.divider()\n\n    # Admin notice if regular user\n    if not user_is_admin:\n        st.info(f\"ℹ️ {t('repo_admin_only_notice', lang, admin_email=config.ADMIN_EMAIL)}\")\n\n    # 1. FILE UPLOAD & EXTRACTION SECTION (Admin Only)\n    if user_is_admin:\n        with st.expander(f\"📤 {t('repo_upload_section', lang)}\", expanded=True):\n            st.markdown(f\"*{t('repo_upload_hint', lang)}*\")\n            st.markdown(\n                f\"\"\"\n                <div style=\"background:rgba(30,58,138,0.2); padding:0.75rem 1rem; border-radius:8px; border-left:4px solid #38bdf8; margin-bottom:1rem; font-size:0.9rem;\">\n                    💡 <b>{t('repo_normalize_rule', lang)}</b>\n                </div>\n                \"\"\",\n                unsafe_allow_html=True\n            )\n\n            uploaded_file = st.file_uploader(\n                t(\"upload_catalog_label\", lang),\n                type=[\"xlsx\", \"docx\", \"pdf\"],\n                key=\"repo_file_uploader\"\n            )\n\n            if uploaded_file is not None:\n                filename = uploaded_file.name\n                ext = filename.rsplit(\".\", 1)[-1].lower()\n\n                col_u1, col_u2 = st.columns([3, 1], vertical_alignment=\"center\")\n                with col_u1:\n                    st.write(f\"📄 **{t('selected_file', lang)}:** `{filename}` ({uploaded_file.size / 1024:.1f} KB)\")\n                with col_u2:\n                    process_btn = st.button(f\"⚡ {t('btn_process_file', lang)}\", type=\"primary\", use_container_width=True)\n\n                if process_btn:\n                    with st.spinner(t(\"extracting_spinner\", lang)):\n                        file_bytes = uploaded_file.getvalue()\n                        records = []\n                        try:\n                            if ext == \"xlsx\":\n                                records = extract_from_excel(file_bytes, filename)\n                            elif ext == \"docx\":\n                                records = extract_from_docx(file_bytes, filename)\n                            elif ext == \"pdf\":\n                                records = extract_from_pdf(file_bytes, filename)\n                        except Exception as e:\n                            st.error(f\"Lỗi: {e}\")\n                            return\n\n                        if not records:\n                            st.warning(t(\"msg_no_table_found\", lang))\n                        else:\n                            inserted_count = db.add_work_codes(records, filename, user_email)\n                            st.success(t(\"msg_upload_success\", lang, count=inserted_count, filename=filename))\n                            st.rerun()\n\n    # 2. MANAGED FILES LIST\n    st.markdown(f\"### 📑 {t('repo_files_section', lang)}\")\n    files = db.get_uploaded_files()\n\n    if not files:\n        st.info(t(\"msg_no_files\", lang))\n    else:\n        for f in files:\n            fname = f[\"filename\"]\n            fcount = f.get(\"total_records\", 0)\n            fuser = f.get(\"uploaded_by\", \"\")\n            ftime_formatted = format_datetime_display(f.get(\"uploaded_at\", \"\"))\n\n            with st.container(border=True):\n                col_f1, col_f2 = st.columns([7, 3], vertical_alignment=\"center\")\n                with col_f1:\n                    st.markdown(f\"📄 **{fname}** — `{fcount:,} mã CV`\")\n                    st.caption(f\"{t('uploaded_by_prefix', lang)}: `{fuser}` | {t('uploaded_at_prefix', lang)}: {ftime_formatted}\")\n                with col_f2:\n                    if user_is_admin:\n                        if st.button(f\"🗑️ {t('btn_delete_file', lang)}\", key=f\"del_file_{fname}\", use_container_width=True):\n                            db.delete_uploaded_file(fname)\n                            st.warning(t(\"msg_delete_file_success\", lang, filename=fname))\n                            st.rerun()\n                    else:\n                        st.caption(f\"🔒 {t('view_only_perm', lang)}\")\n\n    st.markdown(\"<br>\", unsafe_allow_html=True)\n\n    # 3. MASTER REPOSITORY VIEWER (\"Xem danh mục tổng hợp\")\n    st.divider()\n    st.markdown(f\"### 📚 {t('master_view_title', lang)}\")\n\n    total_records = db.count_work_codes()\n    if total_records == 0:\n        st.info(t(\"msg_repo_empty_browse\", lang))\n        return\n\n    # Filter & Search row\n    col_s1, col_s2 = st.columns([2, 3])\n    with col_s1:\n        file_options = [t(\"all_option\", lang)] + [f[\"filename\"] for f in files]\n        selected_file_filter = st.selectbox(t(\"filter_by_file\", lang), options=file_options, key=\"repo_file_filter\")\n    with col_s2:\n        search_query = st.text_input(\n            t(\"search_label\", lang),\n            placeholder=t(\"search_code_or_name\", lang),\n            key=\"repo_search_input\"\n        )\n\n    filter_source = None if selected_file_filter == t(\"all_option\", lang) else selected_file_filter\n    matching_count = db.count_work_codes(search=search_query or None, source_file=filter_source)\n    st.caption(t(\"total_records\", lang, count=f\"{matching_count:,}\"))\n\n    # Pagination\n    page_size = 50\n    total_pages = max(1, (matching_count + page_size - 1) // page_size)\n    page_col1, page_col2 = st.columns([2, 8], vertical_alignment=\"center\")\n    with page_col1:\n        current_page_num = st.number_input(t(\"page_label\", lang), min_value=1, max_value=total_pages, value=1, step=1, key=\"repo_page_num\")\n    with page_col2:\n        st.caption(t(\"showing_page_info\", lang, current=current_page_num, total=total_pages))\n\n    offset = (current_page_num - 1) * page_size\n    records = db.get_work_codes(search=search_query or None, source_file=filter_source, limit=page_size, offset=offset)\n\n    if records:\n        for r in records:\n            r[\"unit\"] = extract_first_unit(r.get(\"unit\", \"\"))\n        df = pd.DataFrame(records)[[\"code\", \"raw_code\", \"name\", \"unit\", \"source_file\"]]\n        df.columns = [\n            t(\"col_norm_code\", lang),\n            t(\"col_raw_code\", lang),\n            t(\"col_work_name\", lang),\n            t(\"col_unit\", lang),\n            t(\"col_source_file\", lang)\n        ]\n        st.dataframe(df, use_container_width=True, hide_index=True)\n\n        # Export button with 1cm spacing from bottom\n        output = io.BytesIO()\n        with pd.ExcelWriter(output, engine='xlsxwriter') as writer:\n            df_all = pd.DataFrame(db.get_work_codes(search=search_query or None, source_file=filter_source, limit=10000, offset=0))\n            if not df_all.empty:\n                for idx_row in range(len(df_all)):\n                    df_all.at[idx_row, \"unit\"] = extract_first_unit(df_all.at[idx_row, \"unit\"])\n                df_all = df_all[[\"code\", \"raw_code\", \"name\", \"unit\", \"source_file\"]]\n                df_all.columns = [\n                    t(\"col_norm_code\", lang),\n                    t(\"col_raw_code\", lang),\n                    t(\"col_work_name\", lang),\n                    t(\"col_unit\", lang),\n                    t(\"col_source_file\", lang)\n                ]\n                df_all.to_excel(writer, sheet_name='Kho_Du_Lieu', index=False)\n        output.seek(0)\n        \n        # 1cm bottom spacing wrapper\n        st.markdown('<div style=\"margin-top: 1rem; margin-bottom: 1cm; padding-bottom: 0.5cm;\">', unsafe_allow_html=True)\n        st.download_button(\n            label=f\"📥 {t('btn_export_repo', lang)}\",\n            data=output,\n            file_name=\"corebox_kho_du_lieu.xlsx\",\n            mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n            key=\"dl_btn_repo_xlsx\"\n        )\n        st.markdown('</div>', unsafe_allow_html=True)\n", "views/inspection.py": "import io\nimport streamlit as st\nimport pandas as pd\nfrom i18n import t\nfrom database import db\nfrom parsers import inspect_dgth_sheet\n\ndef render_inspection_view(lang: str):\n    \"\"\"\n    Renders Kiểm tra mã công việc (Work Code Inspection) view:\n    - In-memory session processing, zero permanent server storage\n    - Strict ĐGTH sheet check with openpyxl data_only=True\n    - Grouping by 'Hạng mục công trình' based on table headers & STT reset to 1\n    - Instant missing code detection\n    - Overview metrics & st.expander per section\n    - Downloadable Excel report\n    \"\"\"\n    st.markdown(f\"## 🔍 {t('inspect_title', lang)}\")\n    st.caption(t('inspect_desc', lang))\n    st.divider()\n\n    # Informational notice boxes\n    col_note1, col_note2 = st.columns(2)\n    with col_note1:\n        st.markdown(\n            f\"\"\"\n            <div style=\"background:rgba(15,23,42,0.6); padding:0.85rem 1rem; border-radius:10px; border-left:4px solid #10b981; font-size:0.88rem;\">\n                {t('inspect_temp_note', lang)}\n            </div>\n            \"\"\",\n            unsafe_allow_html=True\n        )\n    with col_note2:\n        st.markdown(\n            f\"\"\"\n            <div style=\"background:rgba(15,23,42,0.6); padding:0.85rem 1rem; border-radius:10px; border-left:4px solid #f59e0b; font-size:0.88rem;\">\n                {t('inspect_sheet_rule', lang)}\n            </div>\n            \"\"\",\n            unsafe_allow_html=True\n        )\n\n    st.markdown(\"<br>\", unsafe_allow_html=True)\n\n    # Check if repository is empty\n    total_repo_codes = db.count_work_codes()\n    if total_repo_codes == 0:\n        st.warning(f\"⚠️ {t('msg_repo_empty_warn', lang)}\")\n\n    uploaded_excel = st.file_uploader(\n        t(\"upload_inspect_label\", lang),\n        type=[\"xlsx\", \"xlsm\"],\n        key=\"inspect_file_uploader\",\n        help=t(\"inspect_upload_help\", lang)\n    )\n\n    if uploaded_excel is not None:\n        filename = uploaded_excel.name\n        col_act1, col_act2 = st.columns([3, 1], vertical_alignment=\"center\")\n        with col_act1:\n            st.write(f\"📄 **{t('inspect_file_selected', lang)}:** `{filename}` ({uploaded_excel.size / 1024:.1f} KB)\")\n        with col_act2:\n            inspect_btn = st.button(f\"🚀 {t('btn_inspect', lang)}\", type=\"primary\", use_container_width=True)\n\n        if inspect_btn or \"inspection_results\" in st.session_state:\n            if inspect_btn:\n                with st.spinner(t(\"inspecting_spinner\", lang)):\n                    file_bytes = uploaded_excel.getvalue()\n                    repo_lookup = db.get_all_codes_lookup()\n                    results = inspect_dgth_sheet(file_bytes, repo_lookup)\n                    st.session_state[\"inspection_results\"] = results\n                    st.session_state[\"inspection_file\"] = filename\n\n            results = st.session_state.get(\"inspection_results\")\n            if not results:\n                return\n\n            if not results.get(\"success\"):\n                st.error(f\"❌ {results.get('message', t('msg_sheet_dgth_not_found', lang))}\")\n                return\n\n            st.success(t(\"msg_inspect_success\", lang, filename=st.session_state.get(\"inspection_file\", filename)))\n\n            # METRIC OVERVIEW\n            st.markdown(f\"### 📊 {t('inspect_summary_metrics', lang)}\")\n            m_col1, m_col2, m_col3, m_col4 = st.columns(4)\n            with m_col1:\n                st.markdown(\n                    f\"\"\"\n                    <div class=\"metric-card\">\n                        <div style=\"color:#94a3b8; font-size:0.85rem; font-weight:600;\">{t('metric_total_items', lang)}</div>\n                        <div class=\"metric-val metric-val-info\">{results['total_items']:,}</div>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n            with m_col2:\n                st.markdown(\n                    f\"\"\"\n                    <div class=\"metric-card\">\n                        <div style=\"color:#94a3b8; font-size:0.85rem; font-weight:600;\">{t('metric_valid_items', lang)}</div>\n                        <div class=\"metric-val metric-val-success\">{results['valid_items']:,}</div>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n            with m_col3:\n                st.markdown(\n                    f\"\"\"\n                    <div class=\"metric-card\">\n                        <div style=\"color:#94a3b8; font-size:0.85rem; font-weight:600;\">{t('metric_error_items', lang)}</div>\n                        <div class=\"metric-val metric-val-danger\">{results['error_items']:,}</div>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n            with m_col4:\n                st.markdown(\n                    f\"\"\"\n                    <div class=\"metric-card\">\n                        <div style=\"color:#94a3b8; font-size:0.85rem; font-weight:600;\">{t('metric_sections', lang)}</div>\n                        <div class=\"metric-val metric-val-info\" style=\"color:#c084fc;\">{results['section_count']}</div>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n\n            st.markdown(\"<br>\", unsafe_allow_html=True)\n\n            # FILTER OPTIONS\n            filter_mode = st.radio(\n                t(\"filter_mode_label\", lang),\n                options=[t(\"filter_all\", lang), t(\"filter_errors\", lang), t(\"filter_valid\", lang)],\n                horizontal=True,\n                key=\"inspect_filter_mode\"\n            )\n\n            st.markdown(f\"### 📑 {t('inspect_results_by_section', lang)}\")\n\n            # EXPANDER PER SECTION (Hạng mục công trình)\n            export_rows = []\n\n            for s_idx, sec in enumerate(results[\"sections\"]):\n                sec_title = sec[\"title\"]\n                sec_total = sec[\"total_count\"]\n                sec_valid = sec[\"valid_count\"]\n                sec_error = sec[\"error_count\"]\n\n                status_badge = t(\"all_valid_badge\", lang) if sec_error == 0 else t(\"error_badge\", lang, count=sec_error)\n                expander_label = f\"📁 {sec_title}  ({sec_total} {t('jobs_count_label', lang)} | {status_badge})\"\n\n                is_expanded = (sec_error > 0)\n\n                with st.expander(expander_label, expanded=is_expanded):\n                    items = sec[\"items\"]\n                    if filter_mode == t(\"filter_errors\", lang):\n                        filtered_items = [it for it in items if it[\"status\"] != \"VALID\"]\n                    elif filter_mode == t(\"filter_valid\", lang):\n                        filtered_items = [it for it in items if it[\"status\"] == \"VALID\"]\n                    else:\n                        filtered_items = items\n\n                    if not filtered_items:\n                        st.info(t(\"no_matching_jobs\", lang))\n                    else:\n                        table_data = []\n                        for it in filtered_items:\n                            is_err = it[\"status\"] != \"VALID\"\n                            status_icon = t(\"status_not_found_icon\", lang) if is_err else t(\"status_valid_icon\", lang)\n                            table_data.append({\n                                t(\"th_stt\", lang): it[\"stt\"],\n                                t(\"th_excel_row\", lang): it[\"row_index\"],\n                                t(\"th_code_in_file\", lang): it[\"raw_code\"],\n                                t(\"th_code_normalized\", lang): it[\"norm_code\"],\n                                t(\"th_name_in_file\", lang): it[\"name_in_file\"],\n                                t(\"th_repo_name\", lang): it[\"repo_name\"] or \"—\",\n                                t(\"th_check_status\", lang): status_icon\n                            })\n                            export_rows.append({\n                                \"Hạng mục công trình\": sec_title,\n                                \"STT\": it[\"stt\"],\n                                \"Dòng Excel\": it[\"row_index\"],\n                                \"Mã trong file\": it[\"raw_code\"],\n                                \"Mã chuẩn hóa\": it[\"norm_code\"],\n                                \"Tên công việc trong file\": it[\"name_in_file\"],\n                                \"Tên trong kho\": it[\"repo_name\"],\n                                \"Trạng thái\": status_icon\n                            })\n\n                        df_sec = pd.DataFrame(table_data)\n                        st.dataframe(df_sec, use_container_width=True, hide_index=True)\n\n            # EXPORT INSPECTION REPORT BUTTON WITH 1CM BOTTOM SPACING\n            if export_rows:\n                st.divider()\n                rep_out = io.BytesIO()\n                with pd.ExcelWriter(rep_out, engine='xlsxwriter') as writer:\n                    df_rep = pd.DataFrame(export_rows)\n                    df_rep.to_excel(writer, sheet_name='Bao_Cao_Kiem_Tra', index=False)\n                rep_out.seek(0)\n\n                st.markdown('<div style=\"margin-top: 1rem; margin-bottom: 1cm; padding-bottom: 0.5cm;\">', unsafe_allow_html=True)\n                st.download_button(\n                    label=f\"📥 {t('btn_export_inspect_report', lang)}\",\n                    data=rep_out,\n                    file_name=f\"bao_cao_kiem_tra_{st.session_state.get('inspection_file', 'DGTH')}.xlsx\",\n                    mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                    key=\"dl_btn_inspect_report\"\n                )\n                st.markdown('</div>', unsafe_allow_html=True)\n"};

    window.addEventListener("load", async () => {
      const loadStatus = document.getElementById("load-status");
      loadStatus.innerText = "Đang tải thư viện Python & Công cụ QLDA...";

      try {
        // Check if running on Cloudflare Access / Pages Functions to inject user email
        let cfUserEmail = null;
        try {
          const res = await fetch("/api/user");
          if (res.ok) {
            const data = await res.json();
            if (data.email) cfUserEmail = data.email;
          }
        } catch(e) {}

        stlite.mount({
          requirements: [
            "openpyxl",
            "python-docx",
            "pandas",
            "xlsxwriter"
          ],
          entrypoint: "app.py",
          files: bundledFiles,
          streamlitConfig: {
            "theme.base": "dark",
            "theme.primaryColor": "#38bdf8",
            "theme.backgroundColor": "#0b0f19",
            "theme.secondaryBackgroundColor": "#1e293b",
            "theme.textColor": "#f1f5f9"
          }
        }, document.getElementById("root"));

        // Hide loading screen once streamlit is mounted
        const checkReady = setInterval(() => {
          const appElement = document.querySelector(".stApp");
          if (appElement) {
            clearInterval(checkReady);
            const loader = document.getElementById("loading-screen");
            loader.style.opacity = "0";
            setTimeout(() => loader.remove(), 500);
          }
        }, 300);

      } catch (err) {
        loadStatus.innerText = "Lỗi khởi chạy: " + err.message;
        console.error(err);
      }
    });
  </script>
