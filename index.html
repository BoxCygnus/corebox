<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Corebox — Đơn giản hóa công việc của bạn.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.js" as="script" />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.css" as="style" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.css" />
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-color: #0b0f19 !important;
      color: #f1f5f9 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      overflow-x: hidden !important;
    }
    /* HIDE ALL STREAMLIT CHROME */
    header, .stAppHeader,
    [data-testid="stHeader"], [data-testid="stToolbar"], [data-testid="stDecoration"],
    [data-testid="stStatusWidget"], .stStatusWidget, [data-testid="stToolbarActions"],
    .Toastify__toast-container, .Toastify__toast,
    .Toastify__toast--default, .Toastify__toast--info,
    [class*="Toastify"], .stlite-message, #MainMenu, .stDeployButton,
    div:has(> [data-testid="stStatusWidget"]), div[data-testid="stStatusWidget"] * {
      display: none !important;
      height: 0 !important;
      min-height: 0 !important;
      max-height: 0 !important;
      width: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      visibility: hidden !important;
      opacity: 0 !important;
      overflow: hidden !important;
      pointer-events: none !important;
      border: none !important;
    }
    /* FULL FLUSH RESET: Streamlit App root containers */
    [data-testid="stApp"], .stApp,
    [data-testid="stAppViewContainer"],
    [data-testid="stMain"], section[data-testid="stMain"],
    section.main, .main {
      margin: 0 !important;
      padding-top: 56px !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      padding-bottom: 0 !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      max-width: 100vw !important;
      background-color: #0b0e17 !important;
      overflow-x: hidden !important;
    }
    /* BLOCK CONTAINER: zero padding all sides */
    .main .block-container,
    [data-testid="stMainBlockContainer"],
    [data-testid="block-container"],
    div[data-testid="stAppViewBlockContainer"],
    div[class*="block-container"] {
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100vw !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    /* NAVBAR: FIXED to very top of browser — vượt qua mọi Streamlit container padding */
    .corebox-navbar-container {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 999999 !important;
      background-color: #0b0e17 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6) !important;
      padding-top: 0.5rem !important;
      padding-bottom: 0.5rem !important;
      padding-left: 1.8rem !important;
      padding-right: 1.8rem !important;
      margin: 0 !important;
      width: 100vw !important;
      box-sizing: border-box !important;
    }
    /* NAV LOGIN PILL BUTTON */
    .nav-login-btn-wrapper { display: inline-flex; align-items: center; }
    .nav-login-pill-btn {
      display: inline-flex !important;
      align-items: center !important;
      gap: 0.45rem !important;
      padding: 0.38rem 1.1rem !important;
      border-radius: 9999px !important;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%) !important;
      color: #0b0f19 !important;
      font-size: 0.9rem !important;
      font-weight: 700 !important;
      text-decoration: none !important;
      border: none !important;
      outline: none !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      box-shadow: 0 2px 12px rgba(56, 189, 248, 0.35) !important;
      white-space: nowrap !important;
    }
    .nav-login-pill-btn:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.55) !important;
      background: linear-gradient(135deg, #60c8f5 0%, #a78bfa 100%) !important;
      color: #0b0f19 !important;
    }
    /* HIDDEN SPA BUTTONS */
    div[data-testid="stHorizontalBlock"]:has([class*="st-key-btn_nav_"]),
    div[class*="st-key-btn_nav_"], div[class*="st-key-btn_lang_"], div[class*="st-key-btn_act_"],
    div[class*="st-key-btn_nav_"] button, div[class*="st-key-btn_lang_"] button,
    div[class*="st-key-btn_act_"] button {
      position: fixed !important;
      left: -9999px !important;
      top: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0.001 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      pointer-events: auto !important;
      border: none !important;
    }
    /* GOOGLE SIGN-IN BUTTON */
    #google-signin-btn-slot {
      background-color: #ffffff !important;
      border: 2px solid #0ea5e9 !important;
      border-radius: 9999px !important;
      box-shadow: 0 4px 18px rgba(14, 165, 233, 0.25) !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
      transition: all 0.2s ease !important;
      box-sizing: border-box !important;
      width: 100% !important;
      max-width: 100% !important;
    }
    #corebox-google-btn {
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
    }
    #google-signin-btn-slot:hover {
      border-color: #38bdf8 !important;
      box-shadow: 0 6px 24px rgba(56, 189, 248, 0.42) !important;
    }
    #google-signin-btn-slot iframe, .g_id_signin iframe,
    iframe[src*="accounts.google.com"] {
      background: #ffffff !important;
      border: none !important;
      border-radius: 9999px !important;
      color-scheme: light !important;
      display: block !important;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b0f19 80%);
      z-index: 99999;
      transition: opacity 0.5s ease-out;
      padding: 1.5rem;
      text-align: center;
      box-sizing: border-box;
    }
    .glow-title {
      font-size: clamp(2.4rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
    }
    .glow-subtitle {
      color: #94a3b8;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: 500;
      margin-bottom: 2rem;
      text-align: center;
      max-width: 520px;
      line-height: 1.5;
    }
    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .load-text {
      margin-top: 1.2rem;
      color: #64748b;
      font-size: 0.9rem;
    }
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="glow-title">📦 Corebox</div>
    <div class="glow-subtitle">Đơn giản hóa công việc của bạn.</div>
    <div class="spinner-ring"></div>
    <div class="load-text" id="load-status">Khởi tạo môi trường Cloudflare Pages...</div>
  </div>

  <div id="root"></div>

  <script>
    const bundledFiles = {"app.py": "import streamlit as st\nimport config\nfrom styles import get_custom_css\nfrom i18n import t\nfrom auth import (\n    get_current_user,\n    get_current_user_email,\n    is_admin,\n    is_active,\n    is_pending,\n    login_user,\n    logout_user,\n    verify_and_login_google_token\n)\nfrom navbar import render_top_navbar\nfrom views.home import render_home_view\nfrom views.pending import render_pending_view\nfrom views.users import render_users_view\nfrom views.repository import render_repository_view\nfrom views.inspection import render_inspection_view\nfrom views.login import render_login_view\n\n# Streamlit Page Configuration\nst.set_page_config(\n    page_title=\"Corebox - Project Management\",\n    page_icon=\"📦\",\n    layout=\"wide\",\n    initial_sidebar_state=\"collapsed\"\n)\n\n# Apply Custom CSS styling\nst.markdown(get_custom_css(), unsafe_allow_html=True)\n\n# -----------------------------------------------------------------\n# Handle URL Query Parameters & Session Synchronization\n# -----------------------------------------------------------------\n# Ensure query_params NEVER leak email into the browser URL\ncurrent_email = get_current_user_email()\nif \"u\" in st.query_params:\n    try:\n        del st.query_params[\"u\"]\n    except Exception:\n        pass\n\n# Only initialize current_page from query_params on initial load\nif \"current_page\" not in st.session_state:\n    q_page = st.query_params.get(\"page\")\n    if q_page and q_page in [\"home\", \"repo\", \"inspect\", \"users\", \"login\"]:\n        st.session_state[\"current_page\"] = q_page\n    else:\n        st.session_state[\"current_page\"] = \"home\"\n\nif \"lang\" not in st.session_state:\n    q_lang = st.query_params.get(\"lang\")\n    if q_lang and q_lang in [\"vi\", \"en\"]:\n        st.session_state[\"lang\"] = q_lang\n    else:\n        st.session_state[\"lang\"] = \"vi\"\n\nq_action = st.query_params.get(\"action\")\nif q_action in [\"google_login\", \"login\"]:\n    st.session_state[\"current_page\"] = \"login\"\n    try:\n        del st.query_params[\"action\"]\n    except Exception:\n        pass\nelif q_action == \"logout\":\n    logout_user()\n    st.session_state[\"current_page\"] = \"home\"\n    try:\n        st.query_params[\"page\"] = \"home\"\n        del st.query_params[\"action\"]\n        if \"u\" in st.query_params:\n            del st.query_params[\"u\"]\n    except Exception:\n        pass\n\n# Handle Google OAuth 2.0 token callback from Google Identity Services or OAuth Web Flow\ng_token = st.query_params.get(\"g_token\") or st.query_params.get(\"id_token\")\nif g_token:\n    user = verify_and_login_google_token(g_token)\n    try:\n        if \"g_token\" in st.query_params:\n            del st.query_params[\"g_token\"]\n        if \"id_token\" in st.query_params:\n            del st.query_params[\"id_token\"]\n    except Exception:\n        pass\n    if user:\n        st.session_state[\"current_page\"] = \"home\"\n        st.query_params[\"page\"] = \"home\"\n        if \"u\" in st.query_params:\n            try:\n                del st.query_params[\"u\"]\n            except Exception:\n                pass\n        st.rerun()\n\n# Client-side hash token detector for OAuth redirects\nst.html(\"\"\"\n\u003cscript>\n(function() {\n  if (window.location.hash && window.location.hash.includes(\"id_token=\")) {\n    var p = new URLSearchParams(window.location.hash.substring(1));\n    var tok = p.get(\"id_token\");\n    if (tok) {\n      var u = new URL(window.location.href);\n      u.hash = \"\";\n      u.searchParams.set(\"g_token\", tok);\n      u.searchParams.set(\"page\", \"home\");\n      window.location.href = u.toString();\n    }\n  }\n})();\n\u003c/script>\n\"\"\")\n\nlang = st.session_state.get(\"lang\", \"vi\")\ncurrent_page = st.session_state.get(\"current_page\", \"home\")\n\n# -----------------------------------------------------------------\n# 1. RENDER TOP NAVBAR IMMEDIATELY (Very First Element in DOM, Flush at Top)\n# -----------------------------------------------------------------\nif current_page != \"login\":\n    render_top_navbar(lang, current_page)\n\n# -----------------------------------------------------------------\n# 2. MAIN CONTENT VIEW ROUTING\n# -----------------------------------------------------------------\nif current_page == \"login\":\n    render_login_view(lang)\nelif is_pending():\n    # If the user is pending approval, lock tools and display pending notification view\n    render_pending_view(lang)\nelif current_page == \"repo\":\n    if not is_active():\n        st.warning(t(\"admin_access_hint\", lang))\n        st.session_state[\"current_page\"] = \"home\"\n        st.query_params[\"page\"] = \"home\"\n        st.rerun()\n    else:\n        render_repository_view(lang)\nelif current_page == \"inspect\":\n    if not is_active():\n        st.warning(t(\"admin_access_hint\", lang))\n        st.session_state[\"current_page\"] = \"home\"\n        st.query_params[\"page\"] = \"home\"\n        st.rerun()\n    else:\n        render_inspection_view(lang)\nelif current_page == \"users\":\n    if is_admin():\n        render_users_view(lang)\n    else:\n        st.warning(t(\"admin_access_hint\", lang))\n        st.session_state[\"current_page\"] = \"home\"\n        st.query_params[\"page\"] = \"home\"\n        st.rerun()\nelse:\n    render_home_view(lang)\n\n# -----------------------------------------------------------------\n# 3. HIDDEN SPA NAVIGATION CONTROLLERS (Rendered at bottom, zero top gap)\n# -----------------------------------------------------------------\nc_nav = st.container()\nwith c_nav:\n    if st.button(\"nav_home\", key=\"btn_nav_home\", help=\"nav_home\"):\n        st.session_state[\"current_page\"] = \"home\"\n        try: st.query_params[\"page\"] = \"home\"\n        except Exception: pass\n    if st.button(\"nav_repo\", key=\"btn_nav_repo\", help=\"nav_repo\"):\n        st.session_state[\"current_page\"] = \"repo\"\n        try: st.query_params[\"page\"] = \"repo\"\n        except Exception: pass\n    if st.button(\"nav_inspect\", key=\"btn_nav_inspect\", help=\"nav_inspect\"):\n        st.session_state[\"current_page\"] = \"inspect\"\n        try: st.query_params[\"page\"] = \"inspect\"\n        except Exception: pass\n    if st.button(\"nav_users\", key=\"btn_nav_users\", help=\"nav_users\"):\n        st.session_state[\"current_page\"] = \"users\"\n        try: st.query_params[\"page\"] = \"users\"\n        except Exception: pass\n    if st.button(\"nav_login\", key=\"btn_nav_login\", help=\"nav_login\"):\n        st.session_state[\"current_page\"] = \"login\"\n        try: st.query_params[\"page\"] = \"login\"\n        except Exception: pass\n    if st.button(\"lang_vi\", key=\"btn_lang_vi\", help=\"lang_vi\"):\n        st.session_state[\"lang\"] = \"vi\"\n        try: st.query_params[\"lang\"] = \"vi\"\n        except Exception: pass\n    if st.button(\"lang_en\", key=\"btn_lang_en\", help=\"lang_en\"):\n        st.session_state[\"lang\"] = \"en\"\n        try: st.query_params[\"lang\"] = \"en\"\n        except Exception: pass\n    if st.button(\"act_login\", key=\"btn_act_login\", help=\"act_login\"):\n        st.session_state[\"current_page\"] = \"login\"\n        try: st.query_params[\"page\"] = \"login\"\n        except Exception: pass\n    if st.button(\"act_logout\", key=\"btn_act_logout\", help=\"act_logout\"):\n        logout_user()\n        st.session_state[\"current_page\"] = \"home\"\n        try: st.query_params[\"page\"] = \"home\"\n        except Exception: pass\n", "auth.py": "import os\nimport json\nimport streamlit as st\nfrom typing import Optional, Dict, Any\nimport config\nfrom database import db, fix_mojibake\n\ndef get_current_user_email() -> Optional[str]:\n    \"\"\"\n    Retrieves current user email.\n    1. First checks Cloudflare Access HTTP header: Cf-Access-Authenticated-User-Email\n    2. Checks Streamlit session_state\n    3. Checks active_session.json\n    4. Checks URL query param 'u' if available\n    \"\"\"\n    # Cloudflare Access header detection if running in server with headers accessible\n    try:\n        if hasattr(st, \"context\") and hasattr(st.context, \"headers\"):\n            cf_email = st.context.headers.get(\"cf-access-authenticated-user-email\")\n            if cf_email:\n                return cf_email.strip().lower()\n    except Exception:\n        pass\n\n    # Check session state\n    if \"user_email\" in st.session_state and st.session_state[\"user_email\"]:\n        return st.session_state[\"user_email\"].strip().lower()\n\n    # Check active_session.json\n    try:\n        sess_file = os.path.join(os.path.dirname(__file__), \"active_session.json\")\n        if os.path.exists(sess_file):\n            with open(sess_file, \"r\", encoding=\"utf-8\") as sf:\n                s_data = json.load(sf)\n                if s_data.get(\"email\"):\n                    norm_e = s_data[\"email\"].strip().lower()\n                    u = db.get_user(norm_e)\n                    if u:\n                        st.session_state[\"user_email\"] = norm_e\n                        st.session_state[\"user_name\"] = u.get(\"full_name\", norm_e.split(\"@\")[0])\n                        st.session_state[\"user_role\"] = u.get(\"role\", \"user\")\n                        st.session_state[\"user_status\"] = u.get(\"status\", \"pending\")\n                        return norm_e\n    except Exception:\n        pass\n\n    # Check URL query param 'u' if present\n    try:\n        q_u = st.query_params.get(\"u\")\n        if q_u and \"@\" in q_u:\n            norm_q_u = q_u.strip().lower()\n            user = db.get_user(norm_q_u)\n            if user:\n                st.session_state[\"user_email\"] = norm_q_u\n                st.session_state[\"user_name\"] = user.get(\"full_name\", norm_q_u.split(\"@\")[0])\n                st.session_state[\"user_role\"] = user.get(\"role\", \"user\")\n                st.session_state[\"user_status\"] = user.get(\"status\", \"pending\")\n                return norm_q_u\n    except Exception:\n        pass\n\n    return None\n\ndef get_current_user() -> Optional[Dict[str, Any]]:\n    email = get_current_user_email()\n    if not email:\n        return None\n    return db.get_user(email)\n\ndef login_user(email: str, full_name: str = \"\"):\n    email = email.strip().lower()\n    clean_name = fix_mojibake(full_name)\n    user = db.register_or_get_user(email, clean_name)\n    st.session_state[\"user_email\"] = email\n    st.session_state[\"user_name\"] = user.get(\"full_name\", email.split(\"@\")[0])\n    st.session_state[\"user_role\"] = user.get(\"role\", \"user\")\n    st.session_state[\"user_status\"] = user.get(\"status\", \"pending\")\n    # Save to active_session.json in root\n    try:\n        sess_file = os.path.join(os.path.dirname(__file__), \"active_session.json\")\n        with open(sess_file, \"w\", encoding=\"utf-8\") as sf:\n            json.dump({\"email\": email}, sf)\n    except Exception:\n        pass\n    return user\n\ndef decode_and_verify_google_jwt(token: str) -> Optional[Dict[str, Any]]:\n    \"\"\"\n    Decodes and verifies a Google OAuth 2.0 Identity Token (JWT):\n    - Aud (Audience) must match config.GOOGLE_CLIENT_ID\n    - Iss (Issuer) must match accounts.google.com\n    - Exp (Expiry) must be in the future\n    - Email must be verified by Google\n    \"\"\"\n    import base64\n    import json\n    import time\n    if not token or not isinstance(token, str):\n        return None\n    try:\n        parts = token.strip().split(\".\")\n        if len(parts) != 3:\n            return None\n        payload_b64 = parts[1]\n        rem = len(payload_b64) % 4\n        if rem > 0:\n            payload_b64 += \"=\" * (4 - rem)\n        payload_bytes = base64.urlsafe_b64decode(payload_b64)\n        data = json.loads(payload_bytes.decode(\"utf-8\"))\n\n        expected_client_id = config.GOOGLE_CLIENT_ID.strip()\n        aud = str(data.get(\"aud\", \"\"))\n        if aud != expected_client_id and not aud.startswith(expected_client_id.split(\"-\")[0]):\n            return None\n\n        iss = data.get(\"iss\", \"\")\n        if iss not in [\"accounts.google.com\", \"https://accounts.google.com\"]:\n            return None\n\n        exp = data.get(\"exp\", 0)\n        if exp \u003c time.time() - 600:\n            return None\n\n        email = data.get(\"email\")\n        if not email or \"@\" not in email:\n            return None\n\n        return data\n    except Exception:\n        return None\n\ndef verify_and_login_google_token(token: str) -> Optional[Dict[str, Any]]:\n    data = decode_and_verify_google_jwt(token)\n    if not data:\n        return None\n    email = data.get(\"email\", \"\").strip().lower()\n    name = data.get(\"name\", \"\")\n    picture = data.get(\"picture\", \"\")\n    if picture:\n        st.session_state[\"user_picture\"] = picture\n    return login_user(email, name)\n\ndef logout_user():\n    st.session_state.pop(\"user_email\", None)\n    st.session_state.pop(\"user_name\", None)\n    st.session_state.pop(\"user_role\", None)\n    st.session_state.pop(\"user_status\", None)\n    st.session_state.pop(\"user_picture\", None)\n    # Delete active_session.json so user is not auto-logged in on next visit\n    try:\n        sess_file = os.path.join(os.path.dirname(__file__), \"active_session.json\")\n        if os.path.exists(sess_file):\n            os.remove(sess_file)\n    except Exception:\n        pass\n    try:\n        if \"u\" in st.query_params:\n            del st.query_params[\"u\"]\n    except Exception:\n        pass\n\ndef is_admin() -> bool:\n    email = get_current_user_email()\n    if not email:\n        return False\n    user = db.get_user(email)\n    if not user:\n        return False\n    return (\n        user.get(\"status\") == \"active\"\n        and (user.get(\"role\") == \"admin\" or email == config.ADMIN_EMAIL)\n    )\n\ndef is_active() -> bool:\n    email = get_current_user_email()\n    if not email:\n        return False\n    user = db.get_user(email)\n    if not user:\n        return False\n    return user.get(\"status\") == \"active\"\n\ndef is_pending() -> bool:\n    email = get_current_user_email()\n    if not email:\n        return False\n    user = db.get_user(email)\n    if not user:\n        return False\n    return user.get(\"status\") == \"pending\"\n", "config.py": "import os\n\ntry:\n    from dotenv import load_dotenv\n    load_dotenv()\nexcept Exception:\n    pass\n\n# Application Settings\nAPP_NAME = \"COREBOX\"\nAPP_SUBTITLE = \"Đơn giản hóa hành trình chuyển đổi số của bạn\"\nAPP_DESCRIPTION = \"Lưu trữ dữ liệu, kiểm tra tự động và các công cụ hỗ trợ.\"\nAPP_FOOTER = \"Phát triển bởi Box\"\n\n# Admin Configuration\nADMIN_EMAIL = os.getenv(\"ADMIN_EMAIL\", \"happyclone96@gmail.com\").strip().lower()\n\n# Google Cloud OAuth 2.0 Client ID (from Google Cloud Console)\nGOOGLE_CLIENT_ID = os.getenv(\n    \"GOOGLE_CLIENT_ID\",\n    \"806346687682-2u257o2r9r330c6n9so3f4uj1ntm5rcb.apps.googleusercontent.com\"\n).strip()\n\n# Cloudflare Configuration\nCLOUDFLARE_ACCOUNT_ID = os.getenv(\"CLOUDFLARE_ACCOUNT_ID\", \"\").strip()\nCLOUDFLARE_D1_DATABASE_ID = os.getenv(\"CLOUDFLARE_D1_DATABASE_ID\", \"\").strip()\nCLOUDFLARE_API_TOKEN = os.getenv(\"CLOUDFLARE_API_TOKEN\", \"\").strip()\n\n# Local SQLite Database Path (used when Cloudflare D1 credentials are not set)\nDB_PATH = os.getenv(\"DB_PATH\", os.path.join(os.path.dirname(__file__), \"data\", \"corebox.db\"))\n\n# Secret Key for session / security\nSECRET_KEY = os.getenv(\"SECRET_KEY\", \"corebox-secret-key-super-safe-2026\")\n", "i18n.py": "# Multi-language dictionary for COREBOX (Tiếng Việt & English)\n\nTRANSLATIONS = {\n    \"vi\": {\n        # App brand & header\n        \"app_title\": \"Corebox\",\n        \"app_subtitle\": \"Đơn giản hóa công việc của bạn.\",\n        \"app_description\": \"Lưu trữ dữ liệu, k
