, dd = parts[0], parts[1].zfill(2), parts[2].zfill(2)\n                elif len(parts[2]) == 4:\n                    dd, mm, yyyy = parts[0].zfill(2), parts[1].zfill(2), parts[2]\n                else:\n                    yyyy, mm, dd = parts[0], parts[1], parts[2]\n\n                if lang == \"en\":\n                    formatted_date = f\"{yyyy}-{mm}-{dd}\"\n                else:\n                    formatted_date = f\"{dd}-{mm}-{yyyy}\"\n\n                if time_part:\n                    return f\"{formatted_date} {time_part.strip()}\"\n                return formatted_date\n    except Exception:\n        pass\n    return val_clean\n", "database.py": "import os\nimport datetime\nfrom typing import List, Dict, Any, Optional, Tuple\nimport config\n\ntry:\n    import sqlite3\nexcept (ImportError, ModuleNotFoundError):\n    sqlite3 = None\n\ntry:\n    import requests\nexcept Exception:\n    requests = None\n\nimport json\n\ndef get_browser_storage():\n    try:\n        import js\n        return js.localStorage\n    except Exception:\n        return None\n\ndef load_browser_users() -> Dict[str, Dict[str, Any]]:\n    storage = get_browser_storage()\n    if storage:\n        try:\n            val = storage.getItem(\"corebox_users_store\")\n            if val:\n                return json.loads(str(val))\n        except Exception:\n            pass\n    return {}\n\ndef save_browser_users(users_map: Dict[str, Dict[str, Any]]):\n    storage = get_browser_storage()\n    if storage:\n        try:\n            storage.setItem(\"corebox_users_store\", json.dumps(users_map, ensure_ascii=False))\n        except Exception as e:\n            print(\"Failed to save to localStorage:\", e)\n\ndef fix_mojibake(s: str) -> str:\n    if not s or not isinstance(s, str):\n        return s\n    if any(k in s for k in [\"á»\", \"Ã\", \"áº\", \"á»‡\", \"á»•\", \"á»‹\", \"Â\", \"â\"]):\n        try:\n            fixed = s.encode(\"latin1\").decode(\"utf-8\")\n            if fixed:\n                return fixed\n        except Exception:\n            pass\n    return s\n\n# Default seed catalog codes for instant out-of-the-box browsing\nDEFAULT_SEED_CODES = [\n    {\"code\": \"AB.12300\", \"raw_code\": \"AB.123\", \"name\": \"Đào móng công trình bằng máy đào 0.8m3, đất cấp II\", \"unit\": \"100m3\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.12340\", \"raw_code\": \"AF.1234\", \"name\": \"Bê tông lót móng đá 4x6 mác 100\", \"unit\": \"m3\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.21111\", \"raw_code\": \"AF.21111\", \"name\": \"Bê tông móng đổ bằng thủ công đá 1x2 mác 200\", \"unit\": \"m3\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.22222\", \"raw_code\": \"AF.22222\", \"name\": \"Bê tông cột vách đá 1x2 mác 250\", \"unit\": \"m3\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.33333\", \"raw_code\": \"AF.33333\", \"name\": \"Bê tông dầm sàn đá 1x2 mác 250\", \"unit\": \"m3\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.61111\", \"raw_code\": \"AF.61111\", \"name\": \"Ván khuôn móng thép\", \"unit\": \"100m2\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.62222\", \"raw_code\": \"AF.62222\", \"name\": \"Ván khuôn cột dầm sàn thép\", \"unit\": \"100m2\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.63333\", \"raw_code\": \"AF.63333\", \"name\": \"Cốt thép dầm sàn đường kính \u003c= 10mm\", \"unit\": \"tấn\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.64444\", \"raw_code\": \"AF.64444\", \"name\": \"Cốt thép dầm sàn đường kính \u003c= 18mm\", \"unit\": \"tấn\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AK.11111\", \"raw_code\": \"AK.11111\", \"name\": \"Xây tường gạch ống 8x8x18 vữa xi măng mác 75\", \"unit\": \"m3\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AK.22222\", \"raw_code\": \"AK.22222\", \"name\": \"Trát tường trong vữa xi măng mác 75 dày 1.5cm\", \"unit\": \"m2\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AK.33333\", \"raw_code\": \"AK.33333\", \"name\": \"Lát gạch granite nhân tạo 600x600\", \"unit\": \"m2\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"BA.11100\", \"raw_code\": \"BA.111\", \"name\": \"Lắp đặt dây dẫn điện đơn ruột đồng\", \"unit\": \"100m\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"BA.22220\", \"raw_code\": \"BA.2222\", \"name\": \"Lắp đặt tủ điện phân phối chiếu sáng\", \"unit\": \"cái\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"BA.33333\", \"raw_code\": \"BA.33333\", \"name\": \"Lắp đặt đèn LED panel 600x600 48W\", \"unit\": \"bộ\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n]\n\nclass Database:\n    def __init__(self):\n        self.use_d1 = bool(\n            config.CLOUDFLARE_ACCOUNT_ID\n            and config.CLOUDFLARE_D1_DATABASE_ID\n            and config.CLOUDFLARE_API_TOKEN\n            and requests is not None\n        )\n        self.has_sqlite = (sqlite3 is not None)\n\n        # In-memory store (active in Pyodide / WebAssembly environment where sqlite3 is absent)\n        self._users: Dict[str, Dict[str, Any]] = {}\n        self._work_codes: List[Dict[str, Any]] = []\n        self._uploaded_files: Dict[str, Dict[str, Any]] = {}\n\n        if not self.use_d1 and self.has_sqlite:\n            db_dir = os.path.dirname(config.DB_PATH)\n            if db_dir:\n                try:\n                    os.makedirs(db_dir, exist_ok=True)\n                except Exception:\n                    pass\n        self.init_db()\n\n    def get_backend_name(self) -> str:\n        if self.use_d1:\n            return \"Cloudflare D1\"\n        if self.has_sqlite:\n            return \"Local SQLite\"\n        return \"WebAssembly Memory Engine (Pyodide)\"\n\n    def _execute_sqlite(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        if not self.has_sqlite:\n            return []\n        conn = sqlite3.connect(config.DB_PATH)\n        conn.row_factory = sqlite3.Row\n        cur = conn.cursor()\n        try:\n            cur.execute(query, params)\n            if query.strip().upper().startswith((\"SELECT\", \"PRAGMA\")):\n                rows = [dict(r) for r in cur.fetchall()]\n                conn.commit()\n                return rows\n            conn.commit()\n            return []\n        finally:\n            conn.close()\n\n    def _execute_d1(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        url = (\n            f\"https://api.cloudflare.com/client/v4/accounts/\"\n            f\"{config.CLOUDFLARE_ACCOUNT_ID}/d1/database/\"\n            f\"{config.CLOUDFLARE_D1_DATABASE_ID}/query\"\n        )\n        headers = {\n            \"Authorization\": f\"Bearer {config.CLOUDFLARE_API_TOKEN}\",\n            \"Content-Type\": \"application/json\"\n        }\n        payload = {\n            \"sql\": query,\n            \"params\": list(params)\n        }\n        try:\n            res = requests.post(url, json=payload, headers=headers, timeout=15)\n            data = res.json()\n            if not data.get(\"success\"):\n                errors = data.get(\"errors\", [])\n                raise RuntimeError(f\"Cloudflare D1 error: {errors}\")\n            result_objs = data.get(\"result\", [])\n            if result_objs and \"results\" in result_objs[0]:\n                return result_objs[0][\"results\"]\n            return []\n        except Exception as e:\n            print(f\"[Database] D1 query failed, falling back: {e}\")\n            if self.has_sqlite:\n                return self._execute_sqlite(query, params)\n            return []\n\n    def execute(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        if self.use_d1:\n            return self._execute_d1(query, params)\n        if self.has_sqlite:\n            return self._execute_sqlite(query, params)\n        return []\n\n    def init_db(self):\n        \"\"\"Create tables if they don't exist and ensure default admin is configured.\"\"\"\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        admin_email = config.ADMIN_EMAIL.strip().lower()\n\n        if self.use_d1 or self.has_sqlite:\n            schema = [\n                \"\"\"\n                CREATE TABLE IF NOT EXISTS users (\n                    email TEXT PRIMARY KEY,\n                    full_name TEXT,\n                    role TEXT DEFAULT 'user',\n                    status TEXT DEFAULT 'pending',\n                    created_at TEXT,\n                    updated_at TEXT\n                );\n                \"\"\",\n                \"\"\"\n                CREATE TABLE IF NOT EXISTS work_codes (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    code TEXT NOT NULL,\n                    raw_code TEXT,\n                    name TEXT NOT NULL,\n                    unit TEXT DEFAULT '',\n                    source_file TEXT NOT NULL,\n                    created_at TEXT\n                );\n                \"\"\",\n                \"\"\"\n                CREATE TABLE IF NOT EXISTS uploaded_files (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    filename TEXT UNIQUE NOT NULL,\n                    total_records INTEGER DEFAULT 0,\n                    uploaded_by TEXT NOT NULL,\n                    uploaded_at TEXT\n                );\n                \"\"\",\n                \"\"\"\n                CREATE INDEX IF NOT EXISTS idx_work_codes_code ON work_codes(code);\n                \"\"\",\n                \"\"\"\n                CREATE INDEX IF NOT EXISTS idx_work_codes_file ON work_codes(source_file);\n                \"\"\"\n            ]\n            for statement in schema:\n                self.execute(statement)\n\n            existing_admin = self.get_user(admin_email)\n            if not existing_admin:\n                self.execute(\n                    \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) \"\n                    \"VALUES (?, ?, 'admin', 'active', ?, ?)\",\n                    (admin_email, \"System Administrator\", now_str, now_str)\n                )\n            else:\n                if existing_admin.get(\"role\") != \"admin\" or existing_admin.get(\"status\") != \"active\":\n                    self.execute(\n                        \"UPDATE users SET role = 'admin', status = 'active', updated_at = ? WHERE email = ?\",\n                        (now_str, admin_email)\n                    )\n        else:\n            # In-memory initialization (Pyodide in browser)\n            self._users[admin_email] = {\n                \"email\": admin_email,\n                \"full_name\": \"System Administrator\",\n                \"role\": \"admin\",\n                \"status\": \"active\",\n                \"created_at\": now_str,\n                \"updated_at\": now_str\n            }\n            # Seed default records if empty\n            if not self._work_codes:\n                for r in DEFAULT_SEED_CODES:\n                    self._work_codes.append({\n                        \"code\": r[\"code\"],\n                        \"raw_code\": r[\"raw_code\"],\n                        \"name\": r[\"name\"],\n                        \"unit\": r[\"unit\"],\n                        \"source_file\": r[\"source_file\"],\n                        \"created_at\": now_str\n                    })\n                self._uploaded_files[\"danh_muc_chuan_2024.xlsx\"] = {\n                    \"filename\": \"danh_muc_chuan_2024.xlsx\",\n                    \"total_records\": len(DEFAULT_SEED_CODES),\n                    \"uploaded_by\": admin_email,\n                    \"uploaded_at\": now_str\n                }\n\n        # 1. Synchronize with users_store.json / data/users.json\n        root_dir = os.path.dirname(os.path.abspath(__file__))\n        users_file = os.path.join(root_dir, \"users_store.json\")\n        if not os.path.exists(users_file):\n            users_file = os.path.join(root_dir, \"data\", \"users.json\")\n\n        if os.path.exists(users_file):\n            try:\n                with open(users_file, \"r\", encoding=\"utf-8\") as uf:\n                    b_users = json.load(uf)\n                if isinstance(b_users, dict):\n                    for b_email, b_data in b_users.items():\n                        if \"full_name\" in b_data:\n                            b_data[\"full_name\"] = fix_mojibake(b_data[\"full_name\"])\n                        self._users[b_email] = b_data\n                        if self.use_d1 or self.has_sqlite:\n                            existing = self.execute(\"SELECT email FROM users WHERE email = ?\", (b_email,))\n                            if not existing:\n                                self.execute(\n                                    \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?)\",\n                                    (b_email, b_data.get(\"full_name\", \"\"), b_data.get(\"role\", \"user\"), b_data.get(\"status\", \"pending\"), b_data.get(\"created_at\", now_str), b_data.get(\"updated_at\", now_str))\n                                )\n                            else:\n                                self.execute(\n                                    \"UPDATE users SET full_name = ?, role = ?, status = ?, updated_at = ? WHERE email = ?\",\n                                    (b_data.get(\"full_name\", \"\"), b_data.get(\"role\", \"user\"), b_data.get(\"status\", \"pending\"), b_data.get(\"updated_at\", now_str), b_email)\n                                )\n            except Exception as e:\n                print(\"Error loading users_store.json:\", e)\n\n        # 2. Synchronize with catalog_store.json / data/catalog.json\n        catalog_file = os.path.join(root_dir, \"catalog_store.json\")\n        if not os.path.exists(catalog_file):\n            catalog_file = os.path.join(root_dir, \"data\", \"catalog.json\")\n\n        if os.path.exists(catalog_file):\n            try:\n                with open(catalog_file, \"r\", encoding=\"utf-8\") as cf:\n                    cat_content = cf.read()\n                self.import_catalog_json(cat_content)\n            except Exception as e:\n                print(\"Error loading catalog_store.json:\", e)\n        else:\n            # Seed default records only if completely empty\n            if self.count_work_codes() == 0:\n                self.seed_default_codes()\n\n    # ================= User Management =================\n    def _sync_all_to_browser(self):\n        try:\n            users_list = self.get_all_users()\n            save_browser_users({u[\"email\"]: u for u in users_list})\n        except Exception:\n            pass\n\n    def get_user(self, email: str) -> Optional[Dict[str, Any]]:\n        if not email:\n            return None\n        norm_email = email.strip().lower()\n        u = None\n        if self.use_d1 or self.has_sqlite:\n            res = self.execute(\"SELECT * FROM users WHERE email = ? LIMIT 1\", (norm_email,))\n            if res:\n                u = res[0]\n        # Check browser storage if not found in db\n        if not u:\n            b_users = load_browser_users()\n            if norm_email in b_users:\n                u = b_users[norm_email]\n                if self.use_d1 or self.has_sqlite:\n                    now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n                    self.execute(\n                        \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?)\",\n                        (norm_email, u.get(\"full_name\", \"\"), u.get(\"role\", \"user\"), u.get(\"status\", \"pending\"), u.get(\"created_at\", now_str), u.get(\"updated_at\", now_str))\n                    )\n        if not u:\n            u = self._users.get(norm_email)\n        if u and \"full_name\" in u:\n            u[\"full_name\"] = fix_mojibake(u[\"full_name\"])\n        return u\n\n    def register_or_get_user(self, email: str, full_name: str = \"\") -> Dict[str, Any]:\n        norm_email = email.strip().lower()\n        user = self.get_user(norm_email)\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n        if user:\n            self._sync_all_to_browser()\n            return user\n\n        if norm_email == config.ADMIN_EMAIL.strip().lower():\n            role = \"admin\"\n            status = \"active\"\n        else:\n            role = \"user\"\n            status = \"pending\"\n\n        display_name = fix_mojibake(full_name or norm_email.split(\"@\")[0])\n\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\n                \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) \"\n                \"VALUES (?, ?, ?, ?, ?, ?)\",\n                (norm_email, display_name, role, status, now_str, now_str)\n            )\n            u = self.get_user(norm_email)\n            self._users[norm_email] = u\n        else:\n            new_u = {\n                \"email\": norm_email,\n                \"full_name\": display_name,\n                \"role\": role,\n                \"status\": status,\n                \"created_at\": now_str,\n                \"updated_at\": now_str\n            }\n            self._users[norm_email] = new_u\n            u = new_u\n\n        self._sync_all_to_browser()\n        return u\n\n    def get_all_users(self, status: Optional[str] = None) -> List[Dict[str, Any]]:\n        # Sync in any browser users first\n        b_users = load_browser_users()\n        if b_users and (self.use_d1 or self.has_sqlite):\n            for b_email, b_data in b_users.items():\n                existing = self.execute(\"SELECT email FROM users WHERE email = ?\", (b_email,))\n                if not existing:\n                    now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n                    self.execute(\n                        \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?)\",\n                        (b_email, b_data.get(\"full_name\", \"\"), b_data.get(\"role\", \"user\"), b_data.get(\"status\", \"pending\"), b_data.get(\"created_at\", now_str), b_data.get(\"updated_at\", now_str))\n                    )\n\n        if self.use_d1 or self.has_sqlite:\n            if status:\n                return self.execute(\"SELECT * FROM users WHERE status = ? ORDER BY created_at DESC\", (status,))\n            return self.execute(\"SELECT * FROM users ORDER BY created_at DESC\")\n        else:\n            users = list(self._users.values())\n            if status:\n                users = [u for u in users if u.get(\"status\") == status]\n            users.sort(key=lambda u: u.get(\"created_at\", \"\"), reverse=True)\n            return users\n\n    def update_user_status(self, email: str, status: str):\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        norm_email = email.strip().lower()\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\n                \"UPDATE users SET status = ?, updated_at = ? WHERE email = ?\",\n                (status, now_str, norm_email)\n            )\n        u = self._users.get(norm_email)\n        if u:\n            u[\"status\"] = status\n            u[\"updated_at\"] = now_str\n        self._sync_all_to_browser()\n\n    def update_user_role(self, email: str, role: str):\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        norm_email = email.strip().lower()\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\n                \"UPDATE users SET role = ?, updated_at = ? WHERE email = ?\",\n                (role, now_str, norm_email)\n            )\n        u = self._users.get(norm_email)\n        if u:\n            u[\"role\"] = role\n            u[\"updated_at\"] = now_str\n        self._sync_all_to_browser()\n\n    def delete_user(self, email: str):\n        norm_email = email.strip().lower()\n        if norm_email == config.ADMIN_EMAIL.strip().lower():\n            return\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\"DELETE FROM users WHERE email = ?\", (norm_email,))\n        self._users.pop(norm_email, None)\n        self._sync_all_to_browser()\n\n    # ================= Work Codes Repository =================\n    def add_work_codes(self, records: List[Dict[str, str]], filename: str, uploaded_by: str) -> int:\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\"DELETE FROM work_codes WHERE source_file = ?\", (filename,))\n            self.execute(\"DELETE FROM uploaded_files WHERE filename = ?\", (filename,))\n\n            inserted_count = 0\n            if self.has_sqlite and not self.use_d1:\n                conn = sqlite3.connect(config.DB_PATH)\n                cur = conn.cursor()\n                try:\n                    for r in records:\n                        cur.execute(\n                            \"INSERT INTO work_codes (code, raw_code, name, unit, source_file, created_at) \"\n                            \"VALUES (?, ?, ?, ?, ?, ?)\",\n                            (r[\"code\"], r.get(\"raw_code\", r[\"code\"]), r[\"name\"], r.get(\"unit\", \"\"), filename, now_str)\n                        )\n                        inserted_count += 1\n                    conn.commit()\n                finally:\n                    conn.close()\n            else:\n                for r in records:\n                    self.execute(\n                        \"INSERT INTO work_codes (code, raw_code, name, unit, source_file, created_at) \"\n                        \"VALUES (?, ?, ?, ?, ?, ?)\",\n                        (r[\"code\"], r.get(\"raw_code\", r[\"code\"]), r[\"name\"], r.get(\"unit\", \"\"), filename, now_str)\n                    )\n                    inserted_count += 1\n\n            self.execute(\n                \"INSERT INTO uploaded_files (filename, total_records, uploaded_by, uploaded_at) \"\n                \"VALUES (?, ?, ?, ?)\",\n                (filename, inserted_count, uploaded_by, now_str)\n            )\n            return inserted_count\n        else:\n            # In-memory implementation\n            self._work_codes = [r for r in self._work_codes if r.get(\"source_file\") != filename]\n            for r in records:\n                self._work_codes.append({\n                    \"code\": r[\"code\"],\n                    \"raw_code\": r.get(\"raw_code\", r[\"code\"]),\n                    \"name\": r[\"name\"],\n                    \"unit\": r.get(\"unit\", \"\"),\n                    \"source_file\": filename,\n                    \"created_at\": now_str\n                })\n            self._uploaded_files[filename] = {\n                \"filename\": filename,\n                \"total_records\": len(records),\n                \"uploaded_by\": uploaded_by,\n                \"uploaded_at\": now_str\n            }\n            self._persist_catalog_to_file()\n            return len(records)\n\n    def _persist_catalog_to_file(self):\n        try:\n            root_dir = os.path.dirname(os.path.abspath(__file__))\n            catalog_file = os.path.join(root_dir, \"catalog_store.json\")\n            with open(catalog_file, \"w\", encoding=\"utf-8\") as cf:\n                cf.write(self.export_catalog_json())\n        except Exception:\n            pass\n\n    def get_uploaded_files(self) -> List[Dict[str, Any]]:\n        if self.use_d1 or self.has_sqlite:\n            return self.execute(\"SELECT * FROM uploaded_files ORDER BY uploaded_at DESC\")\n        else:\n            files = list(self._uploaded_files.values())\n            files.sort(key=lambda f: f.get(\"uploaded_at\", \"\"), reverse=True)\n            return files\n\n    def delete_uploaded_file(self, filename: str):\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\"DELETE FROM work_codes WHERE source_file = ?\", (filename,))\n            self.execute(\"DELETE FROM uploaded_files WHERE filename = ?\", (filename,))\n        else:\n            self._work_codes = [r for r in self._work_codes if r.get(\"source_file\") != filename]\n            self._uploaded_files.pop(filename, None)\n            self._persist_catalog_to_file()\n\n    def get_work_codes(\n        self,\n        search: Optional[str] = None,\n        source_file: Optional[str] = None,\n        limit: int = 100,\n        offset: int = 0\n    ) -> List[Dict[str, Any]]:\n        if self.use_d1 or self.has_sqlite:\n            query = \"SELECT * FROM work_codes WHERE 1=1\"\n            params = []\n            if source_file:\n                query += \" AND source_file = ?\"\n                params.append(source_file)\n            if search:\n                query += \" AND (code LIKE ? OR name LIKE ? OR raw_code LIKE ?)\"\n                s_param = f\"%{search}%\"\n                params.extend([s_param, s_param, s_param])\n            query += \" ORDER BY code ASC LIMIT ? OFFSET ?\"\n            params.extend([limit, offset])\n            return self.execute(query, tuple(params))\n        else:\n            res = []\n            for r in self._work_codes:\n                if source_file and r.get(\"source_file\") != source_file:\n                    continue\n                if search:\n                    s = search.lower()\n                    if (s not in r.get(\"code\", \"\").lower()\n                        and s not in r.get(\"name\", \"\").lower()\n                        and s not in r.get(\"raw_code\", \"\").lower()):\n                        continue\n                res.append(r)\n            res.sort(key=lambda x: x.get(\"code\", \"\"))\n            return res[offset:offset+limit]\n\n    def count_work_codes(self, search: Optional[str] = None, source_file: Optional[str] = None) -> int:\n        if self.use_d1 or self.has_sqlite:\n            query = \"SELECT COUNT(*) as cnt FROM work_codes WHERE 1=1\"\n            params = []\n            if source_file:\n                query += \" AND source_file = ?\"\n                params.append(source_file)\n            if search:\n                query += \" AND (code LIKE ? OR name LIKE ? OR raw_code LIKE ?)\"\n                s_param = f\"%{search}%\"\n                params.extend([s_param, s_param, s_param])\n            res = self.execute(query, tuple(params))\n            return res[0][\"cnt\"] if res else 0\n        else:\n            cnt = 0\n            for r in self._work_codes:\n                if source_file and r.get(\"source_file\") != source_file:\n                    continue\n                if search:\n                    s = search.lower()\n                    if (s not in r.get(\"code\", \"\").lower()\n                        and s not in r.get(\"name\", \"\").lower()\n                        and s not in r.get(\"raw_code\", \"\").lower()):\n                        continue\n                cnt += 1\n            return cnt\n\n    def seed_default_codes(self):\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        admin_email = config.ADMIN_EMAIL.strip().lower()\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\"DELETE FROM work_codes WHERE source_file = 'danh_muc_chuan_2024.xlsx'\")\n            self.execute(\"DELETE FROM uploaded_files WHERE filename = 'danh_muc_chuan_2024.xlsx'\")\n            for r in DEFAULT_SEED_CODES:\n                self.execute(\n                    \"INSERT INTO work_codes (code, raw_code, name, unit, source_file, created_at) \"\n                    \"VALUES (?, ?, ?, ?, ?, ?)\",\n                    (r[\"code\"], r.get(\"raw_code\", r[\"code\"]), r[\"name\"], r.get(\"unit\", \"\"), r[\"source_file\"], now_str)\n                )\n            self.execute(\n                \"INSERT INTO uploaded_files (filename, total_records, uploaded_by, uploaded_at) \"\n                \"VALUES ('danh_muc_chuan_2024.xlsx', ?, ?, ?)\",\n                (len(DEFAULT_SEED_CODES), admin_email, now_str)\n            )\n        else:\n            self._work_codes = []\n            for r in DEFAULT_SEED_CODES:\n                self._work_codes.append({\n                    \"code\": r[\"code\"],\n                    \"raw_code\": r[\"raw_code\"],\n                    \"name\": r[\"name\"],\n                    \"unit\": r[\"unit\"],\n                    \"source_file\": r[\"source_file\"],\n                    \"created_at\": now_str\n                })\n            self._uploaded_files = {\n                \"danh_muc_chuan_2024.xlsx\": {\n                    \"filename\": \"danh_muc_chuan_2024.xlsx\",\n                    \"total_records\": len(DEFAULT_SEED_CODES),\n                    \"uploaded_by\": admin_email,\n                    \"uploaded_at\": now_str\n                }\n            }\n\n    def get_all_work_codes(self) -> List[Dict[str, Any]]:\n        if self.use_d1 or self.has_sqlite:\n            return self.execute(\"SELECT code, raw_code, name, unit, source_file, created_at FROM work_codes ORDER BY code ASC\")\n        codes = list(self._work_codes)\n        codes.sort(key=lambda x: x.get(\"code\", \"\"))\n        return codes\n\n    def export_catalog_json(self) -> str:\n        data = {\n            \"uploaded_files\": self.get_uploaded_files(),\n            \"work_codes\": self.get_all_work_codes()\n        }\n        return json.dumps(data, ensure_ascii=False)\n\n    def import_catalog_json(self, cat_content: str):\n        if not cat_content:\n            return\n        try:\n            data = json.loads(cat_content) if isinstance(cat_content, str) else cat_content\n            if not isinstance(data, dict):\n                return\n            u_files = data.get(\"uploaded_files\", [])\n            w_codes = data.get(\"work_codes\", [])\n            now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n            if self.use_d1 or self.has_sqlite:\n                self.execute(\"DELETE FROM work_codes\")\n                self.execute(\"DELETE FROM uploaded_files\")\n                for f in u_files:\n                    self.execute(\n                        \"INSERT INTO uploaded_files (filename, total_records, uploaded_by, uploaded_at) VALUES (?, ?, ?, ?)\",\n                        (f.get(\"filename\", \"\"), f.get(\"total_records\", 0), f.get(\"uploaded_by\", \"\"), f.get(\"uploaded_at\", now_str))\n                    )\n                for c in w_codes:\n                    self.execute(\n                        \"INSERT INTO work_codes (code, raw_code, name, unit, source_file, created_at) VALUES (?, ?, ?, ?, ?, ?)\",\n                        (c.get(\"code\", \"\"), c.get(\"raw_code\", c.get(\"code\", \"\")), c.get(\"name\", \"\"), c.get(\"unit\", \"\"), c.get(\"source_file\", \"\"), c.get(\"created_at\", now_str))\n                    )\n            else:\n                self._uploaded_files = {f[\"filename\"]: f for f in u_files if \"filename\" in f}\n                self._work_codes = list(w_codes)\n        except Exception as e:\n            print(\"Failed to import catalog JSON:\", e)\n\n    def get_all_codes_lookup(self) -> Dict[str, Dict[str, str]]:\n        if self.use_d1 or self.has_sqlite:\n            rows = self.execute(\"SELECT code, raw_code, name, unit, source_file FROM work_codes\")\n        else:\n            rows = self._work_codes\n\n        lookup = {}\n        for r in rows:\n            info = {\n                \"name\": r[\"name\"],\n                \"unit\": r.get(\"unit\", \"\"),\n                \"source_file\": r.get(\"source_file\", \"\"),\n                \"code\": r[\"code\"]\n            }\n            lookup[r[\"code\"].upper()] = info\n            if r.get(\"raw_code\"):\n                lookup[r[\"raw_code\"].upper()] = info\n        return lookup\n\n# Global database instance\ndb = Database()\n", "parsers.py": "import io\nimport re\nimport openpyxl\nfrom typing import List, Dict, Any, Tuple, Optional\nimport docx\n\ntry:\n    import pdfplumber\nexcept ImportError:\n    pdfplumber = None\n\n# Regular expression to match standard or short work codes:\n# e.g. AB.123, AF.1234, AK.55555, AB12345\nWORK_CODE_PATTERN = re.compile(r\"^([A-Za-z]{2})[\\.\\s_-]?(\\d{1,5})$\")\n\n# Flexible column keyword aliases\nCODE_KEYWORDS = [\n    \"mã hiệu\", \"mã cv\", \"mã định mức\", \"mã hiệu đm\", \"mã công việc\",\n    \"mã số\", \"mã\", \"work code\", \"code\", \"mã đơn giá\", \"mã hiệu cv\"\n]\nNAME_KEYWORDS = [\n    \"tên công việc\", \"nội dung công việc\", \"tên công tác\", \"công tác lắp đặt\",\n    \"nội dung\", \"diễn giải\", \"tên hạng mục\", \"hạng mục\", \"mô tả công việc\",\n    \"work name\", \"description\", \"tên công tác xây lắp\"\n]\nUNIT_KEYWORDS = [\n    \"đơn vị\", \"đơn vị tính\", \"đvt\", \"unit\"\n]\nSTT_KEYWORDS = [\n    \"stt\", \"số tt\", \"số thứ tự\", \"no\", \"tt\"\n]\n\ndef clean_str(val: Any) -> str:\n    \"\"\"Safely converts cell values to stripped string.\"\"\"\n    if val is None:\n        return \"\"\n    s = str(val).strip()\n    return s\n\ndef extract_first_unit(val: Any) -> str:\n    \"\"\"\n    Ưu tiên lấy đơn vị tính đầu tiên tương đương nội dung công việc tổng quát.\n    Lọc bỏ các đơn vị phụ hoặc dòng giải thích chi tiết phía sau (ví dụ: '100m3\\\\nm3' -> '100m3').\n    \"\"\"\n    if not val:\n        return \"\"\n    text = clean_str(val)\n    if not text:\n        return \"\"\n    # Tách theo dòng mới trước (thường gặp trong các ô excel xuống dòng cho từng chi tiết)\n    lines = [line.strip() for line in re.split(r'[\\r\\n]+', text) if line.strip()]\n    first_line = lines[0] if lines else text\n    \n    # Tách theo dấu phẩy, chấm phẩy, hoặc thanh đứng phân cách nhiều đơn vị\n    tokens = [t.strip() for t in re.split(r'[,;|\\t]+', first_line) if t.strip()]\n    first_token = tokens[0] if tokens else first_line\n    \n    # Bỏ các ký tự gạch đầu dòng nếu có\n    first_token = re.sub(r'^[-–—•*+\\s]+', '', first_token).strip()\n    return first_token\n\ndef normalize_work_code(raw_code: str) -> str:\n    \"\"\"\n    Quy chuẩn hóa Mã CV:\n    Mã CV luôn có cấu trúc dạng XX.YYYYY (2 ký tự chữ cái, dấu chấm, và đúng 5 chữ số).\n    Nếu file nguồn có mã chỉ chứa 1-4 chữ số sau dấu chấm (ví dụ: AB.123),\n    hệ thống tự động đệm thêm các số 0 vào cuối cho đủ 5 chữ số (AB.12300).\n    \"\"\"\n    if not raw_code:\n        return \"\"\n    code_clean = raw_code.strip()\n    match = WORK_CODE_PATTERN.match(code_clean)\n    if match:\n        letters = match.group(1).upper()\n        digits = match.group(2)\n        # Pad with zeros to 5 digits\n        padded_digits = digits.ljust(5, \"0\")\n        return f\"{letters}.{padded_digits}\"\n    \n    # Check if there is an internal period like 'AB.12'\n    parts = code_clean.split(\".\")\n    if len(parts) == 2 and len(parts[0]) == 2 and parts[0].isalpha() and parts[1].isdigit():\n        letters = parts[0].upper()\n        digits = parts[1].ljust(5, \"0\")\n        return f\"{letters}.{digits}\"\n\n    return code_clean.upper()\n\ndef is_header_match(cell_value: str, keywords: List[str]) -> bool:\n    if not cell_value:\n        return False\n    val_lower = cell_value.lower().strip()\n    for kw in keywords:\n        if kw == val_lower or kw in val_lower:\n            return True\n    return False\n\n# ================= 1. EXCEL CATALOG PARSER =================\ndef extract_from_excel(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất thông minh từ Excel:\n    Duyệt các sheet, tìm bảng có tiêu đề Mã CV và Tên công việc.\n    Lọc bỏ văn bản giải thích rườm rà.\n    \"\"\"\n    wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=True)\n    records = []\n    seen_codes = set()\n\n    for sheet in wb.worksheets:\n        header_row_idx = None\n        col_code_idx = None\n        col_name_idx = None\n        col_unit_idx = None\n\n        # Scan first 50 rows to detect header table\n        for r_idx, row in enumerate(sheet.iter_rows(values_only=True), start=1):\n            if r_idx > 50:\n                break\n            row_str = [clean_str(c) for c in row]\n            \n            c_code = None\n            c_name = None\n            c_unit = None\n            \n            for c_idx, cell_text in enumerate(row_str):\n                if not cell_text:\n                    continue\n                if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                    c_code = c_idx\n                elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                    c_name = c_idx\n                elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                    c_unit = c_idx\n\n            if c_code is not None and c_name is not None:\n                header_row_idx = r_idx\n                col_code_idx = c_code\n                col_name_idx = c_name\n                col_unit_idx = c_unit\n                break\n\n        if header_row_idx is not None:\n            # Read rows after header\n            for row in sheet.iter_rows(min_row=header_row_idx + 1, values_only=True):\n                if not row or len(row) \u003c= max(col_code_idx, col_name_idx):\n                    continue\n                raw_code = clean_str(row[col_code_idx])\n                name = clean_str(row[col_name_idx])\n                unit = clean_str(row[col_unit_idx]) if col_unit_idx is not None and len(row) > col_unit_idx else \"\"\n\n                if not raw_code or not name:\n                    continue\n                \n                # Check if this row is another repeated header or footer\n                if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                    continue\n\n                norm_code = normalize_work_code(raw_code)\n                if norm_code not in seen_codes:\n                    seen_codes.add(norm_code)\n                    records.append({\n                        \"code\": norm_code,\n                        \"raw_code\": raw_code,\n                        \"name\": name,\n                        \"unit\": extract_first_unit(unit)\n                    })\n\n    return records\n\n# ================= 2. WORD (.DOCX) CATALOG PARSER =================\ndef extract_from_docx(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất thông minh từ Word (.docx):\n    Bỏ qua toàn bộ văn bản mô tả, chỉ quét các bảng (Tables).\n    Tìm hàng tiêu đề có Mã CV & Tên công việc.\n    \"\"\"\n    doc = docx.Document(io.BytesIO(file_bytes))\n    records = []\n    seen_codes = set()\n\n    for table in doc.tables:\n        header_row_idx = None\n        col_code_idx = None\n        col_name_idx = None\n        col_unit_idx = None\n\n        for r_idx, row in enumerate(table.rows):\n            cells_text = [clean_str(c.text) for c in row.cells]\n            \n            c_code = None\n            c_name = None\n            c_unit = None\n            for c_idx, cell_text in enumerate(cells_text):\n                if not cell_text:\n                    continue\n                if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                    c_code = c_idx\n                elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                    c_name = c_idx\n                elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                    c_unit = c_idx\n\n            if c_code is not None and c_name is not None:\n                header_row_idx = r_idx\n                col_code_idx = c_code\n                col_name_idx = c_name\n                col_unit_idx = c_unit\n                break\n\n        if header_row_idx is not None:\n            for r_idx in range(header_row_idx + 1, len(table.rows)):\n                row = table.rows[r_idx]\n                cells_text = [clean_str(c.text) for c in row.cells]\n                if len(cells_text) \u003c= max(col_code_idx, col_name_idx):\n                    continue\n                raw_code = cells_text[col_code_idx]\n                name = cells_text[col_name_idx]\n                unit = cells_text[col_unit_idx] if col_unit_idx is not None and len(cells_text) > col_unit_idx else \"\"\n\n                if not raw_code or not name:\n                    continue\n                if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                    continue\n\n                norm_code = normalize_work_code(raw_code)\n                if norm_code not in seen_codes:\n                    seen_codes.add(norm_code)\n                    records.append({\n                        \"code\": norm_code,\n                        \"raw_code\": raw_code,\n                        \"name\": name,\n                        \"unit\": extract_first_unit(unit)\n                    })\n\n    # Fallback for Word files without explicit tables (lists in paragraphs)\n    if not records:\n        for p in doc.paragraphs:\n            text = clean_str(p.text)\n            if not text:\n                continue\n            match = re.search(r\"\\b([A-Za-z]{2}[\\.\\s_-]?\\d{1,5})\\b\", text)\n            if match:\n                raw_code = match.group(1).strip()\n                norm_code = normalize_work_code(raw_code)\n                if WORK_CODE_PATTERN.match(norm_code) and norm_code not in seen_codes:\n                    remainder = text[match.end():].strip()\n                    remainder = re.sub(r\"^[-–—:.\\s]+\", \"\", remainder).strip()\n                    if len(remainder) >= 3:\n                        parts = remainder.rsplit(None, 1)\n                        unit = \"\"\n                        name = remainder\n                        if len(parts) == 2 and any(u in parts[1].lower() for u in [\"m\", \"m2\", \"m3\", \"tấn\", \"kg\", \"cái\", \"bộ\", \"100m\", \"100m2\", \"100m3\", \"km\"]):\n                            name = parts[0].strip()\n                            unit = parts[1].strip()\n                        seen_codes.add(norm_code)\n                        records.append({\n                            \"code\": norm_code,\n                            \"raw_code\": raw_code,\n                            \"name\": name,\n                            \"unit\": extract_first_unit(unit)\n                        })\n\n    return records\n\n# ================= 3. PDF CATALOG PARSER =================\ndef extract_from_pdf(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất danh mục từ PDF (đặc biệt hỗ trợ bảng Mục lục chuẩn: Mã hiệu, Nội dung, Trang):\n    - Chỉ lấy 2 nội dung: mã hiệu (code) và nội dung (name), unit=''\n    - Bỏ qua các dòng chương / mục không có mã hiệu (như Thuyết minh, Chương I...)\n    - Loại bỏ số trang ở cuối dòng\n    \"\"\"\n    records = []\n    seen_codes = set()\n\n    # 1. Thử qua pdfplumber nếu có (local / server)\n    if pdfplumber is not None:\n        try:\n            with pdfplumber.open(io.BytesIO(file_bytes)) as pdf:\n                for page in pdf.pages:\n                    tables = page.extract_tables() or []\n                    for table in tables:\n                        if not table:\n                            continue\n                        header_row_idx = None\n                        col_code_idx = None\n                        col_name_idx = None\n\n                        for r_idx, row in enumerate(table):\n                            row_str = [clean_str(c) for c in row]\n                            c_code = None\n                            c_name = None\n                            for c_idx, cell_text in enumerate(row_str):\n                                if not cell_text:\n                                    continue\n                                if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                                    c_code = c_idx\n                                elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                                    c_name = c_idx\n                            if c_code is not None and c_name is not None:\n                                header_row_idx = r_idx\n                                col_code_idx = c_code\n                                col_name_idx = c_name\n                                break\n\n                        if header_row_idx is not None:\n                            for row in table[header_row_idx + 1:]:\n                                if len(row) \u003c= max(col_code_idx, col_name_idx):\n                                    continue\n                                raw_code = clean_str(row[col_code_idx])\n                                name = clean_str(row[col_name_idx])\n\n                                if not raw_code or not name:\n                                    continue\n                                if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                                    continue\n\n                                # Bỏ qua dòng tiêu đề chương (không có mã chuẩn)\n                                match = re.search(r\"\\b([A-Za-z]{2}[\\.\\s_-]?\\d{3,5})\\b\", raw_code)\n                                if not match:\n                                    continue\n\n                                norm_code = normalize_work_code(match.group(1))\n                                if norm_code not in seen_codes:\n                                    seen_codes.add(norm_code)\n                                    records.append({\n                                        \"code\": norm_code,\n                                        \"raw_code\": raw_code,\n                                        \"name\": name,\n                                        \"unit\": \"\"\n                                    })\n        except Exception:\n            pass\n\n    # 2. Hỗ trợ pypdf (thư viện thuần Python, hoạt động hoàn hảo trên WebAssembly/Pyodide)\n    if not records:\n        try:\n            import pypdf\n            reader = pypdf.PdfReader(io.BytesIO(file_bytes))\n            # Pattern trích xuất: Mã hiệu ở đầu, sau đó là Nội dung công việc, có thể kèm số trang ở cuối\n            toc_line_pat = re.compile(r\"^\\s*([A-Za-z]{2}[\\.\\s_-]?\\d{3,5})\\s+(.*?)(?:\\s+\\d+)?\\s*$\")\n\n            for page in reader.pages:\n                text = page.extract_text() or \"\"\n                lines = text.splitlines()\n                for line in lines:\n                    line = clean_str(line)\n                    if not line:\n                        continue\n\n                    # Thử khớp dòng bắt đầu bằng Mã hiệu\n                    m = toc_line_pat.match(line)\n                    if m:\n                        raw_code = m.group(1).strip()\n                        norm_code = normalize_work_code(raw_code)\n                        name_raw = m.group(2).strip()\n                        # Làm sạch dấu chấm leader (...... 15) và dấu gạch\n                        name_clean = re.sub(r\"[\\.\\s_–—]+$\", \"\", name_raw).strip()\n                        name_clean = re.sub(r\"^[-–—:.\\s]+\", \"\", name_clean).strip()\n\n                        if len(name_clean) >= 2 and norm_code not in seen_codes:\n                            seen_codes.add(norm_code)\n                            records.append({\n                                \"code\": norm_code,\n                                \"raw_code\": raw_code,\n                                \"name\": name_clean,\n                                \"unit\": \"\"\n                            })\n                    else:\n                        # Thử quét mã nằm trong dòng (trường hợp có cột STT đứng trước mã hiệu)\n                        match = re.search(r\"\\b([A-Za-z]{2}[\\.\\s_-]?\\d{3,5})\\b\", line)\n                        if match:\n                            raw_code = match.group(1).strip()\n                            norm_code = normalize_work_code(raw_code)\n                            remainder = line[match.end():].strip()\n                            # Loại bỏ số trang cuối dòng nếu có\n                            remainder = re.sub(r\"\\s+\\d+\\s*$\", \"\", remainder).strip()\n                            remainder = re.sub(r\"[\\.\\s_–—]+$\", \"\", remainder).strip()\n                            remainder = re.sub(r\"^[-–—:.\\s]+\", \"\", remainder).strip()\n\n                            if len(remainder) >= 2 and norm_code not in seen_codes:\n                                seen_codes.add(norm_code)\n                                records.append({\n                                    \"code\": norm_code,\n                                    \"raw_code\": raw_code,\n                                    \"name\": remainder,\n                                    \"unit\": \"\"\n                                })\n        except Exception as e:\n            if not records:\n                raise RuntimeError(f\"Lỗi trích xuất PDF: {e}\")\n\n    return records\n\n# ================= 4. INSPECTION OF SHEET 'ĐGTH' =================\ndef inspect_dgth_sheet(file_bytes: bytes, repo_lookup: Dict[str, Dict[str, str]]) -> Dict[str, Any]:\n    \"\"\"\n    Quy tắc kiểm tra Sheet ĐGTH:\n    - Bắt buộc phải có sheet tên 'ĐGTH'.\n    - openpyxl data_only=True để lấy giá trị thực từ công thức.\n    - Dữ liệu chia thành nhiều bảng theo Hạng mục công trình (STT lặp lại từ 1 trên mỗi bảng có điền lại tiêu đề).\n    - Phân nhóm kết quả theo từng Hạng mục công trình.\n    - Báo lỗi rõ: Mã không tồn tại trong kho dữ liệu, hoặc Tên không khớp.\n    \"\"\"\n    wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=True)\n    \n    # Match sheet ĐGTH (case-insensitive or exact)\n    target_sheet = None\n    for name in wb.sheetnames:\n        if name.strip().upper() == \"ĐGTH\":\n            target_sheet = wb[name]\n            break\n\n    if target_sheet is None:\n        return {\n            \"success\": False,\n            \"error\": \"NOT_FOUND_DGTH\",\n            \"message\": \"Không tìm thấy sheet có tên 'ĐGTH' trong file Excel tải lên.\"\n        }\n\n    sections = []\n    current_section = {\n        \"title\": \"Hạng mục 1\",\n        \"items\": [],\n        \"total_count\": 0,\n        \"valid_count\": 0,\n        \"error_count\": 0\n    }\n    \n    col_stt_idx = None\n    col_code_idx = None\n    col_name_idx = None\n    col_unit_idx = None\n\n    last_section_title_candidate = \"\"\n    active_in_table = False\n    last_stt_val = 0\n\n    rows = list(target_sheet.iter_rows(values_only=True))\n    \n    for r_idx, row in enumerate(rows, start=1):\n        if not row:\n            continue\n        row_str = [clean_str(c) for c in row]\n        row_non_empty = [c for c in row_str if c]\n        if not row_non_empty:\n            continue\n\n        # Check if this row is a header row (STT, Mã CV, Tên công việc...)\n        c_stt = None\n        c_code = None\n        c_name = None\n        c_unit = None\n        \n        for c_idx, cell_text in enumerate(row_str):\n            if not cell_text:\n                continue\n            if c_stt is None and is_header_match(cell_text, STT_KEYWORDS):\n                c_stt = c_idx\n            elif c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                c_code = c_idx\n            elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                c_name = c_idx\n            elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                c_unit = c_idx\n\n        # If a header row is detected (having code and name, and optionally stt)\n        if c_code is not None and c_name is not None:\n            # We found a header row for a section!\n            col_stt_idx = c_stt\n            col_code_idx = c_code\n            col_name_idx = c_name\n            col_unit_idx = c_unit\n            \n            # If current section has items, commit it\n            if current_section[\"items\"]:\n                sections.append(current_section)\n                section_title = last_section_title_candidate or f\"Hạng mục {len(sections) + 1}\"\n                current_section = {\n                    \"title\": section_title,\n                    \"items\": [],\n                    \"total_count\": 0,\n                    \"valid_count\": 0,\n                    \"error_count\": 0\n                }\n            elif last_section_title_candidate:\n                current_section[\"title\"] = last_section_title_candidate\n                \n            active_in_table = True\n            last_stt_val = 0\n            last_section_title_candidate = \"\"\n            continue\n\n        # If we have active column indices, evaluate this row\n        if col_code_idx is not None and col_name_idx is not None and active_in_table:\n            stt_raw = clean_str(row[col_stt_idx]) if col_stt_idx is not None and len(row) > col_stt_idx else \"\"\n            raw_code = clean_str(row[col_code_idx]) if len(row) > col_code_idx else \"\"\n            name_raw = clean_str(row[col_name_idx]) if len(row) > col_name_idx else \"\"\n            unit_raw = clean_str(row[col_unit_idx]) if col_unit_idx is not None and len(row) > col_unit_idx else \"\"\n\n            # Check if this row is a Section / Hạng mục title before items start\n            # Usually: STT is empty or non-numeric, raw_code is empty, but name_raw or row has text like \"Hạng mục: ...\"\n            if not raw_code:\n                # Potential section divider\n                first_text = \" \".join(row_non_empty)\n                if any(k in first_text.lower() for k in [\"hạng mục\", \"phần\", \"gói thầu\", \"công trình\", \"bảng\"]):\n                    last_section_title_candidate = first_text\n                continue\n\n            # Detect STT reset (e.g. STT restarts from 1 when a new table begins without full header)\n            numeric_stt = None\n            try:\n                # Handle numeric STT like 1, 2 or '1.0'\n                numeric_stt = int(float(stt_raw)) if stt_raw else None\n            except Exception:\n                numeric_stt = None\n\n            if numeric_stt == 1 and last_stt_val > 1:\n                # STT reset to 1 -> new section!\n                if current_section[\"items\"]:\n                    sections.append(current_section)\n                    sec_name = last_section_title_candidate or f\"Hạng mục {len(sections) + 1}\"\n                    current_section = {\n                        \"title\": sec_name,\n                        \"items\": [],\n                        \"total_count\": 0,\n                        \"valid_count\": 0,\n                        \"error_count\": 0\n                    }\n                    last_section_title_candidate = \"\"\n\n            if numeric_stt is not None:\n                last_stt_val = numeric_stt\n\n            # Verify the work code against repository lookup\n            norm_code = normalize_work_code(raw_code)\n            \n            # Lookup check: check norm_code, raw_code, or case-insensitive\n            repo_match = (\n                repo_lookup.get(norm_code.upper())\n                or repo_lookup.get(raw_code.upper())\n            )\n\n            status = \"VALID\"\n            status_desc = \"Hợp lệ\"\n            repo_name = \"\"\n            \n            if not repo_match:\n                status = \"NOT_FOUND\"\n                status_desc = \"Không tồn tại trong kho dữ liệu\"\n            else:\n                repo_name = repo_match[\"name\"]\n                # Optional check: name resemblance\n                # If exact or normalized match\n                if name_raw and repo_name and name_raw.strip().lower() != repo_name.strip().lower():\n                    # Check if there is significant discrepancy\n                    # We can classify as valid code but note the repo name\n                    pass\n\n            item_result = {\n                \"stt\": stt_raw or str(len(current_section[\"items\"]) + 1),\n                \"row_index\": r_idx,\n                \"raw_code\": raw_code,\n                \"norm_code\": norm_code,\n                \"name_in_file\": name_raw,\n                \"unit\": unit_raw,\n                \"repo_name\": repo_name,\n                \"status\": status,\n                \"status_desc\": status_desc\n            }\n\n            current_section[\"items\"].append(item_result)\n            current_section[\"total_count\"] += 1\n            if status == \"VALID\":\n                current_section[\"valid_count\"] += 1\n            else:\n                current_section[\"error_count\"] += 1\n        else:\n            # Outside table or looking for section title\n            text_line = \" \".join(row_non_empty)\n            if any(k in text_line.lower() for k in [\"hạng mục\", \"phần\", \"gói thầu\", \"công trình\", \"bảng\"]):\n                last_section_title_candidate = text_line\n\n    if current_section[\"items\"]:\n        sections.append(current_section)\n\n    # Compute overall metrics\n    total_items = sum(s[\"total_count\"] for s in sections)\n    valid_items = sum(s[\"valid_count\"] for s in sections)\n    error_items = sum(s[\"error_count\"] for s in sections)\n\n    return {\n        \"success\": True,\n        \"sections\": sections,\n        \"total_items\": total_items,\n        \"valid_items\": valid_items,\n        \"error_items\": error_items,\n        \"section_count\": len(sections)\n    }\n", "styles.py": "# Custom styling and CSS for COREBOX Web Application\n\ndef get_custom_css() -> str:\n    return -box\">\n            \u003cdiv class=\"pending-notice-icon\">⏳\u003c/div>\n            \u003cdiv class=\"pending-notice-title\">{t('pending_title', lang)}\u003c/div>\n            \u003cdiv class=\"pending-notice-text\">\n                {t('pending_message', lang, email=f\"\u003cb>{email}\u003c/b>\")}\n            \u003c/div>\n            \u003cdiv style=\"margin-top:1.2rem; color:#94a3b8; font-size:0.9rem;\">\n                💡 {t('pending_tip', lang)}\n            \u003c/div>\n        \u003c/div>\n        \"\"\",\n        unsafe_allow_html=True\n    )\n\n    col_left, col_btn1, col_btn2, col_right = st.columns([1.2, 1.3, 1.3, 1.2])\n    with col_btn1:\n        if st.button(f\"🔄 {t('btn_reload_page', lang)}\", key=\"btn_reload_pending\", use_container_width=True):\n            st.rerun()\n    with col_btn2:\n        if st.button(f\"🚪 {t('nav_logout', lang)}\", key=\"btn_logout_pending\", use_container_width=True):\n            logout_user()\n            st.rerun()\n", "views/users.py": "import streamlit as st\nimport streamlit.components.v1 as components\nimport config\nfrom i18n import t, format_datetime_by_lang\nfrom database import db\nfrom auth import is_admin, get_current_user_email\n\ndef render_users_view(lang: str):\n    \"\"\"\n    Renders User Management page:\n    - Exclusively accessible to Admin happyclone96@gmail.com\n    - Displays Pending Approval Queue with [Phê duyệt] and [Từ chối] buttons\n    - Lists active accounts with status and roles\n    \"\"\"\n    if not is_admin():\n        st.error(t(\"access_denied\", lang))\n        st.info(t(\"admin_access_hint\", lang))\n        return\n\n    # Check for pending JS sync from previous action\n    if \"user_sync_js\" in st.session_state and st.session_state[\"user_sync_js\"]:\n        js_code = st.session_state.pop(\"user_sync_js\")\n        components.html(f\"\u003cscript>{js_code}\u003c/script>\", height=0, width=0)\n\n    st.markdown(f\"## 👥 {t('user_mgmt_title', lang)}\")\n    st.caption(t('user_mgmt_desc', lang))\n    st.divider()\n\n    # 1. PENDING APPROVAL QUEUE\n    pending_users = db.get_all_users(status=\"pending\")\n    st.markdown(f\"### ⏳ {t('pending_users_section', lang, count=len(pending_users))}\")\n\n    if not pending_users:\n        st.info(f\"✨ {t('msg_no_pending', lang)}\")\n    else:\n        for idx, u in enumerate(pending_users):\n            u_email = u[\"email\"]\n            u_name = u[\"full_name\"] or u_email.split(\"@\")[0]\n            u_time = u.get(\"created_at\", \"\")\n            formatted_u_time = format_datetime_by_lang(u_time, lang)\n\n            with st.container(border=True):\n                col_info, col_btn1, col_btn2 = st.columns([6, 2, 2], vertical_alignment=\"center\")\n                with col_info:\n                    st.markdown(f\"**👤 {u_name}** (`{u_email}`)\")\n                    st.caption(f\"📅 {t('th_registered_at', lang)}: {formatted_u_time}\")\n                with col_btn1:\n                    if st.button(f\"✅ {t('btn_approve', lang)}\", key=f\"btn_app_{idx}_{u_email}\", use_container_width=True, type=\"primary\"):\n                        db.update_user_status(u_email, \"active\")\n                        st.session_state[\"user_sync_js\"] = f\"\"\"\n                        if (window.parent && window.parent.coreboxUpdateUserStatus) {{\n                            window.parent.coreboxUpdateUserStatus('{u_email}', 'active');\n                        }}\n                        \"\"\"\n                        st.success(t(\"msg_approved_success\", lang, email=u_email))\n                        st.rerun()\n                with col_btn2:\n                    if st.button(f\"❌ {t('btn_reject', lang)}\", key=f\"btn_rej_{idx}_{u_email}\", use_container_width=True):\n                        db.update_user_status(u_email, \"rejected\")\n                        st.session_state[\"user_sync_js\"] = f\"\"\"\n                        if (window.parent && window.parent.coreboxUpdateUserStatus) {{\n                            window.parent.coreboxUpdateUserStatus('{u_email}', 'rejected');\n                        }}\n                        \"\"\"\n                        st.warning(t(\"msg_rejected_success\", lang, email=u_email))\n                        st.rerun()\n\n    st.markdown(\"\u003cbr>\", unsafe_allow_html=True)\n\n    # 2. ACTIVE USERS LIST\n    active_users = db.get_all_users(status=\"active\")\n    st.markdown(f\"### 🟢 {t('approved_users_section', lang, count=len(active_users))}\")\n\n    if active_users:\n        for idx, u in enumerate(active_users):\n            u_email = u[\"email\"]\n            u_name = u[\"full_name\"] or u_email.split(\"@\")[0]\n            u_role = u.get(\"role\", \"user\")\n            is_root_admin = (u_email == config.ADMIN_EMAIL)\n\n            with st.container(border=True):\n                if not is_root_admin:\n                    col_info, col_btn1, col_btn2 = st.columns([6, 2, 2], vertical_alignment=\"center\")\n                    with col_info:\n                        badge_str = t(\"badge_admin\", lang) if u_role == \"admin\" else t(\"badge_user\", lang)\n                        st.markdown(f\"**{u_name}** (`{u_email}`) — *{badge_str}*\")\n                        formatted_updated = format_datetime_by_lang(u.get('updated_at', u.get('created_at', '')), lang)\n                        st.caption(f\"{t('last_updated_prefix', lang)}: {formatted_updated}\")\n                    with col_btn1:\n                        if st.button(t(\"btn_suspend\", lang), key=f\"btn_lock_{idx}_{u_email}\", use_container_width=True):\n                            db.update_user_status(u_email, \"pending\")\n                            st.session_state[\"user_sync_js\"] = f\"\"\"\n                            if (window.parent && window.parent.coreboxUpdateUserStatus) {{\n                                window.parent.coreboxUpdateUserStatus('{u_email}', 'pending');\n                            }}\n                            \"\"\"\n                            st.rerun()\n                    with col_btn2:\n                        if st.button(t(\"btn_delete\", lang), key=f\"btn_del_{idx}_{u_email}\", use_container_width=True):\n                            db.delete_user(u_email)\n                            st.session_state[\"user_sync_js\"] = f\"\"\"\n                            if (window.parent && window.parent.coreboxDeleteUser) {{\n                                window.parent.coreboxDeleteUser('{u_email}');\n                            }}\n                            \"\"\"\n                            st.rerun()\n                else:\n                    col_info, col_lock = st.columns([8, 2], vertical_alignment=\"center\")\n                    with col_info:\n                        badge_str = t(\"badge_root_admin\", lang)\n                        st.markdown(f\"**{u_name}** — *{badge_str}*\")\n                        formatted_updated = format_datetime_by_lang(u.get('updated_at', u.get('created_at', '')), lang)\n                        st.caption(f\"{t('last_updated_prefix', lang)}: {formatted_updated}\")\n                    with col_lock:\n                        st.markdown(\n                            f'\u003cspan style=\"display:inline-flex; align-items:center; gap:4px; padding:0.25rem 0.65rem; border-radius:6px; background:rgba(56,189,248,0.12); color:#38bdf8; font-size:0.8rem; font-weight:600; border:1px solid rgba(56,189,248,0.25); white-space:nowrap;\">🔒 {t(\"badge_protected\", lang)}\u003c/span>',\n                            unsafe_allow_html=True\n                        )\n\n    st.markdown(\"\u003cbr>\", unsafe_allow_html=True)\n\n    # 3. REJECTED USERS (if any)\n    rejected_users = db.get_all_users(status=\"rejected\")\n    if rejected_users:\n        with st.expander(t(\"rejected_users_section\", lang, count=len(rejected_users))):\n            for idx, u in enumerate(rejected_users):\n                u_email = u[\"email\"]\n                col_a, col_b = st.columns([7, 3])\n                with col_a:\n                    st.write(f\"• `{u_email}` ({u.get('full_name', '')})\")\n                with col_b:\n                    if st.button(t(\"btn_restore\", lang), key=f\"btn_restore_{idx}_{u_email}\"):\n                        db.update_user_status(u_email, \"active\")\n                        st.session_state[\"user_sync_js\"] = f\"\"\"\n                        if (window.parent && window.parent.coreboxUpdateUserStatus) {{\n                            window.parent.coreboxUpdateUserStatus('{u_email}', 'active');\n                        }}\n                        \"\"\"\n                        st.rerun()\n\n", "views/repository.py": "import io\nimport re\nimport json\nimport streamlit as st\nimport streamlit.components.v1 as components\nimport pandas as pd\nimport config\nfrom i18n import t, format_datetime_by_lang\nfrom database import db\nfrom auth import is_admin, get_current_user_email\nfrom parsers import extract_from_excel, extract_from_docx, extract_from_pdf, extract_first_unit\n\n@st.cache_data(show_spinner=False)\ndef generate_repo_excel_export(search_query: str | None, filter_source: str | None, lang: str) -> bytes:\n    output = io.BytesIO()\n    with pd.ExcelWriter(output, engine='xlsxwriter') as writer:\n        raw_rows = db.get_work_codes(search=search_query or None, source_file=filter_source, limit=10000, offset=0)\n        df_all = pd.DataFrame(raw_rows)\n        if not df_all.empty:\n            for idx_row in range(len(df_all)):\n                df_all.at[idx_row, \"unit\"] = extract_first_unit(df_all.at[idx_row, \"unit\"])\n            df_all = df_all[[\"code\", \"raw_code\", \"name\", \"unit\", \"source_file\"]]\n            df_all.columns = [\n                t(\"col_norm_code\", lang),\n                t(\"col_raw_code\", lang),\n                t(\"col_work_name\", lang),\n                t(\"col_unit\", lang),\n                t(\"col_source_file\", lang)\n            ]\n            df_all.to_excel(writer, sheet_name='Kho_Du_Lieu', index=False)\n    return output.getvalue()\n\ndef render_repository_view(lang: str):\n    \"\"\"\n    Renders Kho Dữ Liệu (Data Repository) view:\n    - 3 Collapsible Major Sections (Thu nhỏ vào khay):\n      1. Cập nhật tệp danh mục (Upload & Smart Extraction from .docx, .xlsx, .pdf)\n      2. Quản lý các tệp danh mục đã tải lên (Managed Files with delete & stats)\n      3. Danh mục tổng hợp toàn bộ Kho Dữ Liệu (Master Viewer with search, pagination, export)\n    - Full persistence via Cloudflare KV & localStorage\n    \"\"\"\n    user_is_admin = is_admin()\n    user_email = get_current_user_email() or \"guest\"\n\n    # Execute any pending catalog sync script\n    if \"repo_sync_js\" in st.session_state and st.session_state[\"repo_sync_js\"]:\n        js_code = st.session_state.pop(\"repo_sync_js\")\n        components.html(f\"\u003cscript>{js_code}\u003c/script>\", height=0, width=0)\n\n    st.markdown(f\"## 📁 {t('repo_title', lang)}\")\n    st.caption(t('repo_desc', lang))\n    st.divider()\n\n    # Admin notice if regular user\n    if not user_is_admin:\n        st.info(f\"ℹ️ {t('repo_admin_only_notice', lang)}\")\n\n    # 1. MAJOR SECTION: CẬP NHẬT KHO DỮ LIỆU (Upload & Extract)\n    with st.expander(f\"📤 **{t('repo_update_section', lang)}**\", expanded=True):\n        if user_is_admin:\n            st.markdown(f\"*{t('repo_upload_hint', lang)}*\")\n            st.markdown(\n                f\"\"\"\n                \u003cdiv style=\"background:rgba(30,58,138,0.2); padding:0.75rem 1rem; border-radius:8px; border-left:4px solid #38bdf8; margin-bottom:1rem; font-size:0.9rem;\">\n                    💡 \u003cb>{t('repo_normalize_rule', lang)}\u003c/b>\n                \u003c/div>\n                \"\"\",\n                unsafe_allow_html=True\n            )\n\n            uploaded_file = st.file_uploader(\n                t(\"upload_catalog_label\", lang),\n                type=[\"xlsx\", \"docx\", \"pdf\"],\n                key=\"repo_file_uploader\"\n            )\n\n            if uploaded_file is not None:\n                filename = uploaded_file.name\n                ext = filename.rsplit(\".\", 1)[-1].lower()\n\n                col_u1, col_u2 = st.columns([3, 1], vertical_alignment=\"center\")\n                with col_u1:\n                    st.write(f\"📄 **{t('selected_file', lang)}:** `{filename}` ({uploaded_file.size / 1024:.1f} KB)\")\n                with col_u2:\n                    process_btn = st.button(f\"⚡ {t('btn_process_file', lang)}\", type=\"primary\", use_container_width=True)\n\n                if process_btn:\n                    with st.spinner(t(\"extracting_spinner\", lang)):\n                        file_bytes = uploaded_file.getvalue()\n                        records = []\n                        try:\n                            if ext == \"xlsx\":\n                                records = extract_from_excel(file_bytes, filename)\n                            elif ext == \"docx\":\n                                records = extract_from_docx(file_bytes, filename)\n                            elif ext == \"pdf\":\n                                records = extract_from_pdf(file_bytes, filename)\n                        except Exception as e:\n                            st.error(f\"Lỗi trích xuất: {e}\")\n                            return\n\n                        if not records:\n                            st.warning(t(\"msg_no_table_found\", lang))\n                        else:\n                            inserted_count = db.add_work_codes(records, filename, user_email)\n                            cat_json = db.export_catalog_json()\n                            st.session_state[\"repo_sync_js\"] = f\"\"\"\n                            if (window.parent && window.parent.coreboxSaveCatalog) {{\n                                window.parent.coreboxSaveCatalog({json.dumps(cat_json)});\n                            }}\n                            \"\"\"\n                            st.success(t(\"msg_upload_success\", lang, count=inserted_count, filename=filename))\n                            st.rerun()\n        else:\n            st.caption(f\"🔒 {t('repo_admin_only_notice', lang)}\")\n\n    st.markdown(\"\u003cdiv style='margin-top: 0.6rem;'>\u003c/div>\", unsafe_allow_html=True)\n\n    # 2. MAJOR SECTION: QUẢN LÝ KHO DỮ LIỆU\n    files = db.get_uploaded_files()\n    with st.expander(f\"📑 **{t('repo_files_section_collapsible', lang)}**\", expanded=True):\n        if not files:\n            st.info(t(\"msg_no_files\", lang))\n        else:\n            for f in files:\n                fname = f[\"filename\"]\n                fcount = f.get(\"total_records\", 0)\n                fuser = f.get(\"uploaded_by\", \"\")\n                ftime_formatted = format_datetime_by_lang(f.get(\"uploaded_at\", \"\"), lang)\n\n                with st.container(border=True):\n                    col_f1, col_f2 = st.columns([7, 3], vertical_alignment=\"center\")\n                    with col_f1:\n                        st.markdown(f\"📄 **{fname}** — `{fcount:,} mã CV`\")\n                        st.caption(f\"{t('uploaded_by_prefix', lang)}: `{fuser}` | {t('uploaded_at_prefix', lang)}: {ftime_formatted}\")\n                    with col_f2:\n                        if user_is_admin:\n                            if st.button(f\"🗑️ {t('btn_delete_file', lang)}\", key=f\"del_file_{fname}\", use_container_width=True):\n                                db.delete_uploaded_file(fname)\n                                cat_json = db.export_catalog_json()\n                                st.session_state[\"repo_sync_js\"] = f\"\"\"\n                                if (window.parent && window.parent.coreboxSaveCatalog) {{\n                                    window.parent.coreboxSaveCatalog({json.dumps(cat_json)});\n                                }}\n                                \"\"\"\n                                st.warning(t(\"msg_delete_file_success\", lang, filename=fname))\n                                st.rerun()\n                        else:\n                            st.caption(f\"🔒 {t('view_only_perm', lang)}\")\n\n    st.markdown(\"\u003cdiv style='margin-top: 0.6rem;'>\u003c/div>\", unsafe_allow_html=True)\n\n    # 3. MAJOR SECTION: DANH MỤC TỔNG HỢP KHO DỮ LIỆU\n    with st.expander(f\"📚 **{t('master_view_section_collapsible', lang)}**\", expanded=True):\n        total_records = db.count_work_codes()\n        if total_records == 0:\n            st.info(t(\"msg_repo_empty_browse\", lang))\n        else:\n            # Filter & Search row\n            col_s1, col_s2 = st.columns([2, 3])\n            with col_s1:\n                file_options = [t(\"all_option\", lang)] + [f[\"filename\"] for f in files]\n                selected_file_filter = st.selectbox(t(\"filter_by_file\", lang), options=file_options, key=\"repo_file_filter\")\n            with col_s2:\n                search_query = st.text_input(\n                    t(\"search_label\", lang),\n                    placeholder=t(\"search_code_or_name\", lang),\n                    key=\"repo_search_input\"\n                )\n\n            filter_source = None if selected_file_filter == t(\"all_option\", lang) else selected_file_filter\n            matching_count = db.count_work_codes(search=search_query or None, source_file=filter_source)\n            st.caption(t(\"total_records\", lang, count=f\"{matching_count:,}\"))\n\n            # Pagination\n            page_size = 50\n            total_pages = max(1, (matching_count + page_size - 1) // page_size)\n            page_col1, page_col2 = st.columns([2, 8], vertical_alignment=\"center\")\n            with page_col1:\n                current_page_num = st.number_input(t(\"page_label\", lang), min_value=1, max_value=total_pages, value=1, step=1, key=\"repo_page_num\")\n            with page_col2:\n                st.caption(t(\"showing_page_info\", lang, current=current_page_num, total=total_pages))\n\n            offset = (current_page_num - 1) * page_size\n            records = db.get_work_codes(search=search_query or None, source_file=filter_source, limit=page_size, offset=offset)\n\n            if records:\n                for r in records:\n                    r[\"unit\"] = extract_first_unit(r.get(\"unit\", \"\"))\n                df = pd.DataFrame(records)[[\"code\", \"raw_code\", \"name\", \"unit\", \"source_file\"]]\n                df.columns = [\n                    t(\"col_norm_code\", lang),\n                    t(\"col_raw_code\", lang),\n                    t(\"col_work_name\", lang),\n                    t(\"col_unit\", lang),\n                    t(\"col_source_file\", lang)\n                ]\n                st.dataframe(df, use_container_width=True, hide_index=True)\n                # Export button (cached to prevent blocking WebAssembly event loop on page navigation)\n                excel_bytes = generate_repo_excel_export(search_query or None, filter_source, lang)\n                st.markdown('\u003cdiv style=\"margin-top: 1rem; margin-bottom: 0.5cm;\">', unsafe_allow_html=True)\n                st.download_button(\n                    label=f\"📥 {t('btn_export_repo', lang)}\",\n                    data=excel_bytes,\n                    file_name=\"corebox_kho_du_lieu.xlsx\",\n                    mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                    key=\"dl_btn_repo_xlsx\"\n                )\n                st.markdown('\u003c/div>', unsafe_allow_html=True)\n\n", "views/inspection.py": "import io\nimport streamlit as st\nimport pandas as pd\nfrom i18n import t\nfrom database import db\nfrom parsers import inspect_dgth_sheet\n\ndef render_inspection_view(lang: str):\n    \"\"\"\n    Renders Kiểm tra mã công việc (Work Code Inspection) view:\n    - In-memory session processing, zero permanent server storage\n    - Strict ĐGTH sheet check with openpyxl data_only=True\n    - Grouping by 'Hạng
