\n\u003cinput type=\"text\" class=\"search-input-field\" placeholder=\"{t('nav_search_placeholder', lang)}\">\n\u003cdiv class=\"search-dropdown-results\">\n{search_links_html}\n\u003c/div>\n\u003c/div>\n\u003c!-- Language Switcher Dropdown (Pure text Vietnamese / English, no icons) -->\n\u003cdiv class=\"nav-dropdown-item\">\n\u003cspan class=\"nav-dropdown-label\">{current_lang_display} \u003cspan class=\"nav-arrow\">⌵\u003c/span>\u003c/span>\n\u003cdiv class=\"nav-dropdown-menu\" style=\"min-width: 140px;\">\n\u003ca href=\"?page={current_page}&lang=vi{u_param}\" onclick=\"return window.coreboxLang('vi', event)\" target=\"_self\" class=\"nav-sub-link\">Vietnamese\u003c/a>\n\u003ca href=\"?page={current_page}&lang=en{u_param}\" onclick=\"return window.coreboxLang('en', event)\" target=\"_self\" class=\"nav-sub-link\">English\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c!-- User / Guest Pill & Avatar -->\n{user_menu_html}\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cscript>\n(function() {{\n  function findBtn(name) {{\n    let keyElem = document.querySelector('.st-key-btn_' + name);\n    if (keyElem) {{\n      let b = keyElem.querySelector('button');\n      if (b) return b;\n    }}\n    let allBtns = document.querySelectorAll('button');\n    for (let b of allBtns) {{\n      if (b.innerText && b.innerText.trim() === name) return b;\n    }}\n    return null;\n  }}\n\n  window.coreboxNav = function(page, lang, e) {{\n    if (e && e.preventDefault) e.preventDefault();\n    let url = new URL(window.location.href);\n    if (page) url.searchParams.set(\"page\", page);\n    if (lang) url.searchParams.set(\"lang\", lang);\n    window.history.pushState({{}}, \"\", url.toString());\n\n    let btn = findBtn('nav_' + page);\n    if (btn) {{\n      btn.click();\n      return false;\n    }}\n    window.location.href = url.toString();\n    return false;\n  }};\n\n  window.coreboxLang = function(newLang, e) {{\n    if (e && e.preventDefault) e.preventDefault();\n    let url = new URL(window.location.href);\n    url.searchParams.set(\"lang\", newLang);\n    window.history.pushState({{}}, \"\", url.toString());\n\n    let btn = findBtn('lang_' + newLang);\n    if (btn) {{\n      btn.click();\n      return false;\n    }}\n    window.location.href = url.toString();\n    return false;\n  }};\n\n  window.coreboxAction = function(action, e) {{\n    if (e && e.preventDefault) e.preventDefault();\n    let url = new URL(window.location.href);\n    url.searchParams.set(\"action\", action);\n    if (action === \"logout\") {{\n      url.searchParams.delete(\"u\");\n    }}\n    window.history.pushState({{}}, \"\", url.toString());\n\n    let btn = findBtn('act_' + action);\n    if (btn) {{\n      btn.click();\n      return false;\n    }}\n    window.location.href = url.toString();\n    return false;\n  }};\n}})();\n\u003c/script>\"\"\"\n\n    if hasattr(st, \"html\"):\n        st.html(navbar_html)\n    else:\n        st.markdown(textwrap.dedent(navbar_html).strip(), unsafe_allow_html=True)\n", "views/home.py": "import textwrap\nimport streamlit as st\nimport config\nfrom i18n import t\nfrom auth import is_admin, is_pending\nfrom views.pending import render_pending_view\n\ndef safe_html(html_str: str):\n    \"\"\"Renders HTML safely using st.html or unindented markdown.\"\"\"\n    clean_html = textwrap.dedent(html_str).strip()\n    if hasattr(st, \"html\"):\n        st.html(clean_html)\n    else:\n        st.markdown(clean_html, unsafe_allow_html=True)\n\ndef render_home_view(lang: str):\n    \"\"\"\n    Renders Main Dashboard screen:\n    - Corebox (In đậm, font chữ nổi bật, kích thước to)\n    - Đơn giản hóa hành trình chuyển đổi số của bạn (Simplify your digital transformation journey)\n    - Lưu trữ dữ liệu, kiểm tra tự động và các công cụ hỗ trợ.\n    - Toàn bộ các ô truy cập nhanh đã được xóa bỏ theo yêu cầu.\n    - Nếu tài khoản đang chờ phê duyệt, hiển thị thông báo chờ phê duyệt ngay tại đây.\n    - Footer cách mép dưới 1cm.\n    \"\"\"\n    if is_pending():\n        render_pending_view(lang)\n    else:\n        # Hero Box Layout\n        safe_html(f\"\"\"\u003cdiv class=\"hero-box\">\n\u003cdiv class=\"hero-brand-name\">Corebox\u003c/div>\n\u003cdiv class=\"hero-subheadline\">{t('app_subtitle', lang)}\u003c/div>\n\u003cdiv class=\"hero-small-desc\">{t('app_description', lang)}\u003c/div>\n\u003c/div>\"\"\")\n\n    # Footer (Cách mép dưới màn hình 1cm)\n    safe_html(f\"\"\"\u003cdiv class=\"corebox-footer\">\n{t('app_footer', lang)} • Cloudflare & Python Architecture • Version 2.0\n\u003c/div>\"\"\")\n", "views/pending.py": "import streamlit as st\nimport config\nfrom i18n import t\nfrom auth import get_current_user_email, logout_user\n\ndef render_pending_view(lang: str):\n    \"\"\"\n    Renders polite pending approval screen for new Google users:\n    'Tài khoản của bạn đã đăng nhập thành công nhưng đang chờ Admin (happyclone96@gmail.com) phê duyệt. Vui lòng liên hệ quản trị viên.'\n    \"\"\"\n    email = get_current_user_email() or \"user@gmail.com\"\n\n    st.markdown(\n        f\"\"\"\n        \u003cdiv class=\"pending-notice-box\">\n            \u003cdiv class=\"pending-notice-icon\">⏳\u003c/div>\n            \u003cdiv class=\"pending-notice-title\">{t('pending_title', lang)}\u003c/div>\n            \u003cdiv class=\"pending-notice-text\">\n                {t('pending_message', lang, email=f\"\u003cb>{email}\u003c/b>\", admin_email=f\"\u003cb>{config.ADMIN_EMAIL}\u003c/b>\")}\n            \u003c/div>\n            \u003cdiv style=\"margin-top:1.2rem; color:#94a3b8; font-size:0.9rem;\">\n                💡 {t('pending_tip', lang)}\n            \u003c/div>\n        \u003c/div>\n        \"\"\",\n        unsafe_allow_html=True\n    )\n\n    col1, col2, col3 = st.columns([1.5, 2, 1.5])\n    with col2:\n        subc1, subc2 = st.columns(2)\n        with subc1:\n            if st.button(\"🔄 Tải lại trang\", key=\"btn_reload_pending\", use_container_width=True):\n                st.rerun()\n        with subc2:\n            if st.button(f\"🚪 {t('nav_logout', lang)}\", key=\"btn_logout_pending\", use_container_width=True):\n                logout_user()\n                st.rerun()\n", "views/users.py": "import streamlit as st\nimport config\nfrom i18n import t, format_datetime_by_lang\nfrom database import db\nfrom auth import is_admin, get_current_user_email\n\ndef render_users_view(lang: str):\n    \"\"\"\n    Renders User Management page:\n    - Exclusively accessible to Admin happyclone96@gmail.com\n    - Displays Pending Approval Queue with [Phê duyệt] and [Từ chối] buttons\n    - Lists active accounts with status and roles\n    \"\"\"\n    if not is_admin():\n        st.error(t(\"access_denied\", lang, admin_email=config.ADMIN_EMAIL))\n        st.info(t(\"admin_access_hint\", lang))\n        return\n\n    st.markdown(f\"## 👥 {t('user_mgmt_title', lang)}\")\n    st.caption(t('user_mgmt_desc', lang))\n    st.divider()\n\n    # 1. PENDING APPROVAL QUEUE\n    pending_users = db.get_all_users(status=\"pending\")\n    st.markdown(f\"### ⏳ {t('pending_users_section', lang, count=len(pending_users))}\")\n\n    if not pending_users:\n        st.info(f\"✨ {t('msg_no_pending', lang)}\")\n    else:\n        for idx, u in enumerate(pending_users):\n            u_email = u[\"email\"]\n            u_name = u[\"full_name\"] or u_email.split(\"@\")[0]\n            u_time = u.get(\"created_at\", \"\")\n            formatted_u_time = format_datetime_by_lang(u_time, lang)\n\n            with st.container(border=True):\n                col_info, col_btn1, col_btn2 = st.columns([6, 2, 2], vertical_alignment=\"center\")\n                with col_info:\n                    st.markdown(f\"**👤 {u_name}** (`{u_email}`)\")\n                    st.caption(f\"📅 {t('th_registered_at', lang)}: {formatted_u_time}\")\n                with col_btn1:\n                    if st.button(f\"✅ {t('btn_approve', lang)}\", key=f\"btn_app_{idx}_{u_email}\", use_container_width=True, type=\"primary\"):\n                        db.update_user_status(u_email, \"active\")\n                        st.success(t(\"msg_approved_success\", lang, email=u_email))\n                        st.rerun()\n                with col_btn2:\n                    if st.button(f\"❌ {t('btn_reject', lang)}\", key=f\"btn_rej_{idx}_{u_email}\", use_container_width=True):\n                        db.update_user_status(u_email, \"rejected\")\n                        st.warning(t(\"msg_rejected_success\", lang, email=u_email))\n                        st.rerun()\n\n    st.markdown(\"\u003cbr>\", unsafe_allow_html=True)\n\n    # 2. ACTIVE USERS LIST\n    active_users = db.get_all_users(status=\"active\")\n    st.markdown(f\"### 🟢 {t('approved_users_section', lang, count=len(active_users))}\")\n\n    if active_users:\n        for idx, u in enumerate(active_users):\n            u_email = u[\"email\"]\n            u_name = u[\"full_name\"] or u_email.split(\"@\")[0]\n            u_role = u.get(\"role\", \"user\")\n            is_root_admin = (u_email == config.ADMIN_EMAIL)\n\n            with st.container(border=True):\n                col_info, col_actions = st.columns([7, 3], vertical_alignment=\"center\")\n                with col_info:\n                    badge_str = t(\"badge_root_admin\", lang) if is_root_admin else (t(\"badge_admin\", lang) if u_role == \"admin\" else t(\"badge_user\", lang))\n                    st.markdown(f\"**{u_name}** (`{u_email}`) — *{badge_str}*\")\n                    formatted_updated = format_datetime_by_lang(u.get('updated_at', u.get('created_at', '')), lang)\n                    st.caption(f\"{t('last_updated_prefix', lang)}: {formatted_updated}\")\n                with col_actions:\n                    if not is_root_admin:\n                        btn_c1, btn_c2 = st.columns(2)\n                        with btn_c1:\n                            if st.button(t(\"btn_suspend\", lang), key=f\"btn_lock_{idx}_{u_email}\", use_container_width=True):\n                                db.update_user_status(u_email, \"pending\")\n                                st.rerun()\n                        with btn_c2:\n                            if st.button(t(\"btn_delete\", lang), key=f\"btn_del_{idx}_{u_email}\", use_container_width=True):\n                                db.delete_user(u_email)\n                                st.rerun()\n                    else:\n                        st.markdown(\n                            f'\u003cspan style=\"display:inline-flex; align-items:center; gap:4px; padding:0.25rem 0.65rem; border-radius:6px; background:rgba(56,189,248,0.12); color:#38bdf8; font-size:0.8rem; font-weight:600; border:1px solid rgba(56,189,248,0.25); white-space:nowrap;\">🔒 {t(\"badge_protected\", lang)}\u003c/span>',\n                            unsafe_allow_html=True\n                        )\n\n    st.markdown(\"\u003cbr>\", unsafe_allow_html=True)\n\n    # 3. REJECTED USERS (if any)\n    rejected_users = db.get_all_users(status=\"rejected\")\n    if rejected_users:\n        with st.expander(t(\"rejected_users_section\", lang, count=len(rejected_users))):\n            for idx, u in enumerate(rejected_users):\n                u_email = u[\"email\"]\n                col_a, col_b = st.columns([7, 3])\n                with col_a:\n                    st.write(f\"• `{u_email}` ({u.get('full_name', '')})\")\n                with col_b:\n                    if st.button(t(\"btn_restore\", lang), key=f\"btn_restore_{idx}_{u_email}\"):\n                        db.update_user_status(u_email, \"active\")\n                        st.rerun()\n", "views/repository.py": "import io\nimport re\nimport streamlit as st\nimport pandas as pd\nimport config\nfrom i18n import t, format_datetime_by_lang\nfrom database import db\nfrom auth import is_admin, get_current_user_email\nfrom parsers import extract_from_excel, extract_from_docx, extract_from_pdf, extract_first_unit\n\ndef render_repository_view(lang: str):\n    \"\"\"\n    Renders Kho Dữ Liệu (Data Repository) view:\n    - Smart Extraction from .docx, .xlsx, .pdf\n    - Work code normalization XX.YYYYY\n    - File management with source_file tag (Admin only for upload / delete)\n    - Master Repository Viewer with full bilingual support\n    \"\"\"\n    user_is_admin = is_admin()\n    user_email = get_current_user_email() or \"guest\"\n\n    st.markdown(f\"## 📁 {t('repo_title', lang)}\")\n    st.caption(t('repo_desc', lang))\n    st.divider()\n\n    # Admin notice if regular user\n    if not user_is_admin:\n        st.info(f\"ℹ️ {t('repo_admin_only_notice', lang, admin_email=config.ADMIN_EMAIL)}\")\n\n    # 1. FILE UPLOAD & EXTRACTION SECTION (Admin Only)\n    if user_is_admin:\n        with st.expander(f\"📤 {t('repo_upload_section', lang)}\", expanded=True):\n            st.markdown(f\"*{t('repo_upload_hint', lang)}*\")\n            st.markdown(\n                f\"\"\"\n                \u003cdiv style=\"background:rgba(30,58,138,0.2); padding:0.75rem 1rem; border-radius:8px; border-left:4px solid #38bdf8; margin-bottom:1rem; font-size:0.9rem;\">\n                    💡 \u003cb>{t('repo_normalize_rule', lang)}\u003c/b>\n                \u003c/div>\n                \"\"\",\n                unsafe_allow_html=True\n            )\n\n            uploaded_file = st.file_uploader(\n                t(\"upload_catalog_label\", lang),\n                type=[\"xlsx\", \"docx\", \"pdf\"],\n                key=\"repo_file_uploader\"\n            )\n\n            if uploaded_file is not None:\n                filename = uploaded_file.name\n                ext = filename.rsplit(\".\", 1)[-1].lower()\n\n                col_u1, col_u2 = st.columns([3, 1], vertical_alignment=\"center\")\n                with col_u1:\n                    st.write(f\"📄 **{t('selected_file', lang)}:** `{filename}` ({uploaded_file.size / 1024:.1f} KB)\")\n                with col_u2:\n                    process_btn = st.button(f\"⚡ {t('btn_process_file', lang)}\", type=\"primary\", use_container_width=True)\n\n                if process_btn:\n                    with st.spinner(t(\"extracting_spinner\", lang)):\n                        file_bytes = uploaded_file.getvalue()\n                        records = []\n                        try:\n                            if ext == \"xlsx\":\n                                records = extract_from_excel(file_bytes, filename)\n                            elif ext == \"docx\":\n                                records = extract_from_docx(file_bytes, filename)\n                            elif ext == \"pdf\":\n                                records = extract_from_pdf(file_bytes, filename)\n                        except Exception as e:\n                            st.error(f\"Lỗi: {e}\")\n                            return\n\n                        if not records:\n                            st.warning(t(\"msg_no_table_found\", lang))\n                        else:\n                            inserted_count = db.add_work_codes(records, filename, user_email)\n                            st.success(t(\"msg_upload_success\", lang, count=inserted_count, filename=filename))\n                            st.rerun()\n\n    # 2. MANAGED FILES LIST\n    st.markdown(f\"### 📑 {t('repo_files_section', lang)}\")\n    files = db.get_uploaded_files()\n\n    if not files:\n        st.info(t(\"msg_no_files\", lang))\n    else:\n        for f in files:\n            fname = f[\"filename\"]\n            fcount = f.get(\"total_records\", 0)\n            fuser = f.get(\"uploaded_by\", \"\")\n            ftime_formatted = format_datetime_by_lang(f.get(\"uploaded_at\", \"\"), lang)\n\n            with st.container(border=True):\n                col_f1, col_f2 = st.columns([7, 3], vertical_alignment=\"center\")\n                with col_f1:\n                    st.markdown(f\"📄 **{fname}** — `{fcount:,} mã CV`\")\n                    st.caption(f\"{t('uploaded_by_prefix', lang)}: `{fuser}` | {t('uploaded_at_prefix', lang)}: {ftime_formatted}\")\n                with col_f2:\n                    if user_is_admin:\n                        if st.button(f\"🗑️ {t('btn_delete_file', lang)}\", key=f\"del_file_{fname}\", use_container_width=True):\n                            db.delete_uploaded_file(fname)\n                            st.warning(t(\"msg_delete_file_success\", lang, filename=fname))\n                            st.rerun()\n                    else:\n                        st.caption(f\"🔒 {t('view_only_perm', lang)}\")\n\n    st.markdown(\"\u003cbr>\", unsafe_allow_html=True)\n\n    # 3. MASTER REPOSITORY VIEWER (\"Xem danh mục tổng hợp\")\n    st.divider()\n    st.markdown(f\"### 📚 {t('master_view_title', lang)}\")\n\n    total_records = db.count_work_codes()\n    if total_records == 0:\n        st.info(t(\"msg_repo_empty_browse\", lang))\n        return\n\n    # Filter & Search row\n    col_s1, col_s2 = st.columns([2, 3])\n    with col_s1:\n        file_options = [t(\"all_option\", lang)] + [f[\"filename\"] for f in files]\n        selected_file_filter = st.selectbox(t(\"filter_by_file\", lang), options=file_options, key=\"repo_file_filter\")\n    with col_s2:\n        search_query = st.text_input(\n            t(\"search_label\", lang),\n            placeholder=t(\"search_code_or_name\", lang),\n            key=\"repo_search_input\"\n        )\n\n    filter_source = None if selected_file_filter == t(\"all_option\", lang) else selected_file_filter\n    matching_count = db.count_work_codes(search=search_query or None, source_file=filter_source)\n    st.caption(t(\"total_records\", lang, count=f\"{matching_count:,}\"))\n\n    # Pagination\n    page_size = 50\n    total_pages = max(1, (matching_count + page_size - 1) // page_size)\n    page_col1, page_col2 = st.columns([2, 8], vertical_alignment=\"center\")\n    with page_col1:\n        current_page_num = st.number_input(t(\"page_label\", lang), min_value=1, max_value=total_pages, value=1, step=1, key=\"repo_page_num\")\n    with page_col2:\n        st.caption(t(\"showing_page_info\", lang, current=current_page_num, total=total_pages))\n\n    offset = (current_page_num - 1) * page_size\n    records = db.get_work_codes(search=search_query or None, source_file=filter_source, limit=page_size, offset=offset)\n\n    if records:\n        for r in records:\n            r[\"unit\"] = extract_first_unit(r.get(\"unit\", \"\"))\n        df = pd.DataFrame(records)[[\"code\", \"raw_code\", \"name\", \"unit\", \"source_file\"]]\n        df.columns = [\n            t(\"col_norm_code\", lang),\n            t(\"col_raw_code\", lang),\n            t(\"col_work_name\", lang),\n            t(\"col_unit\", lang),\n            t(\"col_source_file\", lang)\n        ]\n        st.dataframe(df, use_container_width=True, hide_index=True)\n\n        # Export button with 1cm spacing from bottom\n        output = io.BytesIO()\n        with pd.ExcelWriter(output, engine='xlsxwriter') as writer:\n            df_all = pd.DataFrame(db.get_work_codes(search=search_query or None, source_file=filter_source, limit=10000, offset=0))\n            if not df_all.empty:\n                for idx_row in range(len(df_all)):\n                    df_all.at[idx_row, \"unit\"] = extract_first_unit(df_all.at[idx_row, \"unit\"])\n                df_all = df_all[[\"code\", \"raw_code\", \"name\", \"unit\", \"source_file\"]]\n                df_all.columns = [\n                    t(\"col_norm_code\", lang),\n                    t(\"col_raw_code\", lang),\n                    t(\"col_work_name\", lang),\n                    t(\"col_unit\", lang),\n                    t(\"col_source_file\", lang)\n                ]\n                df_all.to_excel(writer, sheet_name='Kho_Du_Lieu', index=False)\n        output.seek(0)\n        \n        # 1cm bottom spacing wrapper\n        st.markdown('\u003cdiv style=\"margin-top: 1rem; margin-bottom: 1cm; padding-bottom: 0.5cm;\">', unsafe_allow_html=True)\n        st.download_button(\n            label=f\"📥 {t('btn_export_repo', lang)}\",\n            data=output,\n            file_name=\"corebox_kho_du_lieu.xlsx\",\n            mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n            key=\"dl_btn_repo_xlsx\"\n        )\n        st.markdown('\u003c/div>', unsafe_allow_html=True)\n", "views/inspection.py": "import io\nimport streamlit as st\nimport pandas as pd\nfrom i18n import t\nfrom database import db\nfrom parsers import inspect_dgth_sheet\n\ndef render_inspection_view(lang: str):\n    \"\"\"\n    Renders Kiểm tra mã công việc (Work Code Inspection) view:\n    - In-memory session processing, zero permanent server storage\n    - Strict ĐGTH sheet check with openpyxl data_only=True\n    - Grouping by 'Hạng mục công trình' based on table headers & STT reset to 1\n    - Instant missing code detection\n    - Overview metrics & st.expander per section\n    - Downloadable Excel report\n    \"\"\"\n    st.markdown(f\"## 🔍 {t('inspect_title', lang)}\")\n    st.caption(t('inspect_desc', lang))\n    st.divider()\n\n    # Informational notice boxes\n    col_note1, col_note2 = st.columns(2)\n    with col_note1:\n        st.markdown(\n            f\"\"\"\n            \u003cdiv style=\"background:rgba(15,23,42,0.6); padding:0.85rem 1rem; border-radius:10px; border-left:4px solid #10b981; font-size:0.88rem;\">\n                {t('inspect_temp_note', lang)}\n            \u003c/div>\n            \"\"\",\n            unsafe_allow_html=True\n        )\n    with col_note2:\n        st.markdown(\n            f\"\"\"\n            \u003cdiv style=\"background:rgba(15,23,42,0.6); padding:0.85rem 1rem; border-radius:10px; border-left:4px solid #f59e0b; font-size:0.88rem;\">\n                {t('inspect_sheet_rule', lang)}\n            \u003c/div>\n            \"\"\",\n            unsafe_allow_html=True\n        )\n\n    st.markdown(\"\u003cbr>\", unsafe_allow_html=True)\n\n    # Check if repository is empty\n    total_repo_codes = db.count_work_codes()\n    if total_repo_codes == 0:\n        st.warning(f\"⚠️ {t('msg_repo_empty_warn', lang)}\")\n\n    uploaded_excel = st.file_uploader(\n        t(\"upload_inspect_label\", lang),\n        type=[\"xlsx\", \"xlsm\"],\n        key=\"inspect_file_uploader\",\n        help=t(\"inspect_upload_help\", lang)\n    )\n\n    if uploaded_excel is not None:\n        filename = uploaded_excel.name\n        col_act1, col_act2 = st.columns([3, 1], vertical_alignment=\"center\")\n        with col_act1:\n            st.write(f\"📄 **{t('inspect_file_selected', lang)}:** `{filename}` ({uploaded_excel.size / 1024:.1f} KB)\")\n        with col_act2:\n            inspect_btn = st.button(f\"🚀 {t('btn_inspect', lang)}\", type=\"primary\", use_container_width=True)\n\n        if inspect_btn or \"inspection_results\" in st.session_state:\n            if inspect_btn:\n                with st.spinner(t(\"inspecting_spinner\", lang)):\n                    file_bytes = uploaded_excel.getvalue()\n                    repo_lookup = db.get_all_codes_lookup()\n                    results = inspect_dgth_sheet(file_bytes, repo_lookup)\n                    st.session_state[\"inspection_results\"] = results\n                    st.session_state[\"inspection_file\"] = filename\n\n            results = st.session_state.get(\"inspection_results\")\n            if not results:\n                return\n\n            if not results.get(\"success\"):\n                st.error(f\"❌ {results.get('message', t('msg_sheet_dgth_not_found', lang))}\")\n                return\n\n            st.success(t(\"msg_inspect_success\", lang, filename=st.session_state.get(\"inspection_file\", filename)))\n\n            # METRIC OVERVIEW\n            st.markdown(f\"### 📊 {t('inspect_summary_metrics', lang)}\")\n            m_col1, m_col2, m_col3, m_col4 = st.columns(4)\n            with m_col1:\n                st.markdown(\n                    f\"\"\"\n                    \u003cdiv class=\"metric-card\">\n                        \u003cdiv style=\"color:#94a3b8; font-size:0.85rem; font-weight:600;\">{t('metric_total_items', lang)}\u003c/div>\n                        \u003cdiv class=\"metric-val metric-val-info\">{results['total_items']:,}\u003c/div>\n                    \u003c/div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n            with m_col2:\n                st.markdown(\n                    f\"\"\"\n                    \u003cdiv class=\"metric-card\">\n                        \u003cdiv style=\"color:#94a3b8; font-size:0.85rem; font-weight:600;\">{t('metric_valid_items', lang)}\u003c/div>\n                        \u003cdiv class=\"metric-val metric-val-success\">{results['valid_items']:,}\u003c/div>\n                    \u003c/div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n            with m_col3:\n                st.markdown(\n                    f\"\"\"\n                    \u003cdiv class=\"metric-card\">\n                        \u003cdiv style=\"color:#94a3b8; font-size:0.85rem; font-weight:600;\">{t('metric_error_items', lang)}\u003c/div>\n                        \u003cdiv class=\"metric-val metric-val-danger\">{results['error_items']:,}\u003c/div>\n                    \u003c/div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n            with m_col4:\n                st.markdown(\n                    f\"\"\"\n                    \u003cdiv class=\"metric-card\">\n                        \u003cdiv style=\"color:#94a3b8; font-size:0.85rem; font-weight:600;\">{t('metric_sections', lang)}\u003c/div>\n                        \u003cdiv class=\"metric-val metric-val-info\" style=\"color:#c084fc;\">{results['section_count']}\u003c/div>\n                    \u003c/div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n\n            st.markdown(\"\u003cbr>\", unsafe_allow_html=True)\n\n            # FILTER OPTIONS\n            filter_mode = st.radio(\n                t(\"filter_mode_label\", lang),\n                options=[t(\"filter_all\", lang), t(\"filter_errors\", lang), t(\"filter_valid\", lang)],\n                horizontal=True,\n                key=\"inspect_filter_mode\"\n            )\n\n            st.markdown(f\"### 📑 {t('inspect_results_by_section', lang)}\")\n\n            # EXPANDER PER SECTION (Hạng mục công trình)\n            export_rows = []\n\n            for s_idx, sec in enumerate(results[\"sections\"]):\n                sec_title = sec[\"title\"]\n                sec_total = sec[\"total_count\"]\n                sec_valid = sec[\"valid_count\"]\n                sec_error = sec[\"error_count\"]\n\n                status_badge = t(\"all_valid_badge\", lang) if sec_error == 0 else t(\"error_badge\", lang, count=sec_error)\n                expander_label = f\"📁 {sec_title}  ({sec_total} {t('jobs_count_label', lang)} | {status_badge})\"\n\n                is_expanded = (sec_error > 0)\n\n                with st.expander(expander_label, expanded=is_expanded):\n                    items = sec[\"items\"]\n                    if filter_mode == t(\"filter_errors\", lang):\n                        filtered_items = [it for it in items if it[\"status\"] != \"VALID\"]\n                    elif filter_mode == t(\"filter_valid\", lang):\n                        filtered_items = [it for it in items if it[\"status\"] == \"VALID\"]\n                    else:\n                        filtered_items = items\n\n                    if not filtered_items:\n                        st.info(t(\"no_matching_jobs\", lang))\n                    else:\n                        table_data = []\n                        for it in filtered_items:\n                            is_err = it[\"status\"] != \"VALID\"\n                            status_icon = t(\"status_not_found_icon\", lang) if is_err else t(\"status_valid_icon\", lang)\n                            table_data.append({\n                                t(\"th_stt\", lang): it[\"stt\"],\n                                t(\"th_excel_row\", lang): it[\"row_index\"],\n                                t(\"th_code_in_file\", lang): it[\"raw_code\"],\n                                t(\"th_code_normalized\", lang): it[\"norm_code\"],\n                                t(\"th_name_in_file\", lang): it[\"name_in_file\"],\n                                t(\"th_repo_name\", lang): it[\"repo_name\"] or \"—\",\n                                t(\"th_check_status\", lang): status_icon\n                            })\n                            export_rows.append({\n                                \"Hạng mục công trình\": sec_title,\n                                \"STT\": it[\"stt\"],\n                                \"Dòng Excel\": it[\"row_index\"],\n                                \"Mã trong file\": it[\"raw_code\"],\n                                \"Mã chuẩn hóa\": it[\"norm_code\"],\n                                \"Tên công việc trong file\": it[\"name_in_file\"],\n                                \"Tên trong kho\": it[\"repo_name\"],\n                                \"Trạng thái\": status_icon\n                            })\n\n                        df_sec = pd.DataFrame(table_data)\n                        st.dataframe(df_sec, use_container_width=True, hide_index=True)\n\n            # EXPORT INSPECTION REPORT BUTTON WITH 1CM BOTTOM SPACING\n            if export_rows:\n                st.divider()\n                rep_out = io.BytesIO()\n                with pd.ExcelWriter(rep_out, engine='xlsxwriter') as writer:\n                    df_rep = pd.DataFrame(export_rows)\n                    df_rep.to_excel(writer, sheet_name='Bao_Cao_Kiem_Tra', index=False)\n                rep_out.seek(0)\n\n                st.markdown('\u003cdiv style=\"margin-top: 1rem; margin-bottom: 1cm; padding-bottom: 0.5cm;\">', unsafe_allow_html=True)\n                st.download_button(\n                    label=f\"📥 {t('btn_export_inspect_report', lang)}\",\n                    data=rep_out,\n                    file_name=f\"bao_cao_kiem_tra_{st.session_state.get('inspection_file', 'DGTH')}.xlsx\",\n                    mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                    key=\"dl_btn_inspect_report\"\n                )\n                st.markdown('\u003c/div>', unsafe_allow_html=True)\n", "views/login.py": "import textwrap\nimport streamlit as st\nimport config\nfrom i18n import t\n\ndef safe_html(html_str: str):\n    clean_html = textwrap.dedent(html_str).strip()\n    if hasattr(st, \"html\"):\n        st.html(clean_html)\n    else:\n        st.markdown(clean_html, unsafe_allow_html=True)\n\ndef render_login_view(lang: str):\n    \"\"\"\n    Renders modern Split-Screen Google Login View (Google Cloud Console OAuth 2.0):\n    - Top Left: '← Back' button returning to home.\n    - Left Column: Bold Corebox branding, subtitle, mascots, footer.\n    - Right Column: 'Welcome back', official Google Identity Services OAuth button, security notice, terms.\n    \"\"\"\n    # Top Bar with Back Button\n    safe_html(f\"\"\"\n    \u003cdiv style=\"margin-bottom: 2rem; padding: 0.5rem 0;\">\n      \u003ca href=\"?page=home&lang={lang}\" onclick=\"return window.coreboxNav('home', '{lang}', event)\" target=\"_self\" class=\"login-back-btn\" style=\"\n        display: inline-flex;\n        align-items: center;\n        gap: 0.5rem;\n        color: #94a3b8;\n        text-decoration: none;\n        font-size: 0.95rem;\n        font-weight: 600;\n        padding: 0.4rem 0.8rem;\n        border-radius: 8px;\n        background: rgba(255, 255, 255, 0.04);\n        border: 1px solid rgba(255, 255, 255, 0.08);\n        transition: all 0.2s ease;\n      \">\n        {t('login_btn_back', lang)}\n      \u003c/a>\n    \u003c/div>\n    \"\"\")\n\n    col_left, col_space, col_right = st.columns([1.1, 0.15, 1.0])\n\n    with col_left:\n        # Left branding block styled like MapleTools reference in Image 1\n        safe_html(f\"\"\"\n        \u003cdiv style=\"padding-top: 2rem; padding-right: 1.5rem;\">\n          \u003cdiv class=\"hero-brand-name\" style=\"\n            font-size: 3.8rem;\n            line-height: 1.1;\n            margin-bottom: 1.2rem;\n            display: inline-block;\n          \">\n            Corebox\n          \u003c/div>\n          \u003cdiv style=\"\n            font-size: 1.25rem;\n            font-weight: 500;\n            color: #cbd5e1;\n            line-height: 1.6;\n            margin-bottom: 1.5rem;\n            max-width: 520px;\n          \">\n            {t('login_brand_subtitle', lang)}\n          \u003c/div>\n          \u003cdiv style=\"\n            font-size: 0.95rem;\n            color: #94a3b8;\n            line-height: 1.6;\n            margin-bottom: 3rem;\n            max-width: 500px;\n          \">\n            {t('login_brand_desc', lang)}\n          \u003c/div>\n\n          \u003cdiv style=\"font-size: 0.85rem; color: #64748b; line-height: 1.6; max-width: 480px;\">\n            {t('login_footnote', lang)}\n          \u003c/div>\n        \u003c/div>\n        \"\"\")\n\n    with col_right:\n        safe_html(f\"\"\"\n        \u003cdiv style=\"padding-top: 3.5rem; max-width: 440px;\">\n          \u003cdiv style=\"\n            font-size: 2rem;\n            font-weight: 700;\n            color: #ffffff;\n            letter-spacing: -0.02em;\n            margin-bottom: 0.4rem;\n          \">\n            {t('login_welcome_back', lang)}\n          \u003c/div>\n          \u003cdiv style=\"\n            font-size: 0.95rem;\n            color: #94a3b8;\n            margin-bottom: 2rem;\n          \">\n            {t('login_sync_subtitle', lang)}\n          \u003c/div>\n\n          \u003c!-- Official Google Identity Services Container -->\n          \u003cdiv id=\"g_id_onload\"\n               data-client_id=\"{config.GOOGLE_CLIENT_ID}\"\n               data-context=\"signin\"\n               data-ux_mode=\"popup\"\n               data-callback=\"handleGoogleCredentialResponse\"\n               data-auto_prompt=\"false\">\n          \u003c/div>\n          \n          \u003cdiv style=\"margin: 1.5rem 0; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent;\">\n            \u003c!-- Slot for Google rendered standard button -->\n            \u003cdiv id=\"google-signin-btn-slot\" style=\"background: transparent;\">\u003c/div>\n            \n            \u003c!-- Standard GSI fallback signin button -->\n            \u003cdiv class=\"g_id_signin\"\n                 data-type=\"standard\"\n                 data-shape=\"rectangular\"\n                 data-theme=\"filled_black\"\n                 data-text=\"continue_with\"\n                 data-size=\"large\"\n                 data-logo_alignment=\"left\"\n                 data-width=\"360\"\n                 style=\"background: transparent;\">\n            \u003c/div>\n          \u003c/div>\n\n          \u003c!-- Terms & Privacy Policy footer notice -->\n          \u003cdiv style=\"\n            margin-top: 2rem;\n            font-size: 0.82rem;\n            color: #64748b;\n            line-height: 1.6;\n            text-align: center;\n          \">\n            {t('login_terms_privacy', lang)}\n          \u003c/div>\n        \u003c/div>\n        \"\"\")\n"};

    function findBtn(name) {
      const keyElem = document.querySelector('.st-key-btn_' + name);
      if (keyElem) {
        const b = keyElem.querySelector('button');
        if (b) return b;
      }
      const btns = document.querySelectorAll('button');
      for (const b of btns) {
        if (b.innerText && b.innerText.trim() === name) return b;
      }
      return null;
    }

    window.coreboxNav = function(page, lang, e) {
      if (e && e.preventDefault) e.preventDefault();
      const url = new URL(window.location);
      if (page) url.searchParams.set("page", page);
      if (lang) url.searchParams.set("lang", lang);
      window.history.pushState({}, "", url);
      const btn = findBtn('nav_' + page);
      if (btn) {
        btn.click();
        return false;
      }
      window.location.href = url.toString();
      return false;
    };

    window.coreboxLang = function(newLang, e) {
      if (e && e.preventDefault) e.preventDefault();
      const url = new URL(window.location);
      url.searchParams.set("lang", newLang);
      window.history.pushState({}, "", url);
      const btn = findBtn('lang_' + newLang);
      if (btn) {
        btn.click();
        return false;
      }
      window.location.href = url.toString();
      return false;
    };

    window.coreboxAction = function(action, e) {
      if (e && e.preventDefault) e.preventDefault();
      const url = new URL(window.location);
      url.searchParams.set("action", action);
      if (action === "logout") {
        url.searchParams.delete("u");
      }
      window.history.pushState({}, "", url);
      const btn = findBtn('act_' + action);
      if (btn) {
        btn.click();
        return false;
      }
      window.location.href = url.toString();
      return false;
    };

    window.handleGoogleCredentialResponse = function(response) {
      if (!response || !response.credential) return;
      const url = new URL(window.location);
      url.searchParams.set("page", "home");
      url.searchParams.set("g_token", response.credential);
      window.location.href = url.toString();
    };

    window.initGoogleSignIn = function() {
      try {
        if (window.google && window.google.accounts && window.google.accounts.id) {
          window.google.accounts.id.initialize({
            client_id: "806346687682-2u257o2r9r330c6n9so3f4uj1ntm5rcb.apps.googleusercontent.com",
            callback: window.handleGoogleCredentialResponse,
            auto_select: false,
            cancel_on_tap_outside: true
          });
          const target = document.getElementById("google-signin-btn-slot");
          if (target && !target.hasChildNodes()) {
            window.google.accounts.id.renderButton(target, {
              theme: "filled_black",
              size: "large",
              shape: "rectangular",
              text: "continue_with",
              logo_alignment: "left",
              width: 360
            });
          }
        }
      } catch (e) {
        console.error("Google Identity Services error:", e);
      }
    };

    setInterval(() => {
      const target = document.getElementById("google-signin-btn-slot");
      if (target && !target.hasChildNodes()) {
        window.initGoogleSignIn();
      }
    }, 400);

    window.addEventListener("load", async () => {
      const loadStatus = document.getElementById("load-status");
      loadStatus.innerText = "Đang tải thư viện Python & Công cụ QLDA...";

      try {
        // Check if running on Cloudflare Access / Pages Functions to inject user email
        let cfUserEmail = null;
        try {
          const res = await fetch("/api/user");
          if (res.ok) {
            const data = await res.json();
            if (data.email) cfUserEmail = data.email;
          }
        } catch(e) {}

        stlite.mount({
          requirements: [
            "openpyxl",
            "python-docx",
            "pandas",
            "xlsxwriter"
          ],
          entrypoint: "app.py",
          files: bundledFiles,
          streamlitConfig: {
            "theme.base": "dark",
            "theme.primaryColor": "#38bdf8",
            "theme.backgroundColor": "#0b0f19",
            "theme.secondaryBackgroundColor": "#1e293b",
            "theme.textColor": "#f1f5f9"
          }
        }, document.getElementById("root"));

        // Hide loading screen once streamlit is mounted
        const checkReady = setInterval(() => {
          const appElement = document.querySelector(".stApp");
          if (appElement) {
            clearInterval(checkReady);
            const loader = document.getElementById("loading-screen");
            loader.style.opacity = "0";
            setTimeout(() => loader.remove(), 500);
          }
        }, 300);

      } catch (err) {
        loadStatus.innerText = "Lỗi khởi chạy: " + err.message;
        console.error(err);
      }
    });
  </script>
