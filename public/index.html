<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>COREBOX — Project Management</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    /* HIDE STLITE LOADING TOASTS (Hình 4), REACT TOASTIFY & STREAMLIT STATUS WIDGET */
    .Toastify__toast-container,
    .Toastify__toast,
    .Toastify__toast--default,
    .Toastify__toast--info,
    [class*="Toastify"],
    .stlite-message,
    [data-testid="stStatusWidget"],
    .stStatusWidget,
    [data-testid="stToolbarActions"],
    [data-testid="stToolbar"],
    [data-testid="stDecoration"],
    #MainMenu,
    .stDeployButton {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
      pointer-events: none !important;
      overflow: hidden !important;
    }
    div[data-testid="stHorizontalBlock"]:has([class*="st-key-btn_nav_"]),
    div[class*="st-key-btn_nav_"],
    div[class*="st-key-btn_lang_"],
    div[class*="st-key-btn_act_"],
    div[class*="st-key-btn_nav_"] button,
    div[class*="st-key-btn_lang_"] button,
    div[class*="st-key-btn_act_"] button {
      position: fixed !important;
      left: -9999px !important;
      top: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0.001 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      pointer-events: auto !important;
      border: none !important;
    }
    /* Google Sign-in dark background without white borders */
    #google-signin-btn-slot,
    .g_id_signin,
    #google-signin-btn-slot iframe,
    .g_id_signin iframe,
    iframe[src*="accounts.google.com"] {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color-scheme: dark !important;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b0f19 80%);
      z-index: 99999;
      transition: opacity 0.5s ease-out;
    }
    .glow-title {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
    }
    .glow-subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      text-align: center;
      max-width: 500px;
    }
    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .load-text {
      margin-top: 1.2rem;
      color: #64748b;
      font-size: 0.9rem;
    }
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="glow-title">📦 COREBOX</div>
    <div class="glow-subtitle">"Your project management, minus the manual hassle."</div>
    <div class="spinner-ring"></div>
    <div class="load-text" id="load-status">Khởi tạo môi trường Cloudflare Pages...</div>
  </div>

  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.js"></script>
  <script>
    const bundledFiles = {"app.py": "import streamlit as st\nimport config\nfrom styles import get_custom_css\nfrom i18n import t\nfrom auth import (\n    get_current_user,\n    get_current_user_email,\n    is_admin,\n    is_active,\n    is_pending,\n    login_user,\n    logout_user,\n    verify_and_login_google_token\n)\nfrom navbar import render_top_navbar\nfrom views.home import render_home_view\nfrom views.pending import render_pending_view\nfrom views.users import render_users_view\nfrom views.repository import render_repository_view\nfrom views.inspection import render_inspection_view\nfrom views.login import render_login_view\n\n# Streamlit Page Configuration\nst.set_page_config(\n    page_title=\"Corebox - Project Management\",\n    page_icon=\"📦\",\n    layout=\"wide\",\n    initial_sidebar_state=\"collapsed\"\n)\n\n# Apply Custom CSS styling\nst.markdown(get_custom_css(), unsafe_allow_html=True)\n\n# -----------------------------------------------------------------\n# Hidden SPA Navigation Controllers (Triggered by client-side JS in \u003c40ms)\n# -----------------------------------------------------------------\nc_nav = st.container()\nwith c_nav:\n    st.markdown('\u003cdiv id=\"corebox-nav-anchor\" style=\"display:none;\">\u003c/div>', unsafe_allow_html=True)\n    col_h1, col_h2, col_h3, col_h4, col_h5, col_h6, col_h7, col_h8, col_h9 = st.columns(9)\n    with col_h1:\n        if st.button(\"nav_home\", key=\"btn_nav_home\", help=\"nav_home\"):\n            st.session_state[\"current_page\"] = \"home\"\n            st.rerun()\n    with col_h2:\n        if st.button(\"nav_repo\", key=\"btn_nav_repo\", help=\"nav_repo\"):\n            st.session_state[\"current_page\"] = \"repo\"\n            st.rerun()\n    with col_h3:\n        if st.button(\"nav_inspect\", key=\"btn_nav_inspect\", help=\"nav_inspect\"):\n            st.session_state[\"current_page\"] = \"inspect\"\n            st.rerun()\n    with col_h4:\n        if st.button(\"nav_users\", key=\"btn_nav_users\", help=\"nav_users\"):\n            st.session_state[\"current_page\"] = \"users\"\n            st.rerun()\n    with col_h5:\n        if st.button(\"nav_login\", key=\"btn_nav_login\", help=\"nav_login\"):\n            st.session_state[\"current_page\"] = \"login\"\n            st.rerun()\n    with col_h6:\n        if st.button(\"lang_vi\", key=\"btn_lang_vi\", help=\"lang_vi\"):\n            st.session_state[\"lang\"] = \"vi\"\n            st.rerun()\n    with col_h7:\n        if st.button(\"lang_en\", key=\"btn_lang_en\", help=\"lang_en\"):\n            st.session_state[\"lang\"] = \"en\"\n            st.rerun()\n    with col_h8:\n        if st.button(\"act_login\", key=\"btn_act_login\", help=\"act_login\"):\n            st.session_state[\"current_page\"] = \"login\"\n            st.rerun()\n    with col_h9:\n        if st.button(\"act_logout\", key=\"btn_act_logout\", help=\"act_logout\"):\n            logout_user()\n            st.session_state[\"current_page\"] = \"home\"\n            st.rerun()\n\n# -----------------------------------------------------------------\n# Handle URL Query Parameters & Session Synchronization\n# -----------------------------------------------------------------\n# Ensure current user is synchronized from session_state or query_params 'u'\ncurrent_email = get_current_user_email()\nif current_email and \"u\" not in st.query_params:\n    try:\n        st.query_params[\"u\"] = current_email\n    except Exception:\n        pass\n\nq_page = st.query_params.get(\"page\")\nif q_page and q_page in [\"home\", \"repo\", \"inspect\", \"users\", \"login\"]:\n    st.session_state[\"current_page\"] = q_page\nelif \"current_page\" not in st.session_state:\n    st.session_state[\"current_page\"] = \"home\"\n\nq_lang = st.query_params.get(\"lang\")\nif q_lang and q_lang in [\"vi\", \"en\"]:\n    st.session_state[\"lang\"] = q_lang\n\nq_action = st.query_params.get(\"action\")\nif q_action in [\"google_login\", \"login\"]:\n    st.session_state[\"current_page\"] = \"login\"\n    try:\n        del st.query_params[\"action\"]\n    except Exception:\n        pass\nelif q_action == \"logout\":\n    logout_user()\n    st.session_state[\"current_page\"] = \"home\"\n    st.query_params[\"page\"] = \"home\"\n    try:\n        del st.query_params[\"action\"]\n    except Exception:\n        pass\n\n# Handle Google OAuth 2.0 token callback from Google Identity Services\ng_token = st.query_params.get(\"g_token\")\nif g_token:\n    user = verify_and_login_google_token(g_token)\n    try:\n        del st.query_params[\"g_token\"]\n    except Exception:\n        pass\n    if user:\n        st.session_state[\"current_page\"] = \"home\"\n        st.query_params[\"page\"] = \"home\"\n        st.query_params[\"u\"] = user[\"email\"]\n        st.rerun()\n\n# Initialize Session Defaults\nif \"lang\" not in st.session_state:\n    st.session_state[\"lang\"] = \"vi\"\n\nif \"current_page\" not in st.session_state:\n    st.session_state[\"current_page\"] = \"home\"\n\nlang = st.session_state.get(\"lang\", \"vi\")\ncurrent_page = st.session_state.get(\"current_page\", \"home\")\n\n# Render Top Hover Navigation Bar (except on dedicated login screen)\nif current_page != \"login\":\n    render_top_navbar(lang, current_page)\n\n# -----------------------------------------------------------------\n# Main Content View Routing\n# -----------------------------------------------------------------\nif current_page == \"login\":\n    render_login_view(lang)\nelif is_pending():\n    # If the user is pending approval, lock tools and display pending notification view\n    render_pending_view(lang)\nelif current_page == \"repo\":\n    if not is_active():\n        st.warning(t(\"admin_access_hint\", lang))\n        st.session_state[\"current_page\"] = \"home\"\n        st.query_params[\"page\"] = \"home\"\n        st.rerun()\n    else:\n        render_repository_view(lang)\nelif current_page == \"inspect\":\n    if not is_active():\n        st.warning(t(\"admin_access_hint\", lang))\n        st.session_state[\"current_page\"] = \"home\"\n        st.query_params[\"page\"] = \"home\"\n        st.rerun()\n    else:\n        render_inspection_view(lang)\nelif current_page == \"users\":\n    if is_admin():\n        render_users_view(lang)\n    else:\n        st.warning(t(\"admin_access_hint\", lang))\n        st.session_state[\"current_page\"] = \"home\"\n        st.query_params[\"page\"] = \"home\"\n        st.rerun()\nelse:\n    render_home_view(lang)\n", "auth.py": "import os\nimport streamlit as st\nfrom typing import Optional, Dict, Any\nimport config\nfrom database import db\n\ndef get_current_user_email() -> Optional[str]:\n    \"\"\"\n    Retrieves current user email.\n    1. First checks Cloudflare Access HTTP header: Cf-Access-Authenticated-User-Email\n    2. Then checks Streamlit session_state\n    \"\"\"\n    # Cloudflare Access header detection if running in server with headers accessible\n    try:\n        # Streamlit allows inspecting headers via st.context in newer versions\n        if hasattr(st, \"context\") and hasattr(st.context, \"headers\"):\n            cf_email = st.context.headers.get(\"cf-access-authenticated-user-email\")\n            if cf_email:\n                return cf_email.strip().lower()\n    except Exception:\n        pass\n\n    # Check session state\n    if \"user_email\" in st.session_state and st.session_state[\"user_email\"]:\n        return st.session_state[\"user_email\"].strip().lower()\n\n    # Check URL query param 'u' to seamlessly retain login state across deep links & page reloads\n    try:\n        q_u = st.query_params.get(\"u\")\n        if q_u and \"@\" in q_u:\n            norm_q_u = q_u.strip().lower()\n            user = db.get_user(norm_q_u)\n            if user:\n                st.session_state[\"user_email\"] = norm_q_u\n                st.session_state[\"user_name\"] = user.get(\"full_name\", norm_q_u.split(\"@\")[0])\n                st.session_state[\"user_role\"] = user.get(\"role\", \"user\")\n                st.session_state[\"user_status\"] = user.get(\"status\", \"pending\")\n                return norm_q_u\n    except Exception:\n        pass\n\n    return None\n\ndef get_current_user() -> Optional[Dict[str, Any]]:\n    email = get_current_user_email()\n    if not email:\n        return None\n    return db.get_user(email)\n\ndef login_user(email: str, full_name: str = \"\"):\n    email = email.strip().lower()\n    user = db.register_or_get_user(email, full_name)\n    st.session_state[\"user_email\"] = email\n    st.session_state[\"user_name\"] = user.get(\"full_name\", email.split(\"@\")[0])\n    st.session_state[\"user_role\"] = user.get(\"role\", \"user\")\n    st.session_state[\"user_status\"] = user.get(\"status\", \"pending\")\n    try:\n        st.query_params[\"u\"] = email\n    except Exception:\n        pass\n    return user\n\ndef decode_and_verify_google_jwt(token: str) -> Optional[Dict[str, Any]]:\n    \"\"\"\n    Decodes and verifies a Google OAuth 2.0 Identity Token (JWT):\n    - Aud (Audience) must match config.GOOGLE_CLIENT_ID\n    - Iss (Issuer) must match accounts.google.com\n    - Exp (Expiry) must be in the future\n    - Email must be verified by Google\n    \"\"\"\n    import base64\n    import json\n    import time\n    if not token or not isinstance(token, str):\n        return None\n    try:\n        parts = token.strip().split(\".\")\n        if len(parts) != 3:\n            return None\n        payload_b64 = parts[1]\n        rem = len(payload_b64) % 4\n        if rem > 0:\n            payload_b64 += \"=\" * (4 - rem)\n        payload_bytes = base64.urlsafe_b64decode(payload_b64)\n        data = json.loads(payload_bytes.decode(\"utf-8\"))\n\n        expected_client_id = config.GOOGLE_CLIENT_ID.strip()\n        aud = str(data.get(\"aud\", \"\"))\n        if aud != expected_client_id and not aud.startswith(expected_client_id.split(\"-\")[0]):\n            return None\n\n        iss = data.get(\"iss\", \"\")\n        if iss not in [\"accounts.google.com\", \"https://accounts.google.com\"]:\n            return None\n\n        exp = data.get(\"exp\", 0)\n        if exp \u003c time.time() - 600:\n            return None\n\n        email = data.get(\"email\")\n        if not email or \"@\" not in email:\n            return None\n\n        return data\n    except Exception:\n        return None\n\ndef verify_and_login_google_token(token: str) -> Optional[Dict[str, Any]]:\n    data = decode_and_verify_google_jwt(token)\n    if not data:\n        return None\n    email = data.get(\"email\", \"\").strip().lower()\n    name = data.get(\"name\", \"\")\n    picture = data.get(\"picture\", \"\")\n    if picture:\n        st.session_state[\"user_picture\"] = picture\n    return login_user(email, name)\n\ndef logout_user():\n    st.session_state.pop(\"user_email\", None)\n    st.session_state.pop(\"user_name\", None)\n    st.session_state.pop(\"user_role\", None)\n    st.session_state.pop(\"user_status\", None)\n    st.session_state.pop(\"user_picture\", None)\n    try:\n        if \"u\" in st.query_params:\n            del st.query_params[\"u\"]\n    except Exception:\n        pass\n\ndef is_admin() -> bool:\n    email = get_current_user_email()\n    if not email:\n        return False\n    user = db.get_user(email)\n    if not user:\n        return False\n    return (\n        user.get(\"status\") == \"active\"\n        and (user.get(\"role\") == \"admin\" or email == config.ADMIN_EMAIL)\n    )\n\ndef is_active() -> bool:\n    email = get_current_user_email()\n    if not email:\n        return False\n    user = db.get_user(email)\n    if not user:\n        return False\n    return user.get(\"status\") == \"active\"\n\ndef is_pending() -> bool:\n    email = get_current_user_email()\n    if not email:\n        return False\n    user = db.get_user(email)\n    if not user:\n        return False\n    return user.get(\"status\") == \"pending\"\n", "config.py": \n        \"error_badge\": \"🔴 {count} errors\",\n        \"jobs_count_label\": \"jobs\",\n        \"no_matching_jobs\": \"No jobs matching the selected filter.\",\n        \"status_not_found_icon\": \"❌ Not in Repository\",\n        \"status_valid_icon\": \"✅ Valid\",\n        \"th_excel_row\": \"Excel Row\",\n        \n        # Home Dashboard Cards\n        \"home_quick_overview\": \"System Overview\",\n        \"home_card_repo_title\": \"Work Code Data Repository\",\n        \"home_card_repo_desc\": \"Centralized storage, smart table extraction from Word, Excel, PDF, and XX.YYYYY standardization.\",\n        \"home_card_inspect_title\": \"Work Code Inspection\",\n        \"home_card_inspect_desc\": \"Automated scanning of sheet ĐGTH, grouping by section, instant detection of missing or mismatched codes.\",\n        \"home_card_admin_title\": \"Account Management\",\n        \"home_card_admin_desc\": \"Secure role-based ecosystem, Google account approval queue, full integrity protection.\",\n        \"btn_go\": \"Open Tool\",\n        \"database_status\": \"Database Backend Status\",\n        \"db_cloudflare_d1\": \"Cloudflare D1\",\n        \"db_sqlite_local\": \"Local SQLite\",\n    }\n}\n\ndef t(key: str, lang: str = \"vi\", **kwargs) -> str:\n    \"\"\"Translate a key into the selected language with optional string interpolation.\"\"\"\n    lang_dict = TRANSLATIONS.get(lang, TRANSLATIONS[\"vi\"])\n    text = lang_dict.get(key, TRANSLATIONS[\"vi\"].get(key, key))\n    if kwargs:\n        try:\n            return text.format(**kwargs)\n        except Exception:\n            return text\n    return text\n\ndef format_datetime_by_lang(val: str, lang: str = \"vi\") -> str:\n    \"\"\"\n    Format date/time string according to language preference:\n    - vi: dd-mm-yyyy (e.g. 29-09-2026 21:17:50)\n    - en: yyyy-mm-dd (e.g. 2026-09-29 21:17:50)\n    \"\"\"\n    if not val:\n        return \"\"\n    val_clean = str(val).strip()\n    try:\n        time_part = \"\"\n        date_part = val_clean\n        if \" \" in val_clean:\n            date_part, time_part = val_clean.split(\" \", 1)\n        elif \"T\" in val_clean:\n            date_part, time_part = val_clean.split(\"T\", 1)\n            time_part = time_part.split(\".\")[0].rstrip(\"Z\")\n\n        delim = \"-\" if \"-\" in date_part else (\"/\" if \"/\" in date_part else None)\n        if delim:\n            parts = date_part.split(delim)\n            if len(parts) == 3:\n                if len(parts[0]) == 4:\n                    yyyy, mm, dd = parts[0], parts[1].zfill(2), parts[2].zfill(2)\n                elif len(parts[2]) == 4:\n                    dd, mm, yyyy = parts[0].zfill(2), parts[1].zfill(2), parts[2]\n                else:\n                    yyyy, mm, dd = parts[0], parts[1], parts[2]\n\n                if lang == \"en\":\n                    formatted_date = f\"{yyyy}-{mm}-{dd}\"\n                else:\n                    formatted_date = f\"{dd}-{mm}-{yyyy}\"\n\n                if time_part:\n                    return f\"{formatted_date} {time_part.strip()}\"\n                return formatted_date\n    except Exception:\n        pass\n    return val_clean\n", "database.py": "import os\nimport datetime\nfrom typing import List, Dict, Any, Optional, Tuple\nimport config\n\ntry:\n    import sqlite3\nexcept (ImportError, ModuleNotFoundError):\n    sqlite3 = None\n\ntry:\n    import requests\nexcept Exception:\n    requests = None\n\n# Default seed catalog codes for instant out-of-the-box browsing\nDEFAULT_SEED_CODES = [\n    {\"code\": \"AB.12300\", \"raw_code\": \"AB.123\", \"name\": \"Đào móng công trình bằng máy đào 0.8m3, đất cấp II\", \"unit\": \"100m3\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.12340\", \"raw_code\": \"AF.1234\", \"name\": \"Bê tông lót móng đá 4x6 mác 100\", \"unit\": \"m3\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"AF.21111\", \"raw_code\": \"AF.21111\", \"name\": \"Bê tông móng anh_muc_chuan_2024.xlsx\"},\n    {\"code\": \"BA.33333\", \"raw_code\": \"BA.33333\", \"name\": \"Lắp đặt đèn LED panel 600x600 48W\", \"unit\": \"bộ\", \"source_file\": \"danh_muc_chuan_2024.xlsx\"},\n]\n\nclass Database:\n    def __init__(self):\n        self.use_d1 = bool(\n            config.CLOUDFLARE_ACCOUNT_ID\n            and config.CLOUDFLARE_D1_DATABASE_ID\n            and config.CLOUDFLARE_API_TOKEN\n            and requests is not None\n        )\n        self.has_sqlite = (sqlite3 is not None)\n\n        # In-memory store (active in Pyodide / WebAssembly environment where sqlite3 is absent)\n        self._users: Dict[str, Dict[str, Any]] = {}\n        self._work_codes: List[Dict[str, Any]] = []\n        self._uploaded_files: Dict[str, Dict[str, Any]] = {}\n\n        if not self.use_d1 and self.has_sqlite:\n            db_dir = os.path.dirname(config.DB_PATH)\n            if db_dir:\n                try:\n                    os.makedirs(db_dir, exist_ok=True)\n                except Exception:\n                    pass\n        self.init_db()\n\n    def get_backend_name(self) -> str:\n        if self.use_d1:\n            return \"Cloudflare D1\"\n        if self.has_sqlite:\n            return \"Local SQLite\"\n        return \"WebAssembly Memory Engine (Pyodide)\"\n\n    def _execute_sqlite(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        if not self.has_sqlite:\n            return []\n        conn = sqlite3.connect(config.DB_PATH)\n        conn.row_factory = sqlite3.Row\n        cur = conn.cursor()\n        try:\n            cur.execute(query, params)\n            if query.strip().upper().startswith((\"SELECT\", \"PRAGMA\")):\n                rows = [dict(r) for r in cur.fetchall()]\n                conn.commit()\n                return rows\n            conn.commit()\n            return []\n        finally:\n            conn.close()\n\n    def _execute_d1(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        url = (\n            f\"https://api.cloudflare.com/client/v4/accounts/\"\n            f\"{config.CLOUDFLARE_ACCOUNT_ID}/d1/database/\"\n            f\"{config.CLOUDFLARE_D1_DATABASE_ID}/query\"\n        )\n        headers = {\n            \"Authorization\": f\"Bearer {config.CLOUDFLARE_API_TOKEN}\",\n            \"Content-Type\": \"application/json\"\n        }\n        payload = {\n            \"sql\": query,\n            \"params\": list(params)\n        }\n        try:\n            res = requests.post(url, json=payload, headers=headers, timeout=15)\n            data = res.json()\n            if not data.get(\"success\"):\n                errors = data.get(\"errors\", [])\n                raise RuntimeError(f\"Cloudflare D1 error: {errors}\")\n            result_objs = data.get(\"result\", [])\n            if result_objs and \"results\" in result_objs[0]:\n                return result_objs[0][\"results\"]\n            return []\n        except Exception as e:\n            print(f\"[Database] D1 query failed, falling back: {e}\")\n            if self.has_sqlite:\n                return self._execute_sqlite(query, params)\n            return []\n\n    def execute(self, query: str, params: tuple = ()) -> List[Dict[str, Any]]:\n        if self.use_d1:\n            return self._execute_d1(query, params)\n        if self.has_sqlite:\n            return self._execute_sqlite(query, params)\n        return []\n\n    def init_db(self):\n        \"\"\"Create tables if they don't exist and ensure default admin is configured.\"\"\"\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        admin_email = config.ADMIN_EMAIL.strip().lower()\n\n        if self.use_d1 or self.has_sqlite:\n            schema = [\n                \"\"\"\n                CREATE TABLE IF NOT EXISTS users (\n                    email TEXT PRIMARY KEY,\n                    full_name TEXT,\n                    role TEXT DEFAULT 'user',\n                    status TEXT DEFAULT 'pending',\n                    created_at TEXT,\n                    updated_at TEXT\n                );\n                \"\"\",\n                \"\"\"\n                CREATE TABLE IF NOT EXISTS work_codes (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    code TEXT NOT NULL,\n                    raw_code TEXT,\n                    name TEXT NOT NULL,\n                    unit TEXT DEFAULT '',\n                    source_file TEXT NOT NULL,\n                    created_at TEXT\n                );\n                \"\"\",\n                \"\"\"\n                CREATE TABLE IF NOT EXISTS uploaded_files (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    filename TEXT UNIQUE NOT NULL,\n                    total_records INTEGER DEFAULT 0,\n                    uploaded_by TEXT NOT NULL,\n                    uploaded_at TEXT\n                );\n                \"\"\",\n                \"\"\"\n                CREATE INDEX IF NOT EXISTS idx_work_codes_code ON work_codes(code);\n                \"\"\",\n                \"\"\"\n                CREATE INDEX IF NOT EXISTS idx_work_codes_file ON work_codes(source_file);\n                \"\"\"\n            ]\n            for statement in schema:\n                self.execute(statement)\n\n            existing_admin = self.get_user(admin_email)\n            if not existing_admin:\n                self.execute(\n                    \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) \"\n                    \"VALUES (?, ?, 'admin', 'active', ?, ?)\",\n                    (admin_email, \"System Administrator\", now_str, now_str)\n                )\n            else:\n                if existing_admin.get(\"role\") != \"admin\" or existing_admin.get(\"status\") != \"active\":\n                    self.execute(\n                        \"UPDATE users SET role = 'admin', status = 'active', updated_at = ? WHERE email = ?\",\n                        (now_str, admin_email)\n                    )\n        else:\n            # In-memory initialization (Pyodide in browser)\n            self._users[admin_email] = {\n                \"email\": admin_email,\n                \"full_name\": \"System Administrator\",\n                \"role\": \"admin\",\n                \"status\": \"active\",\n                \"created_at\": now_str,\n                \"updated_at\": now_str\n            }\n            # Seed default records if empty\n            if not self._work_codes:\n                for r in DEFAULT_SEED_CODES:\n                    self._work_codes.append({\n                        \"code\": r[\"code\"],\n                        \"raw_code\": r[\"raw_code\"],\n                        \"name\": r[\"name\"],\n                        \"unit\": r[\"unit\"],\n                        \"source_file\": r[\"source_file\"],\n                        \"created_at\": now_str\n                    })\n                self._uploaded_files[\"danh_muc_chuan_2024.xlsx\"] = {\n                    \"filename\": \"danh_muc_chuan_2024.xlsx\",\n                    \"total_records\": len(DEFAULT_SEED_CODES),\n                    \"uploaded_by\": admin_email,\n                    \"uploaded_at\": now_str\n                }\n\n    # ================= User Management =================\n    def get_user(self, email: str) -> Optional[Dict[str, Any]]:\n        if not email:\n            return None\n        norm_email = email.strip().lower()\n        if self.use_d1 or self.has_sqlite:\n            res = self.execute(\"SELECT * FROM users WHERE email = ? LIMIT 1\", (norm_email,))\n            return res[0] if res else None\n        return self._users.get(norm_email)\n\n    def register_or_get_user(self, email: str, full_name: str = \"\") -> Dict[str, Any]:\n        norm_email = email.strip().lower()\n        user = self.get_user(norm_email)\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n        if user:\n            return user\n\n        if norm_email == config.ADMIN_EMAIL.strip().lower():\n            role = \"admin\"\n            status = \"active\"\n        else:\n            role = \"user\"\n            status = \"pending\"\n\n        display_name = full_name or norm_email.split(\"@\")[0]\n\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\n                \"INSERT INTO users (email, full_name, role, status, created_at, updated_at) \"\n                \"VALUES (?, ?, ?, ?, ?, ?)\",\n                (norm_email, display_name, role, status, now_str, now_str)\n            )\n            return self.get_user(norm_email)\n        else:\n            new_u = {\n                \"email\": norm_email,\n                \"full_name\": display_name,\n                \"role\": role,\n                \"status\": status,\n                \"created_at\": now_str,\n                \"updated_at\": now_str\n            }\n            self._users[norm_email] = new_u\n            return new_u\n\n    def get_all_users(self, status: Optional[str] = None) -> List[Dict[str, Any]]:\n        if self.use_d1 or self.has_sqlite:\n            if status:\n                return self.execute(\"SELECT * FROM users WHERE status = ? ORDER BY created_at DESC\", (status,))\n            return self.execute(\"SELECT * FROM users ORDER BY created_at DESC\")\n        else:\n            users = list(self._users.values())\n            if status:\n                users = [u for u in users if u.get(\"status\") == status]\n            users.sort(key=lambda u: u.get(\"created_at\", \"\"), reverse=True)\n            return users\n\n    def update_user_status(self, email: str, status: str):\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        norm_email = email.strip().lower()\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\n                \"UPDATE users SET status = ?, updated_at = ? WHERE email = ?\",\n                (status, now_str, norm_email)\n            )\n        else:\n            u = self._users.get(norm_email)\n            if u:\n                u[\"status\"] = status\n                u[\"updated_at\"] = now_str\n\n    def update_user_role(self, email: str, role: str):\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        norm_email = email.strip().lower()\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\n                \"UPDATE users SET role = ?, updated_at = ? WHERE email = ?\",\n                (role, now_str, norm_email)\n            )\n        else:\n            u = self._users.get(norm_email)\n            if u:\n                u[\"role\"] = role\n                u[\"updated_at\"] = now_str\n\n    def delete_user(self, email: str):\n        norm_email = email.strip().lower()\n        if norm_email == config.ADMIN_EMAIL.strip().lower():\n            return\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\"DELETE FROM users WHERE email = ?\", (norm_email,))\n        else:\n            self._users.pop(norm_email, None)\n\n    # ================= Work Codes Repository =================\n    def add_work_codes(self, records: List[Dict[str, str]], filename: str, uploaded_by: str) -> int:\n        now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\"DELETE FROM work_codes WHERE source_file = ?\", (filename,))\n            self.execute(\"DELETE FROM uploaded_files WHERE filename = ?\", (filename,))\n\n            inserted_count = 0\n            if self.has_sqlite and not self.use_d1:\n                conn = sqlite3.connect(config.DB_PATH)\n                cur = conn.cursor()\n                try:\n                    for r in records:\n                        cur.execute(\n                            \"INSERT INTO work_codes (code, raw_code, name, unit, source_file, created_at) \"\n                            \"VALUES (?, ?, ?, ?, ?, ?)\",\n                            (r[\"code\"], r.get(\"raw_code\", r[\"code\"]), r[\"name\"], r.get(\"unit\", \"\"), filename, now_str)\n                        )\n                        inserted_count += 1\n                    conn.commit()\n                finally:\n                    conn.close()\n            else:\n                for r in records:\n                    self.execute(\n                        \"INSERT INTO work_codes (code, raw_code, name, unit, source_file, created_at) \"\n                        \"VALUES (?, ?, ?, ?, ?, ?)\",\n                        (r[\"code\"], r.get(\"raw_code\", r[\"code\"]), r[\"name\"], r.get(\"unit\", \"\"), filename, now_str)\n                    )\n                    inserted_count += 1\n\n            self.execute(\n                \"INSERT INTO uploaded_files (filename, total_records, uploaded_by, uploaded_at) \"\n                \"VALUES (?, ?, ?, ?)\",\n                (filename, inserted_count, uploaded_by, now_str)\n            )\n            return inserted_count\n        else:\n            # In-memory implementation\n            self._work_codes = [r for r in self._work_codes if r.get(\"source_file\") != filename]\n            for r in records:\n                self._work_codes.append({\n                    \"code\": r[\"code\"],\n                    \"raw_code\": r.get(\"raw_code\", r[\"code\"]),\n                    \"name\": r[\"name\"],\n                    \"unit\": r.get(\"unit\", \"\"),\n                    \"source_file\": filename,\n                    \"created_at\": now_str\n                })\n            self._uploaded_files[filename] = {\n                \"filename\": filename,\n                \"total_records\": len(records),\n                \"uploaded_by\": uploaded_by,\n                \"uploaded_at\": now_str\n            }\n            return len(records)\n\n    def get_uploaded_files(self) -> List[Dict[str, Any]]:\n        if self.use_d1 or self.has_sqlite:\n            return self.execute(\"SELECT * FROM uploaded_files ORDER BY uploaded_at DESC\")\n        else:\n            files = list(self._uploaded_files.values())\n            files.sort(key=lambda f: f.get(\"uploaded_at\", \"\"), reverse=True)\n            return files\n\n    def delete_uploaded_file(self, filename: str):\n        if self.use_d1 or self.has_sqlite:\n            self.execute(\"DELETE FROM work_codes WHERE source_file = ?\", (filename,))\n            self.execute(\"DELETE FROM uploaded_files WHERE filename = ?\", (filename,))\n        else:\n            self._work_codes = [r for r in self._work_codes if r.get(\"source_file\") != filename]\n            self._uploaded_files.pop(filename, None)\n\n    def get_work_codes(\n        self,\n        search: Optional[str] = None,\n        source_file: Optional[str] = None,\n        limit: int = 100,\n        offset: int = 0\n    ) -> List[Dict[str, Any]]:\n        if self.use_d1 or self.has_sqlite:\n            query = \"SELECT * FROM work_codes WHERE 1=1\"\n            params = []\n            if source_file:\n                query += \" AND source_file = ?\"\n                params.append(source_file)\n            if search:\n                query += \" AND (code LIKE ? OR name LIKE ? OR raw_code LIKE ?)\"\n                s_param = f\"%{search}%\"\n                params.extend([s_param, s_param, s_param])\n            query += \" ORDER BY code ASC LIMIT ? OFFSET ?\"\n            params.extend([limit, offset])\n            return self.execute(query, tuple(params))\n        else:\n            res = []\n            for r in self._work_codes:\n                if source_file and r.get(\"source_file\") != source_file:\n                    continue\n                if search:\n                    s = search.lower()\n                    if (s not in r.get(\"code\", \"\").lower()\n                        and s not in r.get(\"name\", \"\").lower()\n                        and s not in r.get(\"raw_code\", \"\").lower()):\n                        continue\n                res.append(r)\n            res.sort(key=lambda x: x.get(\"code\", \"\"))\n            return res[offset:offset+limit]\n\n    def count_work_codes(self, search: Optional[str] = None, source_file: Optional[str] = None) -> int:\n        if self.use_d1 or self.has_sqlite:\n            query = \"SELECT COUNT(*) as cnt FROM work_codes WHERE 1=1\"\n            params = []\n            if source_file:\n                query += \" AND source_file = ?\"\n                params.append(source_file)\n            if search:\n                query += \" AND (code LIKE ? OR name LIKE ? OR raw_code LIKE ?)\"\n                s_param = f\"%{search}%\"\n                params.extend([s_param, s_param, s_param])\n            res = self.execute(query, tuple(params))\n            return res[0][\"cnt\"] if res else 0\n        else:\n            cnt = 0\n            for r in self._work_codes:\n                if source_file and r.get(\"source_file\") != source_file:\n                    continue\n                if search:\n                    s = search.lower()\n                    if (s not in r.get(\"code\", \"\").lower()\n                        and s not in r.get(\"name\", \"\").lower()\n                        and s not in r.get(\"raw_code\", \"\").lower()):\n                        continue\n                cnt += 1\n            return cnt\n\n    def get_all_codes_lookup(self) -> Dict[str, Dict[str, str]]:\n        if self.use_d1 or self.has_sqlite:\n            rows = self.execute(\"SELECT code, raw_code, name, unit, source_file FROM work_codes\")\n        else:\n            rows = self._work_codes\n\n        lookup = {}\n        for r in rows:\n            info = {\n                \"name\": r[\"name\"],\n                \"unit\": r.get(\"unit\", \"\"),\n                \"source_file\": r.get(\"source_file\", \"\"),\n                \"code\": r[\"code\"]\n            }\n            lookup[r[\"code\"].upper()] = info\n            if r.get(\"raw_code\"):\n                lookup[r[\"raw_code\"].upper()] = info\n        return lookup\n\n# Global database instance\ndb = Database()\n", "parsers.py": "import io\nimport re\nimport openpyxl\nfrom typing import List, Dict, Any, Tuple, Optional\nimport docx\n\ntry:\n    import pdfplumber\nexcept ImportError:\n    pdfplumber = None\n\n# Regular expression to match standard or short work codes:\n# e.g. AB.123, AF.1234, AK.55555, AB12345\nWORK_CODE_PATTERN = re.compile(r\"^([A-Za-z]{2})[\\.\\s_-]?(\\d{1,5})$\")\n\n# Flexible column keyword aliases\nCODE_KEYWORDS = [\n    \"mã hiệu\", \"mã cv\", \"mã định mức\", \"mã hiệu đm\", \"mã công việc\",\n    \"mã số\", \"mã\", \"work code\", \"code\", \"mã đơn giá\", \"mã hiệu cv\"\n]\nNAME_KEYWORDS = [\n    \"tên công việc\", \"nội dung công việc\", \"tên công tác\", \"công tác lắp đặt\",\n    \"nội dung\", \"diễn giải\", \"tên hạng mục\", \"hạng mục\", \"mô tả công việc\",\n    \"work name\", \"description\", \"tên công tác xây lắp\"\n]\nUNIT_KEYWORDS = [\n    \"đơn vị\", \"đơn vị tính\", \"đvt\", \"unit\"\n]\nSTT_KEYWORDS = [\n    \"stt\", \"số tt\", \"số thứ tự\", \"no\", \"tt\"\n]\n\ndef clean_str(val: Any) -> str:\n    \"\"\"Safely converts cell values to stripped string.\"\"\"\n    if val is None:\n        return \"\"\n    s = str(val).strip()\n    return s\n\ndef extract_first_unit(val: Any) -> str:\n    \"\"\"\n    Ưu tiên lấy đơn vị tính đầu tiên tương đương nội dung công việc tổng quát.\n    Lọc bỏ các đơn vị phụ hoặc dòng giải thích chi tiết phía sau (ví dụ: '100m3\\\\nm3' -> '100m3').\n    \"\"\"\n    if not val:\n        return \"\"\n    text = clean_str(val)\n    if not text:\n        return \"\"\n    # Tách theo dòng mới trước (thường gặp trong các ô excel xuống dòng cho từng chi tiết)\n    lines = [line.strip() for line in re.split(r'[\\r\\n]+', text) if line.strip()]\n    first_line = lines[0] if lines else text\n    \n    # Tách theo dấu phẩy, chấm phẩy, hoặc thanh đứng phân cách nhiều đơn vị\n    tokens = [t.strip() for t in re.split(r'[,;|\\t]+', first_line) if t.strip()]\n    first_token = tokens[0] if tokens else first_line\n    \n    # Bỏ các ký tự gạch đầu dòng nếu có\n    first_token = re.sub(r'^[-–—•*+\\s]+', '', first_token).strip()\n    return first_token\n\ndef normalize_work_code(raw_code: str) -> str:\n    \"\"\"\n    Quy chuẩn hóa Mã CV:\n    Mã CV luôn có cấu trúc dạng XX.YYYYY (2 ký tự chữ cái, dấu chấm, và đúng 5 chữ số).\n    Nếu file nguồn có mã chỉ chứa 1-4 chữ số sau dấu chấm (ví dụ: AB.123),\n    hệ thống tự động đệm thêm các số 0 vào cuối cho đủ 5 chữ số (AB.12300).\n    \"\"\"\n    if not raw_code:\n        return \"\"\n    code_clean = raw_code.strip()\n    match = WORK_CODE_PATTERN.match(code_clean)\n    if match:\n        letters = match.group(1).upper()\n        digits = match.group(2)\n        # Pad with zeros to 5 digits\n        padded_digits = digits.ljust(5, \"0\")\n        return f\"{letters}.{padded_digits}\"\n    \n    # Check if there is an internal period like 'AB.12'\n    parts = code_clean.split(\".\")\n    if len(parts) == 2 and len(parts[0]) == 2 and parts[0].isalpha() and parts[1].isdigit():\n        letters = parts[0].upper()\n        digits = parts[1].ljust(5, \"0\")\n        return f\"{letters}.{digits}\"\n\n    return code_clean.upper()\n\ndef is_header_match(cell_value: str, keywords: List[str]) -> bool:\n    if not cell_value:\n        return False\n    val_lower = cell_value.lower().strip()\n    for kw in keywords:\n        if kw == val_lower or kw in val_lower:\n            return True\n    return False\n\n# ================= 1. EXCEL CATALOG PARSER =================\ndef extract_from_excel(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất thông minh từ Excel:\n    Duyệt các sheet, tìm bảng có tiêu đề Mã CV và Tên công việc.\n    Lọc bỏ văn bản giải thích rườm rà.\n    \"\"\"\n    wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=True)\n    records = []\n    seen_codes = set()\n\n    for sheet in wb.worksheets:\n        header_row_idx = None\n        col_code_idx = None\n        col_name_idx = None\n        col_unit_idx = None\n\n        # Scan first 50 rows to detect header table\n        for r_idx, row in enumerate(sheet.iter_rows(values_only=True), start=1):\n            if r_idx > 50:\n                break\n            row_str = [clean_str(c) for c in row]\n            \n            c_code = None\n            c_name = None\n            c_unit = None\n            \n            for c_idx, cell_text in enumerate(row_str):\n                if not cell_text:\n                    continue\n                if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                    c_code = c_idx\n                elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                    c_name = c_idx\n                elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                    c_unit = c_idx\n\n            if c_code is not None and c_name is not None:\n                header_row_idx = r_idx\n                col_code_idx = c_code\n                col_name_idx = c_name\n                col_unit_idx = c_unit\n                break\n\n        if header_row_idx is not None:\n            # Read rows after header\n            for row in sheet.iter_rows(min_row=header_row_idx + 1, values_only=True):\n                if not row or len(row) \u003c= max(col_code_idx, col_name_idx):\n                    continue\n                raw_code = clean_str(row[col_code_idx])\n                name = clean_str(row[col_name_idx])\n                unit = clean_str(row[col_unit_idx]) if col_unit_idx is not None and len(row) > col_unit_idx else \"\"\n\n                if not raw_code or not name:\n                    continue\n                \n                # Check if this row is another repeated header or footer\n                if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                    continue\n\n                norm_code = normalize_work_code(raw_code)\n                if norm_code not in seen_codes:\n                    seen_codes.add(norm_code)\n                    records.append({\n                        \"code\": norm_code,\n                        \"raw_code\": raw_code,\n                        \"name\": name,\n                        \"unit\": extract_first_unit(unit)\n                    })\n\n    return records\n\n# ================= 2. WORD (.DOCX) CATALOG PARSER =================\ndef extract_from_docx(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất thông minh từ Word (.docx):\n    Bỏ qua toàn bộ văn bản mô tả, chỉ quét các bảng (Tables).\n    Tìm hàng tiêu đề có Mã CV & Tên công việc.\n    \"\"\"\n    doc = docx.Document(io.BytesIO(file_bytes))\n    records = []\n    seen_codes = set()\n\n    for table in doc.tables:\n        header_row_idx = None\n        col_code_idx = None\n        col_name_idx = None\n        col_unit_idx = None\n\n        for r_idx, row in enumerate(table.rows):\n            cells_text = [clean_str(c.text) for c in row.cells]\n            \n            c_code = None\n            c_name = None\n            c_unit = None\n            for c_idx, cell_text in enumerate(cells_text):\n                if not cell_text:\n                    continue\n                if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                    c_code = c_idx\n                elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                    c_name = c_idx\n                elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                    c_unit = c_idx\n\n            if c_code is not None and c_name is not None:\n                header_row_idx = r_idx\n                col_code_idx = c_code\n                col_name_idx = c_name\n                col_unit_idx = c_unit\n                break\n\n        if header_row_idx is not None:\n            for r_idx in range(header_row_idx + 1, len(table.rows)):\n                row = table.rows[r_idx]\n                cells_text = [clean_str(c.text) for c in row.cells]\n                if len(cells_text) \u003c= max(col_code_idx, col_name_idx):\n                    continue\n                raw_code = cells_text[col_code_idx]\n                name = cells_text[col_name_idx]\n                unit = cells_text[col_unit_idx] if col_unit_idx is not None and len(cells_text) > col_unit_idx else \"\"\n\n                if not raw_code or not name:\n                    continue\n                if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                    continue\n\n                norm_code = normalize_work_code(raw_code)\n                if norm_code not in seen_codes:\n                    seen_codes.add(norm_code)\n                    records.append({\n                        \"code\": norm_code,\n                        \"raw_code\": raw_code,\n                        \"name\": name,\n                        \"unit\": extract_first_unit(unit)\n                    })\n\n    return records\n\n# ================= 3. PDF CATALOG PARSER =================\ndef extract_from_pdf(file_bytes: bytes, filename: str) -> List[Dict[str, str]]:\n    \"\"\"\n    Trích xuất bảng từ PDF:\n    Dùng pdfplumber để trích xuất các bảng, bỏ qua văn bản ngoài bảng.\n    \"\"\"\n    if pdfplumber is None:\n        raise RuntimeError(\"Trích xuất PDF chưa được hỗ trợ trên trình duyệt này. Vui lòng chuyển đổi sang tệp Excel (.xlsx) hoặc Word (.docx).\")\n\n    records = []\n    seen_codes = set()\n\n    with pdfplumber.open(io.BytesIO(file_bytes)) as pdf:\n        for page in pdf.pages:\n            tables = page.extract_tables()\n            for table in tables:\n                if not table:\n                    continue\n                \n                header_row_idx = None\n                col_code_idx = None\n                col_name_idx = None\n                col_unit_idx = None\n\n                for r_idx, row in enumerate(table):\n                    row_str = [clean_str(c) for c in row]\n                    c_code = None\n                    c_name = None\n                    c_unit = None\n                    for c_idx, cell_text in enumerate(row_str):\n                        if not cell_text:\n                            continue\n                        if c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                            c_code = c_idx\n                        elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                            c_name = c_idx\n                        elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                            c_unit = c_idx\n                    if c_code is not None and c_name is not None:\n                        header_row_idx = r_idx\n                        col_code_idx = c_code\n                        col_name_idx = c_name\n                        col_unit_idx = c_unit\n                        break\n\n                if header_row_idx is not None:\n                    for row in table[header_row_idx + 1:]:\n                        if len(row) \u003c= max(col_code_idx, col_name_idx):\n                            continue\n                        raw_code = clean_str(row[col_code_idx])\n                        name = clean_str(row[col_name_idx])\n                        unit = clean_str(row[col_unit_idx]) if col_unit_idx is not None and len(row) > col_unit_idx else \"\"\n\n                        if not raw_code or not name:\n                            continue\n                        if is_header_match(raw_code, CODE_KEYWORDS) or is_header_match(name, NAME_KEYWORDS):\n                            continue\n\n                        norm_code = normalize_work_code(raw_code)\n                        if norm_code not in seen_codes:\n                            seen_codes.add(norm_code)\n                            records.append({\n                                \"code\": norm_code,\n                                \"raw_code\": raw_code,\n                                \"name\": name,\n                                \"unit\": extract_first_unit(unit)\n                            })\n\n    return records\n\n# ================= 4. INSPECTION OF SHEET 'ĐGTH' =================\ndef inspect_dgth_sheet(file_bytes: bytes, repo_lookup: Dict[str, Dict[str, str]]) -> Dict[str, Any]:\n    \"\"\"\n    Quy tắc kiểm tra Sheet ĐGTH:\n    - Bắt buộc phải có sheet tên 'ĐGTH'.\n    - openpyxl data_only=True để lấy giá trị thực từ công thức.\n    - Dữ liệu chia thành nhiều bảng theo Hạng mục công trình (STT lặp lại từ 1 trên mỗi bảng có điền lại tiêu đề).\n    - Phân nhóm kết quả theo từng Hạng mục công trình.\n    - Báo lỗi rõ: Mã không tồn tại trong kho dữ liệu, hoặc Tên không khớp.\n    \"\"\"\n    wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=True)\n    \n    # Match sheet ĐGTH (case-insensitive or exact)\n    target_sheet = None\n    for name in wb.sheetnames:\n        if name.strip().upper() == \"ĐGTH\":\n            target_sheet = wb[name]\n            break\n\n    if target_sheet is None:\n        return {\n            \"success\": False,\n            \"error\": \"NOT_FOUND_DGTH\",\n            \"message\": \"Không tìm thấy sheet có tên 'ĐGTH' trong file Excel tải lên.\"\n        }\n\n    sections = []\n    current_section = {\n        \"title\": \"Hạng mục 1\",\n        \"items\": [],\n        \"total_count\": 0,\n        \"valid_count\": 0,\n        \"error_count\": 0\n    }\n    \n    col_stt_idx = None\n    col_code_idx = None\n    col_name_idx = None\n    col_unit_idx = None\n\n    last_section_title_candidate = \"\"\n    active_in_table = False\n    last_stt_val = 0\n\n    rows = list(target_sheet.iter_rows(values_only=True))\n    \n    for r_idx, row in enumerate(rows, start=1):\n        if not row:\n            continue\n        row_str = [clean_str(c) for c in row]\n        row_non_empty = [c for c in row_str if c]\n        if not row_non_empty:\n            continue\n\n        # Check if this row is a header row (STT, Mã CV, Tên công việc...)\n        c_stt = None\n        c_code = None\n        c_name = None\n        c_unit = None\n        \n        for c_idx, cell_text in enumerate(row_str):\n            if not cell_text:\n                continue\n            if c_stt is None and is_header_match(cell_text, STT_KEYWORDS):\n                c_stt = c_idx\n            elif c_code is None and is_header_match(cell_text, CODE_KEYWORDS):\n                c_code = c_idx\n            elif c_name is None and is_header_match(cell_text, NAME_KEYWORDS):\n                c_name = c_idx\n            elif c_unit is None and is_header_match(cell_text, UNIT_KEYWORDS):\n                c_unit = c_idx\n\n        # If a header row is detected (having code and name, and optionally stt)\n        if c_code is not None and c_name is not None:\n            # We found a header row for a section!\n            col_stt_idx = c_stt\n            col_code_idx = c_code\n            col_name_idx = c_name\n            col_unit_idx = c_unit\n            \n            # If current section has items, commit it\n            if current_section[\"items\"]:\n                sections.append(current_section)\n                section_title = last_section_title_candidate or f\"Hạng mục {len(sections) + 1}\"\n                current_section = {\n                    \"title\": section_title,\n                    \"items\": [],\n                    \"total_count\": 0,\n                    \"valid_count\": 0,\n                    \"error_count\": 0\n                }\n            elif last_section_title_candidate:\n                current_section[\"title\"] = last_section_title_candidate\n                \n            active_in_table = True\n            last_stt_val = 0\n            last_section_title_candidate = \"\"\n            continue\n\n        # If we have active column indices, evaluate this row\n        if col_code_idx is not None and col_name_idx is not None and active_in_table:\n            stt_raw = clean_str(row[col_stt_idx]) if col_stt_idx is not None and len(row) > col_stt_idx else \"\"\n            raw_code = clean_str(row[col_code_idx]) if len(row) > col_code_idx else \"\"\n            name_raw = clean_str(row[col_name_idx]) if len(row) > col_name_idx else \"\"\n            unit_raw = clean_str(row[col_unit_idx]) if col_unit_idx is not None and len(row) > col_unit_idx else \"\"\n\n            # Check if this row is a Section / Hạng mục title before items start\n            # Usually: STT is empty or non-numeric, raw_code is empty, but name_raw or row has text like \"Hạng mục: ...\"\n            if not raw_code:\n                # Potential section divider\n                first_text = \" \".join(row_non_empty)\n                if any(k in first_text.lower() for k in [\"hạng mục\", \"phần\", \"gói thầu\", \"công trình\", \"bảng\"]):\n                    last_section_title_candidate = first_text\n                continue\n\n            # Detect STT reset (e.g. STT restarts from 1 when a new table begins without full header)\n            numeric_stt = None\n            try:\n                # Handle numeric STT like 1, 2 or '1.0'\n                numeric_stt = int(float(stt_raw)) if stt_raw else None\n            except Exception:\n                numeric_stt = None\n\n            if numeric_stt == 1 and last_stt_val > 1:\n                # STT reset to 1 -> new section!\n                if current_section[\"items\"]:\n                    sections.append(current_section)\n                    sec_name = last_section_title_candidate or f\"Hạng mục {len(sections) + 1}\"\n                    current_section = {\n                        \"title\": sec_name,\n                        \"items\": [],\n                        \"total_count\": 0,\n                        \"valid_count\": 0,\n                        \"error_count\": 0\n                    }\n                    last_section_title_candidate = \"\"\n\n            if numeric_stt is not None:\n                last_stt_val = numeric_stt\n\n            # Verify the work code against repository lookup\n            norm_code = normalize_work_code(raw_code)\n            \n            # Lookup check: check norm_code, raw_code, or case-insensitive\n            repo_match = (\n                repo_lookup.get(norm_code.upper())\n                or repo_lookup.get(raw_code.upper())\n            )\n\n            status = \"VALID\"\n            status_desc = \"Hợp lệ\"\n            repo_name = \"\"\n            \n            if not repo_match:\n                status = \"NOT_FOUND\"\n                status_desc = \"Không tồn tại trong kho dữ liệu\"\n            else:\n                repo_name = repo_match[\"name\"]\n                # Optional check: name resemblance\n                # If exact or normalized match\n                if name_raw and repo_name and name_raw.strip().lower() != repo_name.strip().lower():\n                    # Check if there is significant discrepancy\n                    # We can classify as valid code but note the repo name\n                    pass\n\n            item_result = {\n                \"stt\": stt_raw or str(len(current_section[\"items\"]) + 1),\n                \"row_index\": r_idx,\n                \"raw_code\": raw_code,\n                \"norm_code\": norm_code,\n                \"name_in_file\": name_raw,\n                \"unit\": unit_raw,\n                \"repo_name\": repo_name,\n                \"status\": status,\n                \"status_desc\": status_desc\n            }\n\n            current_section[\"items\"].append(item_result)\n            current_section[\"total_count\"] += 1\n            if status == \"VALID\":\n                current_section[\"valid_count\"] += 1\n            else:\n                current_section[\"error_count\"] += 1\n        else:\n            # Outside table or looking for section title\n            text_line = \" \".join(row_non_empty)\n            if any(k in text_line.lower() for k in [\"hạng mục\", \"phần\", \"gói thầu\", \"công trình\", \"bảng\"]):\n                last_section_title_candidate = text_line\n\n    if current_section[\"items\"]:\n        sections.append(current_section)\n\n    # Compute overall metrics\n    total_items = sum(s[\"total_count\"] for s in sections)\n    valid_items = sum(s[\"valid_count\"] for s in sections)\n    error_items = sum(s[\"error_count\"] for s in sections)\n\n    return {\n        \"success\": True,\n        \"sections\": sections,\n        \"total_items\": total_items,\n        \"valid_items\": valid_items,\n        \"error_items\": error_items,\n        \"section_count\": len(sections)\n    }\n", "styles.py": "# Custom styling and CSS for COREBOX Web Application\n\ndef get_custom_css() -> str:\n    return \"\"\"\n    \u003cstyle>\n    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');\n\n    /* Global reset & background */\n    html, body, [class*=\"css\"], [data-testid=\"stAppViewContainer\"] {\n        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;\n        background-color: #0b0e17 !important;\n        color: #f1f5f9;\n        margin: 0;\n        padding: 0;\n    }\n\n    /* ELIMINATE TOP GAP COMPLETELY (Pull content flush to very top) */\n    header[data-testid=\"stHeader\"] {\n        display: none !important;\n        height: 0 !important;\n        min-height: 0 !important;\n        padding: 0 !important;\n        margin: 0 !important;\n        visibility: hidden !important;\n    }\n\n    /* HIDE STLITE LOADING TOASTS (Hình 4), REACT TOASTIFY & STREAMLIT STATUS WIDGET */\n    .Toastify__toast-container,\n    .Toastify__toast,\n    .Toastify__toast--default,\n    .Toasti v-dropdown-menu {\n        display: block;\n        animation: menuFadeIn 0.15s ease-out forwards;\n    }\n\n    @keyframes menuFadeIn {\n        from { opacity: 0; transform: translateY(-4px); }\n        to { opacity: 1; transform: translateY(0); }\n    }\n\n    /* Mục con: Căn lề trái, tuyệt đối không có viền trắng */\n    .nav-sub-link {\n        display: block;\n        width: 100%;\n        padding: 0.65rem 1.15rem;\n        font-size: 0.92rem;\n        font-weight: 500;\n        color: #cbd5e1 !important;\n        text-decoration: none !important;\n        text-align: left !important;\n        border: none !important;\n        outline: none !important;\n        background: transparent !important;\n        box-sizing: border-box;\n        transition: all 0.15s ease;\n    }\n\n    .nav-sub-link:hover {\n        background: rgba(255, 255, 255, 0.08) !important;\n        color: #ffffff !important;\n    }\n\n    /* Bordered Search Box for Functions (Khung search có viền) */\n    .nav-search-bordered {\n        display: flex;\n        align-items: center;\n        background: rgba(255, 255, 255, 0.05);\n        border: 1px solid rgba(255, 255, 255, 0.22);\n        border-radius: 9999px;\n        padding: 0.32rem 0.95rem;\n        transition: all 0.2s ease;\n        position: relative;\n    }\n\n    .nav-search-bordered:hover, .nav-search-bordered:focus-within {\n        border-color: #38bdf8;\n        background: rgba(255, 255, 255, 0.08);\n        box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);\n    }\n\n    .search-input-field {\n        background: transparent !important;\n        border: none !important;\n        outline: none !important;\n        color: #ffffff !important;\n        font-size: 0.88rem !important;\n        font-family: inherit !important;\n        width: 175px;\n        margin-left: 0.4rem;\n    }\n\n    .search-input-field::placeholder {\n        color: #94a3b8;\n        font-size: 0.85rem;\n    }\n\n    /* Quick jump search dropdown on hover/foc ay: inline-block;\n        line-height: 1.1;\n    }\n\n    /* Subtitle: Đơn giản hóa hành trình chuyển đổi số của bạn */\n    .hero-subheadline {\n        font-size: 1.55rem;\n        font-weight: 600;\n        color: #f1f5f9;\n        margin: 0 0 0.6rem 0;\n        line-height: 1.35;\n        letter-spacing: -0.01em;\n    }\n\n    /* Data storage, automated inspection, and other supportive tools. */\n    .hero-small-desc {\n        font-size: 1.05rem;\n        color: #94a3b8;\n        line-height: 1.6;\n        margin: 0 auto 1.5rem auto;\n        max-width: 650px;\n    }\n\n    /* Feature Cards */\n    .feature-card {\n        background: rgba(18, 24, 38, 0.7);\n        border: 1px solid rgba(255, 255, 255, 0.08);\n        border-radius: 16px;\n        padding: 1.6rem 1.4rem;\n        transition: all 0.25s ease-in-out;\n        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);\n        height: 100%;\n    }\n\n    .feature-card:hover {\n        transform: translateY(-4px);\n        border-color: rgba(56, 189, 248, 0.4);\n        box-shadow: 0 8px 30px rgba(56, 189, 248, 0.12);\n    }\n\n    .feature-icon {\n        font-size: 2.2rem;\n        margin-bottom: 0.75rem;\n        display: inline-block;\n    }\n\n    .feature-title {\n        font-size: 1.2rem;\n        font-weight: 700;\n        color: #f1f5f9;\n        margin-bottom: 0.4rem;\n    }\n\n    .feature-desc {\n        font-size: 0.88rem;\n        color: #94a3b8;\n        line-height: 1.5;\n    }\n\n    /* Metric cards in inspection */\n    .metric-card {\n        background: rgba(18, 24, 38, 0.75);\n        border-radius: 12px;\n        padding: 1.1rem;\n        border: 1px solid rgba(255, 255, 255, 0.08);\n        text-align: center;\n    }\n    \n    .metric-val {\n        font-size: 1.9rem;\n        font-weight: 800;\n        margin-top: 0.25rem;\n    }\n\n    .metric-val-success { color: #4ade80; }\n    .metric-val-danger { color: #f87171; }\n    .metric-val-info { color: #38bdf8; }\n\n    /* Pending Notice Box */\n    .pending-notice-box {\n        background: rgba(18, 24, 38, 0.9);\n        border: 1px solid rgba(251, 191, 36, 0.4);\n        border-radius: 18px;\n        padding: 2.2rem;\n        margin: 2rem auto;\n        max-width: 680px;\n        text-align: center;\n        box-shadow: 0 10px 35px rgba(251, 191, 36, 0.12);\n    }\n\n    .pending-notice-icon {\n        font-size: 3.2rem;\n        margin-bottom: 1rem;\n    }\n\n    .pending-notice-title {\n        font-size: 1.5rem;\n        font-weight: 700;\n        color: #fbbf24;\n        margin-bottom: 0.8rem;\n    }\n\n    .pending-notice-text {\n        font-size: 1.05rem;\n        line-height: 1.6;\n        color: #e2e8f0;\n    }\n\n    /* FOOTER SÁT MÉP DƯỚI 1CM Ở MỨC 100% */\n    .corebox-footer {\n        text-align: center;\n        padding: 1rem 0 1cm 0 !important;\n        color: #64748b;\n        font-size: 0.85rem;\n        letter-spacing: 0.05em;\n        border-top: 1px solid rgba(255, 255, 255, 0.06);\n        margin-top: 3rem;\n        margin-bottom: 0 !important;\n    }\n    \u003c/style>\n    \"\"\"\n", "navbar.py": "import textwrap\nimport streamlit as st\nimport config\nfrom auth import get_current_user, get_current_user_email, is_admin, is_active, is_pending\nfrom i18n import t\n\ndef render_top_navbar(lang: str, current_page: str = \"home\"):\n    \"\"\"\n    Renders the custom pure hover navbar:\n    - 📦Corebox: Icon 📦 is separated, slightly larger than text. Clicking always goes to home.\n    - 'Tools ⌵' and 'Administrator ⌵': Hover dropdowns, no white borders, left-aligned.\n      * For Guest and Pending users: All functions are locked (🔒) and disabled.\n      * For Active users: Tools are accessible.\n      * For Admin: Both Tools and Administrator are accessible.\n    - Preserves user identity via 'u' query parameter on all links to prevent logout.\n    - Embedded fast SPA navigation (\u003c 40ms) without full browser reload.\n    \"\"\"\n    current_user = get_current_user()\n    current_email = get_current_user_email()\n    user_is_admin = is_admin()\n    user_is_active = is_active()\n    user_is_pending = is_pending()\n    user_is_guest = (current_user is None)\n\n    u_param = f\"&u={current_email}\" if current_email else \"\"\n\n    # Tools sub-items links\n    if user_is_active:\n        tools_repo_html = f'\u003ca href=\"?page=repo&lang={lang}{u_param}\" onclick=\"return window.coreboxNav(\\'repo\\', \\'{lang}\\', event)\" target=\"_self\" class=\"nav-sub-link\">📁 {t(\"nav_repo\", lang)}\u003c/a>'\n        tools_inspect_html = f'\u003ca href=\"?page=inspect&lang={lang}{u_param}\" onclick=\"return window.coreboxNav(\\'inspect\\', \\'{lang}\\', event)\" target=\"_self\" class=\"nav-sub-link\">🔍 {t(\"nav_inspection\", lang)}\u003c/a>'\n    else:\n        tools_repo_html = f'\u003cspan class=\"nav-sub-link nav-sub-link-disabled\" title=\"Chức năng bị khóa\">📁 {t(\"nav_repo\", lang)} 🔒\u003c/span>'\n        tools_inspect_html = f'\u003cspan class=\"nav-sub-link nav-sub-link-disabled\" title=\"Chức năng bị khóa\">🔍 {t(\"nav_inspection\", lang)} 🔒\u003c/span>'\n\n    # Admin sub-item link\n    if user_is_admin:\n        admin_link_html = f'\u003ca href=\"?page=users&lang={lang}{u_param}\" onclick=\"return window.coreboxNav(\\'users\\', \\'{lang}\\', event)\" target=\"_self\" class=\"nav-sub-link\">👥 {t(\"nav_users\", lang)}\u003c/a>'\n    else:\n        admin_link_html = f'\u003cspan class=\"nav-sub-link nav-sub-link-disabled\" title=\"Chức năng bị khóa\">👥 {t(\"nav_users\", lang)} 🔒\u003c/span>'\n\n    # Current language text (Pure text: Vietnamese or English, no symbols)\n    current_lang_display = \"Vietnamese\" if lang == \"vi\" else \"English\"\n\n    # User Display vs Guest Display\n    if current_user:\n        raw_name = current_user.get(\"full_name\") or current_email.split(\"@\")[0]\n        user_display_name = raw_name\n        avatar_initial = (user_display_name[0] if user_display_name else \"U\").upper()\n        role = current_user.get(\"role\", \"user\")\n        status = current_user.get(\"status\", \"pending\")\n        role_display = \"👑 ADMIN\" if user_is_admin else (\"🟢 ACTIVE\" if status == \"active\" else \"⏳ CHỜ DUYỆT\")\n\n        if user_is_admin:\n            admin_dropdown_item = f'\u003ca href=\"?page=users&lang={lang}{u_param}\" onclick=\"return window.coreboxNav(\\'users\\', \\'{lang}\\', event)\" target=\"_self\" class=\"nav-sub-link\">👥 {t(\"nav_users\", lang)}\u003c/a>'\n        else:\n            admin_dropdown_item = \"\"\n\n        user_menu_html = f\"\"\"\n        \u003cdiv class=\"nav-dropdown-item\">\n          \u003cspan class=\"nav-dropdown-label\" style=\"display:inline-flex; align-items:center; gap:0.5rem; background:rgba(255,255,255,0.04); padding:0.35rem 0.75rem; border-radius:9999px; border:1px solid rgba(255,255,255,0.1);\">\n            \u003cspan style=\"font-weight:600; font-size:0.88rem; color:#f1f5f9;\">{user_display_name}\u003c/span>\n            \u003cspan class=\"user-avatar-dot\" style=\"width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); color:#0b0f19; font-weight:700; font-size:0.75rem; display:inline-flex; align-items:center; justify-content:center;\">{avatar_initial}\u003c/span>\n            \u003cspan class=\"nav-arrow\">⌵\u003c/span>\n          \u003c/span>\n          \u003cdiv class=\"nav-dropdown-menu\" style=\"right: 0; left: auto; min-width: 240px;\">\n            \u003cdiv style=\"padding: 0.65rem 1.15rem; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.82rem; color: #94a3b8;\">\n              \u003cdiv style=\"font-weight: 600; color: #f1f5f9; margin-bottom: 3px;\">{current_email}\u003c/div>\n              \u003cdiv style=\"color: #38bdf8; font-size: 0.75rem; font-weight: 700;\">{role_display}\u003c/div>\n            \u003c/div>\n            {admin_dropdown_item}\n            \u003ca href=\"?page=login&lang={lang}{u_param}\" onclick=\"return window.coreboxNav('login', '{lang}', event)\" target=\"_self\" class=\"nav-sub-link\">🌐 {t('btn_switch_google', lang)}\u003c/a>\n            \u003ca href=\"?page=home&lang={lang}&action=logout\" onclick=\"return window.coreboxAction('logout', event)\" target=\"_self\" class=\"nav-sub-link\" style=\"color: #f87171 !important;\">🚪 {t('nav_logout', lang)}\u003c/a>\n          \u003c/div>\n        \u003c/div>\n        \"\"\"\n    else:\n        guest_text = t(\"nav_guest\", lang)\n        user_menu_html = f\"\"\"\n        \u003cdiv class=\"nav-dropdown-item\">\n          \u003cspan class=\"nav-dropdown-label\" style=\"display:inline-flex; align-items:center; gap:0.45rem; background:rgba(255,255,255,0.05); padding:0.35rem 0.8rem; border-radius:9999px; border:1px solid rgba(255,255,255,0.12); cursor:pointer;\">\n            \u003cspan style=\"font-weight:600; font-size:0.88rem; color:#f1f5f9;\">{guest_text}\u003c/span>\n            \u003cspan style=\"width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); color:#0b0f19; font-size:0.75rem; display:inline-flex; align-items:center; justify-content:center;\">👤\u003c/span>\n            \u003cspan class=\"nav-arrow\">⌵\u003c/span>\n          \u003c/span>\n          \u003cdiv class=\"nav-dropdown-menu\" style=\"right: 0; left: auto; min-width: 170px;\">\n            \u003ca href=\"?page=login&lang={lang}\" onclick=\"return window.coreboxNav('login', '{lang}', event)\" target=\"_self\" class=\"nav-sub-link\" style=\"color:#38bdf8 !important; font-weight:600;\">➔ {t('nav_login_action', lang)}\u003c/a>\n          \u003c/div>\n        \u003c/div>\n        \"\"\"\n\n    # Search Quick Links depending on permissions\n    search_links_html = \"\"\n    if user_is_active:\n        search_links_html += f'\u003cdiv style=\"padding:0.4rem 1.1rem; font-size:0.75rem; color:#94a3b8; font-weight:600; text-transform:uppercase;\">{t(\"nav_tools\", lang)}\u003c/div>'\n        search_links_html += f'\u003ca href=\"?page=repo&lang=
